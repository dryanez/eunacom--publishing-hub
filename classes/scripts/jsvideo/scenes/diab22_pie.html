<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0E1116;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="../lib.js"></script><script src="../kit.js"></script>
<script>
// diab-22: neuropatía (más del 80 %) + isquemia + un trauma que no se siente → úlcera → infección. Monofilamento de 10 g
// una vez al año; si el estilete toca hueso, osteomielitis. Base: pie diabético, Servier Medical Art (CC BY 4.0).
window.SCENE = { duration: 23, fps: 30 };
const L = LIB(document.getElementById('c')), { ctx, C, ease, clamp, lerp, text, tag, rrect } = L;
const K = KIT(L), { seg, fade } = K;
const S = 0.62, OX = 30, OY = 135, F = (x, y) => [OX + x * S, OY + y * S];
const ULC = F(235, 872), PULSE = F(600, 600);

window.render = function (t) {
  ctx.fillStyle = C.BG; ctx.fillRect(0, 0, 1280, 720);
  K.title('Pie diabético: por qué se ulcera', 'Tres causas que se juntan', C.AMBER);
  ctx.globalAlpha = seg(t, 0, 0.7); ctx.drawImage(window.IMGS.pie, OX, OY, 1015 * S, 909 * S); ctx.globalAlpha = 1;
  // 1. neuropatía: el monofilamento presiona y el paciente no siente
  const n = fade(t, 1.2, 7.0, 0.5);
  if (n > 0) {
    const pts = [F(120, 885), F(330, 885), F(500, 880)];
    pts.forEach(([x, y], i) => {
      const k = seg(t, 1.6 + i * 1.2, 0.8), press = Math.sin(k * Math.PI);
      ctx.globalAlpha = n; ctx.strokeStyle = '#E8E8E8'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x, y + 30); ctx.quadraticCurveTo(x + 8 * press, y + 16, x, y + 4 * press); ctx.stroke();
      ctx.fillStyle = '#4FA3FF'; ctx.fillRect(x - 6, y + 30, 12, 8);
      if (k >= 1) { ctx.strokeStyle = C.RED; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x - 10, y - 30); ctx.lineTo(x + 10, y - 10); ctx.moveTo(x + 10, y - 30); ctx.lineTo(x - 10, y - 10); ctx.stroke(); }
    });
    ctx.globalAlpha = n; tag('Monofilamento 10 g: no lo siente', 330, 650, C.BLUE, 17); ctx.globalAlpha = 1;
  }
  // 2. isquemia: el pulso pedio late y se apaga
  const p = seg(t, 6.5, 0.5);
  if (p > 0) {
    const weak = seg(t, 7.5, 2.5), beat = Math.max(0, Math.sin(t * 7)) * (1 - weak);
    if (weak > 0) { ctx.save(); ctx.globalAlpha = 0.75 * weak; ctx.filter = 'saturate(0.25) brightness(1.08)'; ctx.drawImage(window.IMGS.pie, OX, OY, 1015 * S, 909 * S); ctx.restore(); }
    ctx.globalAlpha = p; ctx.strokeStyle = C.RED; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(...PULSE, 14 + 16 * beat, 0, 7); ctx.stroke();
    ctx.fillStyle = weak > 0.9 ? '#777' : C.RED; ctx.beginPath(); ctx.arc(...PULSE, 7, 0, 7); ctx.fill();
    tag('Pulso pedio ausente', PULSE[0] + 120, PULSE[1] - 40, C.RED, 17);
    ctx.globalAlpha = 1;
  }
  // 3. trauma: una piedra en el zapato que no se siente
  const tr = fade(t, 10.5, 14.5, 0.5);
  if (tr > 0) { ctx.globalAlpha = tr; ctx.fillStyle = '#8A8F98'; ctx.beginPath(); ctx.ellipse(ULC[0], ULC[1] + 12 - 6 * seg(t, 11, 1), 16, 10, 0.3, 0, 7); ctx.fill(); tag('Roce o cuerpo extraño', ULC[0] + 40, ULC[1] - 60, '#B0B6C0', 17); ctx.globalAlpha = 1; }
  // úlcera
  const u = ease(seg(t, 13.5, 2));
  if (u > 0) {
    ctx.fillStyle = `rgba(110,10,20,${0.9 * u})`; ctx.beginPath(); ctx.ellipse(ULC[0], ULC[1] - 4, 34 * u, 13 * u, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = `rgba(240,200,120,${0.8 * u})`; ctx.lineWidth = 3; ctx.stroke();
    ctx.globalAlpha = fade(t, 14, 17.2); tag('Úlcera que no duele', ULC[0] + 40, ULC[1] - 60, C.RED, 17); ctx.globalAlpha = 1;
  }
  // estilete que toca hueso
  const e = seg(t, 17.2, 1.4);
  if (e > 0) {
    const [x, y] = ULC, d = ease(e);
    ctx.strokeStyle = '#DDE3EA'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x + 120, y - 110 + 0); ctx.lineTo(lerp(x + 60, x + 4, d), lerp(y - 55, y - 4, d)); ctx.stroke();
    if (e >= 1) { K.glow(x, y - 8, 30, '255,255,255', 0.8 * (0.6 + 0.4 * Math.sin(t * 8))); tag('Toca hueso: osteomielitis', x + 150, y - 130, '#FFFFFF', 17); }
  }
  // panel
  K.card(700, 150, 540, 110, C.BLUE, '1. Neuropatía: más del 80 %', ['No siente el roce, el calor ni la piedra'], seg(t, 1.4, 0.5));
  K.card(700, 272, 540, 110, C.RED, '2. Isquemia', ['Pulsos ausentes, palidez, no cicatriza'], seg(t, 6.8, 0.5));
  K.card(700, 394, 540, 110, '#B0B6C0', '3. Trauma: el gatillo', ['Calzado, roce o cuerpo extraño'], seg(t, 10.8, 0.5));
  K.card(700, 516, 540, 120, C.AMBER, 'Úlcera → infección → amputación', ['Estilete que toca hueso = osteomielitis'], seg(t, 14.2, 0.5));
  K.banner(700, 650, 540, 'Monofilamento una vez al año', C.BLUE, seg(t, 20.5, 0.5));
  K.credit();
};
LOAD({ pie: '../assets/servier/pie_diabetico.png' });
</script>
</body></html>
