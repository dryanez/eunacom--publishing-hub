<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0E1116;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="../lib.js"></script><script src="../graph.js"></script><script src="../kit.js"></script>
<script>
// ?v=levo (endo-02): dosis plena 1,6 µg/kg en el joven; el mayor o coronario parte con 25 a 50 y sube 12,5 a 25 cada 6 a 8 semanas.
// ?v=embarazo (endo-04): TSH bajo 2,5 en el 1er trimestre y bajo 3 después; subir 20 a 30 % al confirmar; talón a las 40-48 h,
//   TSH sobre 15 a 20 → confirmar; levotiroxina 10 a 15 µg/kg antes de los 15 días.
// ?v=nodulo (endo-09): TSH primero; baja → cintigrama (caliente: no se punciona); normal → eco TI-RADS y PAAF por tamaño.
const V = new URLSearchParams(location.search).get('v') || 'levo';
window.SCENE = { duration: 22, fps: 30 };
const L = LIB(document.getElementById('c')), { ctx, C, ease, clamp, lerp, text, tag, rrect } = L;
const G = GRAPH(L), K = KIT(L), { seg, fade } = K;

function levo(t) {
  K.title('Levotiroxina: cuánto y cómo', 'El joven parte con la dosis plena; el mayor, bajo y lento', C.BLUE);
  const ax = G.axes({ x: 110, y: 170, w: 680, h: 400 }, [0, 30], [0, 125], { xt: [0, 6, 12, 18, 24, [30, '30 sem']], yt: [0, 25, 50, 75, 100, 125], yl: 'Dosis diaria (µg)', xl: 'Semanas' });
  ax.draw(seg(t, 0, 0.7));
  const young = x => 100, old = x => x < 7 ? 25 : x < 14 ? 50 : x < 21 ? 75 : 100;
  const k1 = ease(seg(t, 1.5, 3)), k2 = seg(t, 6, 8);
  G.curve(ax, young, k1, C.BLUE, 5);
  if (k1 > 0.95) { ctx.globalAlpha = seg(t, 4.6, 0.5); text('Joven sin cardiopatía: 1,6 µg/kg (≈ 100 µg en 60 kg)', ax.X(0.5), ax.Y(100) - 14, 18, C.BLUE, 'bold'); ctx.globalAlpha = 1; }
  const p = G.curve(ax, old, k2, C.AMBER, 5); if (k2 < 1) G.head(p, C.AMBER);
  [7, 14, 21].forEach((w, i) => { const a = seg(t, 6 + (w / 30) * 8, 0.4); if (a > 0) { ctx.globalAlpha = a; tag('+25', ax.X(w), ax.Y(old(w)) - 26, C.AMBER, 14); ctx.globalAlpha = 1; } });
  if (k2 > 0.3) { ctx.globalAlpha = seg(t, 8.5, 0.5); text('Mayor de 60 a 65 o coronario: 25 a 50 µg', ax.X(1), ax.Y(25) + 30, 18, C.AMBER, 'bold'); ctx.globalAlpha = 1; }
  K.card(840, 170, 400, 150, C.AMBER, 'Empezar bajo, avanzar lento', ['Subir 12,5 a 25 µg', 'cada 6 a 8 semanas según TSH'], seg(t, 9, 0.5));
  K.card(840, 340, 400, 180, C.GREEN, 'Cómo se toma', ['En ayunas, con agua pura', '30 a 60 min antes del desayuno', 'Lejos del calcio y del hierro'], seg(t, 14.5, 0.5));
  K.banner(110, 640, 1130, 'Embarazo o deseo de embarazo: meta TSH bajo 2,5', C.VIOLET, seg(t, 18.5, 0.5));
}

function embarazo(t) {
  K.title('Tiroides en el embarazo y en el recién nacido', 'Lo que está en juego es el cerebro del niño', C.VIOLET);
  const ax = G.axes({ x: 110, y: 170, w: 640, h: 300 }, [0, 40], [0, 5], { xt: [0, 13, 27, [40, '40 sem']], yt: [0, 1, 2, 2.5, 3, 4, 5], yl: 'Meta de TSH (mUI/L)', xl: 'Semanas' });
  ax.draw(seg(t, 0, 0.7));
  const a1 = seg(t, 1.5, 0.6), a2 = seg(t, 4.5, 0.6);
  G.band(ax, 0, 2.5, 'rgba(179,136,255,0.22)', a1, null, 0, 13); G.band(ax, 0, 3, 'rgba(79,163,255,0.18)', a2, null, 13, 40);
  if (a1 > 0) { ctx.globalAlpha = a1; text('1er trimestre: bajo 2,5', ax.X(6.5), ax.Y(2.5) - 12, 18, C.VIOLET, 'bold', 'center'); ctx.globalAlpha = 1; }
  if (a2 > 0) { ctx.globalAlpha = a2; text('2º y 3er trimestre: bajo 3', ax.X(26.5), ax.Y(3) - 12, 18, C.BLUE, 'bold', 'center'); ctx.globalAlpha = 1; }
  const a3 = seg(t, 7.5, 0.5);
  if (a3 > 0) { ctx.globalAlpha = a3; ctx.fillStyle = C.GREEN; ctx.beginPath(); ctx.arc(ax.X(5), ax.Y(0.3), 8, 0, 7); ctx.fill(); tag('Test positivo: subir la dosis 20 a 30 %', ax.X(5) + 150, ax.Y(0.3) - 34, C.GREEN, 15); ctx.globalAlpha = 1; }
  // recién nacido
  const n0 = 11;
  const axN = G.axes({ x: 110, y: 545, w: 640, h: 70 }, [0, 16], [0, 1], { xt: [0, 2, 7, [15, '15 días']], yt: [] });
  const an = seg(t, n0, 0.6);
  if (an > 0) {
    ctx.globalAlpha = an; text('Recién nacido', 110, 528, 21, C.INK, 'bold'); axN.draw(1);
    ctx.fillStyle = C.AMBER; ctx.beginPath(); ctx.arc(axN.X(2), axN.Y(0.5), 9, 0, 7); ctx.fill();
    tag('Talón: 40 a 48 horas', axN.X(2) + 20, axN.Y(0.5) - 30, C.AMBER, 15);
    ctx.globalAlpha = an * seg(t, n0 + 2.5, 0.5); ctx.fillStyle = C.RED; ctx.beginPath(); ctx.arc(axN.X(15), axN.Y(0.5), 9, 0, 7); ctx.fill();
    tag('Tratar antes de los 15 días', axN.X(15) - 60, axN.Y(0.5) - 30, C.RED, 15);
    ctx.globalAlpha = 1;
  }
  K.card(800, 170, 440, 170, C.VIOLET, 'Embarazada', ['Toda TSH sobre 2,5 se trata', 'Primer trimestre: el feto depende', 'de la T4 de la madre'], seg(t, 3, 0.5));
  K.card(800, 360, 440, 200, C.AMBER, 'Recién nacido', ['TSH de talón sobre 15 a 20:', 'confirmar en sangre venosa', 'Levotiroxina 10 a 15 µg/kg/día', 'antes de los 15 días'], seg(t, n0 + 1, 0.5));
  K.banner(800, 625, 440, 'A tiempo: desarrollo normal', C.GREEN, seg(t, 19, 0.5));
}

function nodulo(t) {
  K.title('Nódulo tiroideo: el algoritmo', 'El primer examen es la TSH', C.AMBER);
  const box = (x, y, w, h, title, sub, col, a, active) => { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
    if (active) { ctx.shadowColor = col; ctx.shadowBlur = 22; }
    rrect(x, y, w, h, 14, '#161B22'); ctx.shadowBlur = 0; ctx.strokeStyle = active ? col : '#2A313C'; ctx.lineWidth = active ? 2.5 : 1.5; ctx.beginPath(); ctx.roundRect(x, y, w, h, 14); ctx.stroke();
    ctx.fillStyle = col; ctx.fillRect(x, y, 6, h); text(title, x + 20, y + 32, 20, C.INK, 'bold'); if (sub) text(sub, x + 20, y + 60, 16, C.MUTED); ctx.restore(); };
  const arrow = (x1, y1, x2, y2, a, lab) => { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#5A6573'; ctx.lineWidth = 3;
    const k = ease(a); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(lerp(x1, x2, k), lerp(y1, y2, k)); ctx.stroke();
    if (lab) pillLab(lab, (x1 + x2) / 2, (y1 + y2) / 2); ctx.restore(); };
  const pillLab = (s, x, y) => { ctx.font = '700 15px Liberation Sans'; const w = ctx.measureText(s).width + 20; rrect(x - w / 2, y - 13, w, 26, 13, '#1C232D'); text(s, x, y + 5, 15, C.INK, 'bold', 'center'); };
  const st = [1, 3.5, 6.5, 9.5, 13];
  const cur = st.filter(s => t >= s).length - 1;
  box(470, 140, 340, 76, 'Nódulo de 1 cm o más', 'Palpado o en una imagen', C.MUTED, seg(t, st[0], 0.5), cur === 0);
  arrow(640, 216, 640, 250, seg(t, st[1] - 0.4, 0.4));
  box(470, 250, 340, 76, 'TSH', 'Antes que la eco y la punción', C.BLUE, seg(t, st[1], 0.5), cur === 1);
  arrow(560, 326, 300, 380, seg(t, st[2] - 0.4, 0.4), 'Baja'); arrow(720, 326, 960, 380, seg(t, st[3] - 0.4, 0.4), 'Normal o alta');
  box(80, 380, 440, 90, 'Cintigrama', 'Caliente: autónomo, riesgo bajo 1 %', C.RED, seg(t, st[2], 0.5), cur === 2);
  box(80, 490, 440, 76, 'No se punciona', 'Se trata el hipertiroidismo', C.RED, seg(t, st[2] + 1.2, 0.5), cur === 2);
  box(760, 380, 440, 90, 'Ecografía: TI-RADS', 'Más sospechoso → punción más chica', C.GREEN, seg(t, st[3], 0.5), cur === 3);
  const rows = [['TR 1 y 2', 'no se punciona'], ['TR 3', 'desde 2,5 cm'], ['TR 4', 'desde 1,5 cm'], ['TR 5', 'desde 1 cm']];
  rows.forEach(([a, b], i) => { const al = seg(t, st[4] + i * 0.6, 0.4); if (al <= 0) return; ctx.globalAlpha = al;
    rrect(760, 488 + i * 44, 440, 38, 10, '#161B22'); text(a, 780, 513 + i * 44, 18, C.GREEN, 'bold'); text(b, 1180, 513 + i * 44, 18, C.INK, '', 'right'); ctx.globalAlpha = 1; });
  K.banner(80, 640, 600, 'Con TSH normal nunca se pide cintigrama', C.AMBER, seg(t, 18.5, 0.5));
}

window.render = function (t) { ctx.fillStyle = C.BG; ctx.fillRect(0, 0, 1280, 720); ({ levo, embarazo, nodulo })[V](t); text('Animación propia', 1268, 712, 13, C.MUTED, '', 'right'); };
LOAD({});
</script>
</body></html>
