<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0E1116;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="../lib.js"></script><script src="../kit.js"></script>
<script>
// Obstetricia 05 sobre ilustración real: Blausen "The Placenta" (corte sagital de útero grávido, rótulo en inglés quitado,
// assets/blausen/placenta.png, 1200x1111). Se amplía el lecho placentario dos veces (normal | preeclampsia) y las capas
// animadas muestran arterias espirales, flujo materno, trofoblasto y liberación de factores antiangiogénicos.
//   ?v=placentacion   ob-05 A1: invasión trofoblástica → arterias espirales anchas/estrechas → placenta isquémica → preeclampsia
const V = new URLSearchParams(location.search).get('v') || 'placentacion';
const L = LIB(document.getElementById('c')), { ctx, C, ease, clamp, lerp, text, tag, rrect, poly } = L;
const K = KIT(L), { seg, fade, rnd } = K;
const I = k => window.IMGS[k];

const SRC = { x: 325, y: 150, w: 395, h: 410 }, S = 1.05, PY = 150;
const PX = { n: 30, p: 462 };
const W = SRC.w * S, H = SRC.h * S;
const P = (ox, x, y) => [ox + (x - SRC.x) * S, PY + (y - SRC.y) * S];

// puntos de entrada de las arterias espirales (borde materno de la placenta) y dirección hacia afuera (miometrio)
const ENT = [
  { e: [402, 395], o: [-1, 0.05], c: [432, 395] },
  { e: [408, 330], o: [-0.95, -0.3], c: [440, 340] },
  { e: [425, 268], o: [-0.85, -0.5], c: [458, 295] },
  { e: [455, 216], o: [-0.7, -0.7], c: [485, 245] },
  { e: [510, 184], o: [-0.45, -0.9], c: [540, 205] },
];
// placenta (banda roja materna): borde externo + borde interno
const PLAC = [[425, 515], [400, 470], [399, 400], [404, 340], [415, 290], [435, 245], [465, 205], [510, 178], [570, 163], [640, 160], [660, 166],
  [630, 177], [570, 192], [520, 217], [482, 255], [458, 300], [443, 350], [437, 410], [437, 470], [438, 525]];

function artery(ox, a, width) {
  // trayecto: arranca 78 px afuera, serpentea (espiral), entra y se abre dentro de la cotiledón
  const s0 = [a.e[0] + a.o[0] * 78, a.e[1] + a.o[1] * 78], s1 = a.c;
  const pts = []; const nx = -a.o[1], ny = a.o[0];
  for (let i = 0; i <= 28; i++) {
    const u = i / 28, amp = 9 * (1 - u * 0.5) * (width < 5 ? 1.2 : 1);
    const w = Math.sin(u * Math.PI * 3.2) * amp;
    pts.push(P(ox, lerp(s0[0], s1[0], u) + nx * w, lerp(s0[1], s1[1], u) + ny * w));
  }
  return poly(pts);
}
function clipPanel(ox) { ctx.beginPath(); ctx.roundRect(ox, PY, W, H, 14); ctx.clip(); }
function lamina(ox, a) {
  ctx.save(); ctx.globalAlpha = a; rrect(ox - 6, PY - 6, W + 12, H + 12, 18, '#FFFFFF'); clipPanel(ox);
  ctx.drawImage(I('pl'), SRC.x, SRC.y, SRC.w, SRC.h, ox, PY, W, H); ctx.restore();
}
function tint(ox, k, rgb) {
  if (k <= 0) return; ctx.save(); clipPanel(ox); ctx.beginPath();
  PLAC.forEach((p, i) => { const [x, y] = P(ox, ...p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath();
  ctx.fillStyle = `rgba(${rgb},${0.62 * k})`; ctx.fill(); ctx.restore();
}
function label(s, x, y, col, tx, ty, a, size = 15) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = '#1B2230'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(tx, ty, 4.5, 0, 7); ctx.fill();
  tag(s, x, y, col, size); ctx.restore();
}
function tube(path, width, a) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  path.stroke(ctx, 0, 1, width + 4, '#5A1410'); path.stroke(ctx, 0, 1, width, '#E0443A'); path.stroke(ctx, 0, 0.98, Math.max(1, width * 0.35), '#FF9A8E', -width * 0.12);
  ctx.restore();
}
function blood(path, t, n, speed, a, r = 3.4, col = '#FFD0C8') {
  if (a <= 0) return; ctx.save();
  for (let i = 0; i < n; i++) { const u = ((t * speed) + i / n) % 1; const [x, y] = path.at(u);
    ctx.globalAlpha = a * Math.min(1, u * 6, (1 - u) * 6); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
  ctx.restore();
}
function trophoblast(path, t, a, depth, ph) {
  // células verdes que avanzan desde la placenta (final del trayecto) hacia el miometrio y se detienen en "depth"
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  for (let i = 0; i < 4; i++) { const u = clamp(ease(seg(t, ph + i * 0.35, 3)) * depth, 0, 1); const [x, y] = path.at(1 - u * (0.85 - i * 0.05));
    ctx.fillStyle = '#7CE08A'; ctx.strokeStyle = '#1D6B2B'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, 5.2, 0, 7); ctx.fill(); ctx.stroke(); }
  ctx.restore();
}

function scene(t) {
  K.title('Preeclampsia: la placentación que falla', 'Las arterias espirales no se remodelan: placenta isquémica y daño del endotelio', C.RED);
  lamina(PX.n, seg(t, 0, 0.7)); lamina(PX.p, seg(t, 0.4, 0.7));
  tag('Embarazo normal', PX.n + W / 2, PY - 22, C.GREEN, 18); tag('Preeclampsia', PX.p + W / 2, PY - 22, C.RED, 18);

  // normales: se ensanchan entre 2 y 7 s; preeclampsia: se quedan finas
  const wN = lerp(3.5, 11, ease(seg(t, 2, 5)));
  const wP = lerp(3.5, 4.2, ease(seg(t, 9, 3)));
  const aN = ENT.map(a => artery(PX.n, a, wN)), aP = ENT.map(a => artery(PX.p, a, wP));

  // panel normal
  ctx.save(); clipPanel(PX.n);
  aN.forEach(p => tube(p, wN, seg(t, 1.2, 0.6)));
  aN.forEach(p => blood(p, t, 7, 0.55 + 0.25 * ease(seg(t, 2, 5)), seg(t, 4, 1)));
  aN.forEach(p => trophoblast(p, t, fade(t, 1.6, 7), 1, 1.8));
  ctx.restore();
  label('Arteria espiral ancha', 250, 560, C.GREEN, ...aN[2].at(0.3), fade(t, 6, 15));
  label('Trofoblasto invasor', 250, 520, '#7CE08A', ...aN[1].at(0.4), fade(t, 2.2, 7));

  // panel preeclampsia
  const hyp = ease(seg(t, 13, 3));
  tint(PX.p, hyp, '40,50,110');
  ctx.save(); clipPanel(PX.p);
  aP.forEach(p => tube(p, wP, seg(t, 8.6, 0.6)));
  aP.forEach(p => blood(p, t, 2, 0.28, seg(t, 11, 1), 3, '#E8A39B'));
  aP.forEach(p => trophoblast(p, t, fade(t, 8.8, 14), 0.22, 9));
  // factores antiangiogénicos que salen hacia la circulación materna
  const rel = seg(t, 15.5, 1);
  if (rel > 0) for (let i = 0; i < 14; i++) {
    const a = ENT[i % 5], u = ((t * 0.32) + rnd(i) + i * 0.17) % 1;
    const x = lerp(a.c[0], a.e[0] + a.o[0] * 120, u), y = lerp(a.c[1], a.e[1] + a.o[1] * 120, u) + Math.sin(u * 9 + i) * 6;
    const [px, py] = P(PX.p, x, y); ctx.globalAlpha = rel * Math.min(1, u * 5, (1 - u) * 3);
    ctx.fillStyle = '#C9A2FF'; ctx.beginPath(); ctx.moveTo(px, py - 5); ctx.lineTo(px + 5, py); ctx.lineTo(px, py + 5); ctx.lineTo(px - 5, py); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  label('Arteria espiral estrecha', 680, 560, C.RED, ...aP[2].at(0.3), fade(t, 10.5, 15));
  label('Placenta isquémica', 700, 520, C.VIOLET, ...P(PX.p, 440, 380), fade(t, 14, 24.5));
  label('Factores antiangiogénicos', 700, 585, C.VIOLET, ...P(PX.p, 357, 330), fade(t, 16.5, 24.5));

  K.card(905, 150, 345, 130, C.GREEN, 'Embarazo normal', ['El trofoblasto invade la pared', 'Arterias anchas: mucha sangre'], seg(t, 1.5, 0.5), 17);
  K.card(905, 296, 345, 130, C.RED, 'Preeclampsia', ['Invasión trofoblástica defectuosa', 'Arterias estrechas: poca sangre'], seg(t, 9, 0.5), 17);
  K.card(905, 442, 345, 160, C.VIOLET, 'Placenta isquémica', ['Libera factores antiangiogénicos', 'que pasan a la sangre materna', 'y dañan el endotelio'], seg(t, 15.5, 0.5), 17);
  K.banner(40, 650, 1210, 'Hipertensión, proteinuria o daño de órgano después de las 20 semanas', C.RED, seg(t, 21, 0.6));
}
function credit() { ctx.fillStyle = 'rgba(14,17,22,0.88)'; ctx.fillRect(700, 696, 580, 24); text('Ilustración: Blausen.com staff (2014), CC BY 3.0 · rótulos y animación propios', 1268, 712, 13, C.MUTED, '', 'right'); }

const SCN = { placentacion: { f: scene, dur: 26 } };
window.SCENE = { duration: SCN[V].dur, fps: 30 };
window.render = function (t) { ctx.fillStyle = C.BG; ctx.fillRect(0, 0, 1280, 720); SCN[V].f(t); credit(); };
LOAD({ pl: '../assets/blausen/placenta.png' });
</script>
</body></html>
