<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0E1116;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="../lib.js"></script><script src="../kit.js"></script>
<script>
// endo-15: el feocromocitoma (médula suprarrenal) descarga catecolaminas: alfa 1 contrae las arteriolas, beta 1 acelera el
// corazón. Betabloqueador solo → alfa sin oposición → crisis hipertensiva. Primero alfa (fenoxibenzamina o doxazosina),
// después beta. Base: corteza y médula suprarrenal, arteria en corte y corazón, Servier Medical Art (CC BY 4.0).
window.SCENE = { duration: 25, fps: 30 };
const L = LIB(document.getElementById('c')), { ctx, C, ease, clamp, lerp, text, tag, rrect, poly } = L;
const K = KIT(L), { seg, fade, rnd } = K;
const AD = { x: 30, y: 150, s: 0.4 }, ART = { x: 340, y: 160, s: 0.78 }, HRT = { x: 360, y: 420, s: 0.5 };
const MED = [AD.x + 405 * AD.s, AD.y + 540 * AD.s];
const LUM = [ART.x + 122 * ART.s, ART.y + 148 * ART.s];          // centro de la luz arterial
const TO_ART = poly([MED, [290, 330], LUM]), TO_HRT = poly([MED, [300, 520], [HRT.x + 200 * HRT.s, HRT.y + 300 * HRT.s]]);
// fases: 0-7 crisis; 7.5-14 betabloqueador solo (error); 14.5-25 alfa primero, después beta
const WRONG = [7.5, 14], RIGHT = 14.5;

window.render = function (t) {
  ctx.fillStyle = C.BG; ctx.fillRect(0, 0, 1280, 720);
  const wrong = t >= WRONG[0] && t < WRONG[1], right = t >= RIGHT;
  K.title('Feocromocitoma: primero alfa, después beta', wrong ? 'El error: betabloqueador solo' : right ? 'La preparación correcta antes de operar' : 'Descargas de catecolaminas desde la médula suprarrenal',
    wrong ? C.RED : right ? C.GREEN : C.AMBER);
  ctx.globalAlpha = seg(t, 0, 0.7);
  ctx.drawImage(window.IMGS.sup, AD.x, AD.y, 636 * AD.s, 661 * AD.s);
  ctx.drawImage(window.IMGS.art, ART.x, ART.y, 300 * ART.s, 272 * ART.s);
  ctx.globalAlpha = 1;
  // tumor en la médula
  K.glow(...MED, 70, '255,140,40', 0.55 * (0.7 + 0.3 * Math.sin(t * 5)) * seg(t, 0.5, 0.6));
  ctx.globalAlpha = seg(t, 0.8, 0.5); tag('Tumor en la médula', MED[0], AD.y + 661 * AD.s + 22, '#F29A3A', 15); tag('Arteriola: alfa 1', ART.x + 117, ART.y + 10, '#F0A08A', 15); ctx.globalAlpha = 1;
  // catecolaminas
  const burst = t < 6.5 || wrong ? 1 : right ? lerp(1, 0.6, seg(t, RIGHT, 4)) : 0.4;
  for (let i = 0; i < 14; i++) {
    if (rnd(i) > burst) continue;
    for (const [P, ph] of [[TO_ART, 0], [TO_HRT, 0.5]]) {
      const u = ((t * 0.38) + i / 14 + ph) % 1, [x, y] = P.at(u);
      ctx.save(); ctx.globalAlpha = Math.min(1, u * 8, (1 - u) * 8) * seg(t, 0.8, 0.5); ctx.translate(x, y); ctx.rotate(0.785);
      ctx.fillStyle = C.RED; ctx.fillRect(-5, -5, 10, 10); ctx.restore();
    }
  }
  // tono arteriolar: 0 = abierta, 1 = cerrada
  const alphaBlock = ease(seg(t, RIGHT + 1.5, 2.5));
  let tone = 0.55 * ease(seg(t, 1.5, 2));
  if (t >= 6.5 && t < WRONG[0]) tone = 0.55;
  if (wrong) tone = lerp(0.55, 0.9, ease(seg(t, 9.5, 1.5)));
  if (right) tone = lerp(0.55, 0.12, alphaBlock);
  const R0 = 50 * ART.s, r = R0 * (1 - 0.75 * tone);
  ctx.save(); ctx.beginPath(); ctx.arc(...LUM, R0, 0, 7); ctx.clip();
  ctx.fillStyle = '#E9A98F'; ctx.fillRect(LUM[0] - R0, LUM[1] - R0, 2 * R0, 2 * R0);
  ctx.fillStyle = '#B3122E'; ctx.beginPath(); ctx.arc(...LUM, r, 0, 7); ctx.fill(); ctx.restore();
  // corazón
  const beta = t >= RIGHT + 6.5 ? ease(seg(t, RIGHT + 6.5, 2)) : wrong ? ease(seg(t, 8.5, 1.5)) : 0;
  const hr = lerp(130, 75, beta), beat = Math.pow(Math.max(0, Math.sin(t * Math.PI * hr / 60)), 6);
  const hs = HRT.s * (1 + 0.05 * beat);
  ctx.globalAlpha = seg(t, 0, 0.7);
  ctx.drawImage(window.IMGS.hrt, HRT.x + 194 * (HRT.s - hs), HRT.y + 255 * (HRT.s - hs), 389 * hs, 510 * hs); ctx.globalAlpha = 1;
  ctx.globalAlpha = seg(t, 0.8, 0.5); tag('Corazón: beta 1', HRT.x + 97, HRT.y + 270, '#E7A0B5', 15); ctx.globalAlpha = 1;
  // pastillas
  if (t > 7.6 && t < 9.4) K.pill(lerp(760, HRT.x + 100, ease(seg(t, 7.6, 1.2))), lerp(560, HRT.y + 130, ease(seg(t, 7.6, 1.2))), '#FFFFFF', C.BLUE, 1 - seg(t, 8.9, 0.4));
  if (t > RIGHT + 0.3 && t < RIGHT + 2.2) K.pill(lerp(760, LUM[0], ease(seg(t, RIGHT + 0.3, 1.2))), lerp(250, LUM[1], ease(seg(t, RIGHT + 0.3, 1.2))), '#FFFFFF', C.GREEN, 1 - seg(t, RIGHT + 1.7, 0.4));
  if (t > RIGHT + 5.3 && t < RIGHT + 7.2) K.pill(lerp(760, HRT.x + 100, ease(seg(t, RIGHT + 5.3, 1.2))), lerp(560, HRT.y + 130, ease(seg(t, RIGHT + 5.3, 1.2))), '#FFFFFF', C.BLUE, 1 - seg(t, RIGHT + 6.7, 0.4));
  // presión y pulso
  const sys = wrong ? lerp(200, 250, ease(seg(t, 9.5, 1.5))) : right ? lerp(200, 125, alphaBlock) : lerp(130, 200, ease(seg(t, 1.5, 2)));
  ctx.globalAlpha = seg(t, 1, 0.5); rrect(700, 150, 540, 120, 16, '#161B22');
  K.bar(724, 192, 492, 'Presión sistólica', sys, 260, 'mmHg', sys > 180 ? C.RED : sys > 140 ? C.AMBER : C.GREEN);
  text('Frecuencia cardíaca', 724, 250, 19, C.INK, 'bold'); text(`${Math.round(hr)} lpm`, 1216, 250, 19, hr > 100 ? C.AMBER : C.GREEN, 'bold', 'right');
  ctx.globalAlpha = 1;
  K.card(700, 290, 540, 120, C.AMBER, 'La crisis', ['Cefalea, sudoración y palpitaciones', 'Presión que sube en crisis'], fade(t, 2.5, WRONG[0], 0.5));
  K.card(700, 290, 540, 150, C.RED, 'Betabloqueador solo', ['Se pierde la vasodilatación beta 2', 'Alfa sin oposición: crisis hipertensiva'], fade(t, 9.4, WRONG[1] - 0.3, 0.5));
  if (wrong && t > 10.5) { ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 9); tag('¡Crisis hipertensiva!', 970, 470, C.RED, 20); ctx.globalAlpha = 1; }
  K.card(700, 290, 540, 120, C.GREEN, '1. Bloqueo alfa: 10 a 14 días', ['Fenoxibenzamina o doxazosina'], seg(t, RIGHT + 0.6, 0.5));
  K.card(700, 425, 540, 120, C.BLUE, '2. Recién después, beta', ['Si persiste la taquicardia: propranolol'], seg(t, RIGHT + 5.5, 0.5));
  K.banner(700, 600, 540, 'Después: suprarrenalectomía', C.GREEN, seg(t, RIGHT + 8.5, 0.5));
  K.credit();
};
LOAD({ sup: '../assets/servier/suprarrenal_capas.png', art: '../assets/servier/arteria_corte.png', hrt: '../assets/servier/corazon.png' });
</script>
</body></html>
