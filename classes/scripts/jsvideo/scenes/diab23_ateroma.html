<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0E1116;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="../lib.js"></script><script src="../kit.js"></script>
<script>
// diab-23: el LDL entra a la pared y la placa crece; una cápsula delgada es vulnerable. La estatina baja el LDL y estabiliza
// la placa. Meta de LDL según el riesgo; ezetimiba si no se llega. Base: corte de arteria con ateroma, Servier (CC BY 4.0).
window.SCENE = { duration: 22, fps: 30 };
const L = LIB(document.getElementById('c')), { ctx, C, ease, clamp, lerp, text, tag, rrect } = L;
const K = KIT(L), { seg, fade, rnd } = K;
const S = 1.7, OX = 70, OY = 160, A = (x, y) => [OX + x * S, OY + y * S];
const LU = { x: 138, y: 95, rx: 74, ry: 38 };                     // luz arterial (unidades de la imagen)

window.render = function (t) {
  ctx.fillStyle = C.BG; ctx.fillRect(0, 0, 1280, 720);
  K.title('Ateroma: la placa crece; la estatina la estabiliza', 'Se trata el LDL según el riesgo, no el colesterol total', C.AMBER);
  ctx.globalAlpha = seg(t, 0, 0.7); ctx.drawImage(window.IMGS.ate, OX, OY, 270 * S, 270 * S); ctx.globalAlpha = 1;
  const st = ease(seg(t, 11.5, 3.5));                                  // efecto de la estatina
  const grow = ease(seg(t, 2, 7)) * 1;                                 // la placa sube hacia la luz
  const [lx, ly] = A(LU.x, LU.y);
  // abultamiento de la placa dentro de la luz (recortado a la luz)
  ctx.save(); ctx.beginPath(); ctx.ellipse(lx, ly, LU.rx * S, LU.ry * S, 0, 0, 7); ctx.clip();
  ctx.fillStyle = '#F7DB6A'; ctx.beginPath(); ctx.ellipse(lx + 6, ly + LU.ry * S, LU.rx * S * 0.9, (8 + 26 * grow) * S, 0, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = '#D9A93A'; ctx.lineWidth = 2; ctx.stroke();
  // cápsula fibrosa: delgada y roja (vulnerable) → gruesa y blanca con la estatina
  const capW = lerp(2, 9, st), capC = st > 0.5 ? '#F5F0E6' : '#E0464E';
  ctx.globalAlpha = seg(t, 7.5, 0.6) * (st > 0 ? 1 : 0.6 + 0.4 * Math.sin(t * 7));
  ctx.strokeStyle = capC; ctx.lineWidth = capW; ctx.beginPath(); ctx.ellipse(lx + 6, ly + LU.ry * S, LU.rx * S * 0.9, (8 + 26 * grow) * S, 0, Math.PI, 0); ctx.stroke();
  ctx.restore(); ctx.globalAlpha = 1;
  // LDL en la sangre; algunas entran a la pared
  const nL = Math.round(lerp(18, 6, st));
  for (let i = 0; i < 18; i++) {
    if (i >= nL) continue;
    const ang = rnd(i) * 6.283 + t * (0.3 + rnd(i + 5) * 0.4), r = 0.25 + 0.55 * rnd(i + 9);
    let x = lx + Math.cos(ang) * LU.rx * S * r, y = ly - 8 + Math.sin(ang) * LU.ry * S * r * 0.7;
    const dive = i % 3 === 0 && t > 2 && st < 0.5 ? ((t * 0.4 + i * 0.13) % 1) : 0;
    if (dive > 0.6) { const k = (dive - 0.6) / 0.4; y = lerp(y, ly + LU.ry * S + 40, k); }
    ctx.globalAlpha = seg(t, 0.8, 0.5) * (dive > 0.9 ? (1 - dive) * 10 : 1);
    ctx.fillStyle = '#F2A33A'; ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fill(); ctx.strokeStyle = '#7A4A10'; ctx.lineWidth = 1.5; ctx.stroke();
    text('LDL', x, y + 3, 8, '#3A2405', 'bold', 'center');
  }
  ctx.globalAlpha = 1;
  ctx.globalAlpha = fade(t, 1.0, 7.3); tag('Luz de la arteria', ...A(138, 20), C.RED, 16); tag('Placa de ateroma', ...A(135, 200), '#F2CF5B', 16); ctx.globalAlpha = 1;
  ctx.globalAlpha = fade(t, 2.4, 7.3); tag('El LDL entra a la pared', ...A(250, 140), '#F2A33A', 16); ctx.globalAlpha = 1;
  ctx.globalAlpha = fade(t, 7.8, 11.3); tag('Cápsula delgada: si se rompe, trombo e infarto', ...A(138, 268), C.RED, 16); ctx.globalAlpha = 1;
  if (t > 10.5 && t < 12.4) K.pill(lerp(760, lx, ease(seg(t, 10.6, 1.2))), lerp(240, ly, ease(seg(t, 10.6, 1.2))), '#FFFFFF', C.GREEN, 1 - seg(t, 11.8, 0.4));
  ctx.globalAlpha = seg(t, 12.6, 0.5); tag('Estatina: menos LDL, cápsula gruesa', ...A(138, 268), C.GREEN, 16); ctx.globalAlpha = 1;
  // panel
  const a = seg(t, 1.2, 0.5);
  ctx.globalAlpha = a; rrect(700, 150, 540, 110, 16, '#161B22');
  const ldl = lerp(165, 62, st);
  K.bar(724, 192, 492, 'Colesterol LDL', ldl, 200, 'mg/dL', ldl > 100 ? C.RED : ldl > 70 ? C.AMBER : C.GREEN, [[55, '55'], [70, '70'], [100, '100']]);
  ctx.globalAlpha = 1;
  K.card(700, 278, 540, 172, C.AMBER, 'Meta de LDL según el riesgo', ['Muy alto: bajo 55 (MINSAL: bajo 70)', 'Alto: bajo 70 · Moderado: bajo 100', 'Estatina: inhibe la HMG-CoA reductasa'], seg(t, 15.5, 0.5));
  K.card(700, 468, 540, 110, C.BLUE, 'Si no llega a la meta', ['Estatina a dosis máxima + ezetimiba 10 mg'], seg(t, 17.5, 0.5));
  K.banner(700, 600, 540, 'La meta es el LDL, no el colesterol total', C.RED, seg(t, 19.2, 0.5));
  K.credit();
};
LOAD({ ate: '../assets/servier/ateroma_corte.png' });
</script>
</body></html>
