<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0E1116;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="../lib.js"></script><script src="../kit.js"></script>
<script>
// Otorrinolaringología sobre ilustración real (Servier Medical Art CC BY 4.0 y Blausen.com staff 2014 CC BY 3.0).
// Una escena por clase: ?v=oma (orl-01) · ?v=...  Coordenadas en píxeles de la imagen fuente; Plate.P las lleva al cuadro.
const V = new URLSearchParams(location.search).get('v') || 'oma';
const L = LIB(document.getElementById('c')), { ctx, C, ease, clamp, lerp, text, tag, rrect, poly } = L;
const K = KIT(L), { seg, fade, rnd } = K;
const I = k => window.IMGS[k];
const SV = 'Ilustración: Servier Medical Art (smart.servier.com), CC BY 4.0 · rótulos y animación propios';
const BL = 'Ilustración: Blausen.com staff (2014), CC BY 3.0 · rótulos y animación propios';
const AS = '../assets/';
const SCENES = {};
function def(name, dur, imgs, cred, fn) { SCENES[name] = { dur, imgs, cred, fn }; }

// lámina: recorte (sx,sy,sw,sh) de la imagen `key`, dibujado en (dx,dy) con ancho dw sobre tarjeta blanca
function Plate(key, sx, sy, sw, sh, dx, dy, dw, bg = '#FFFFFF') {
  const s = dw / sw, dh = sh * s;
  const P = (x, y) => [dx + (x - sx) * s, dy + (y - sy) * s];
  const clip = () => { ctx.beginPath(); ctx.roundRect(dx, dy, dw, dh, 14); ctx.clip(); };
  const draw = (a = 1) => { ctx.save(); ctx.globalAlpha = a; rrect(dx - 6, dy - 6, dw + 12, dh + 12, 18, bg);
    ctx.beginPath(); ctx.roundRect(dx, dy, dw, dh, 14); ctx.clip(); ctx.drawImage(I(key), sx, sy, sw, sh, dx, dy, dw, dh); ctx.restore(); };
  return { key, sx, sy, sw, sh, dx, dy, dw, dh, s, P, clip, draw };
}
// polígono en coordenadas de imagen → ruta del lienzo
function path(pl, pts, close = true) { ctx.beginPath(); pts.forEach((p, i) => { const [x, y] = pl.P(...p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); if (close) ctx.closePath(); }
function fillPoly(pl, pts, col, a = 1) { if (a <= 0) return; ctx.save(); pl.clip(); ctx.globalAlpha = a; path(pl, pts); ctx.fillStyle = col; ctx.fill(); ctx.restore(); }
function strokePoly(pl, pts, col, w, a = 1, close = false, dash) { if (a <= 0) return; ctx.save(); pl.clip(); ctx.globalAlpha = a; path(pl, pts, close); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; if (dash) ctx.setLineDash(dash); ctx.stroke(); ctx.restore(); }
// rótulo con línea guía
function label(s, x, y, col, tx, ty, a, size = 15) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = '#1B2230'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(tx, ty, 4.5, 0, 7); ctx.fill();
  tag(s, x, y, col, size); ctx.restore();
}
function arrow(x1, y1, x2, y2, col, a = 1, w = 4) {
  if (a <= 0) return; const ang = Math.atan2(y2 - y1, x2 - x1), h = 7 + w * 1.6;
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(ang) * h * 0.6, y2 - Math.sin(ang) * h * 0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - Math.cos(ang - 0.45) * h, y2 - Math.sin(ang - 0.45) * h); ctx.lineTo(x2 - Math.cos(ang + 0.45) * h, y2 - Math.sin(ang + 0.45) * h); ctx.closePath(); ctx.fill(); ctx.restore();
}
// puntos que viajan por un camino (px de lienzo): n puntos, velocidad sp (vueltas/s)
function dots(pth, t, a, col, n = 8, sp = 0.3, r = 3.5, s0 = 0, s1 = 1, rev = false) {
  if (a <= 0) return; ctx.save(); ctx.fillStyle = col;
  for (let i = 0; i < n; i++) { const u = ((t * sp) + i / n) % 1, [x, y] = pth.at(rev ? lerp(s1, s0, u) : lerp(s0, s1, u)); ctx.globalAlpha = a * Math.min(1, u * 6, (1 - u) * 6); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
  ctx.restore();
}
// dispersión de puntos dentro de una caja (bacterias, células): determinista
function swarm(pl, box, n, t, col, a, r = 3, seed = 1, drift = 6) {
  if (a <= 0) return; ctx.save(); pl.clip(); ctx.fillStyle = col;
  for (let i = 0; i < n; i++) { const x = lerp(box[0], box[2], rnd(i * 3 + seed)) + Math.sin(t * 1.3 + i) * drift, y = lerp(box[1], box[3], rnd(i * 3 + seed + 1)) + Math.cos(t * 1.1 + i * 1.7) * drift;
    const [X, Y] = pl.P(x, y); ctx.globalAlpha = a * (0.55 + 0.45 * Math.sin(t * 2 + i)); ctx.beginPath(); ctx.arc(X, Y, r, 0, 7); ctx.fill(); }
  ctx.restore();
}
function pulse(t, f = 3) { return 0.5 + 0.5 * Math.sin(t * f); }
function xmark(x, y, r, col, a) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r); ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r); ctx.stroke(); ctx.restore(); }
function ring(x, y, r, col, a, w = 4) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke(); ctx.restore(); }
function ell(x, y, rx, ry, col, a, rot = 0) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, 7); ctx.fill(); ctx.restore(); }
function drop(x, y, a, col) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y - 7); ctx.quadraticCurveTo(x + 5.5, y + 1.5, x, y + 5); ctx.quadraticCurveTo(x - 5.5, y + 1.5, x, y - 7); ctx.fill(); ctx.restore(); }
function credit(s) { ctx.fillStyle = 'rgba(14,17,22,0.88)'; ctx.fillRect(660, 696, 620, 24); text(s, 1268, 712, 13, C.MUTED, '', 'right'); }

// ================= orl-01 · OMA: trompa tapada → efusión → pus → tímpano abombado =================
def('oma', 26, { ear: 'servier/Oreille.png' }, SV, t => {
  K.title('Otitis media aguda', 'Del resfrío al tímpano abombado', C.AMBER);
  const pl = Plate('ear', 520, 300, 700, 700, 40, 140, 540); pl.draw(seg(t, 0, 0.7));
  const TUBE = [[850, 610], [880, 660], [915, 710], [970, 800], [1060, 920], [1170, 1040]];
  const CAV = [[757, 395], [790, 380], [835, 392], [860, 430], [868, 520], [890, 545], [930, 560], [945, 600], [915, 660], [880, 692], [838, 690], [836, 640], [800, 610], [780, 560], [758, 520], [752, 450]];
  const tubePx = poly(TUBE.map(p => pl.P(...p)));
  // 1) resfrío: virus suben por la trompa y la mucosa se edematiza
  const sw = ease(seg(t, 1.5, 3));
  if (sw > 0) { ctx.save(); pl.clip(); ctx.globalAlpha = 0.6 * sw; ctx.lineCap = 'round'; tubePx.stroke(ctx, 0, 0.8, 20, 'rgba(255,60,50,0.6)'); ctx.restore(); }
  dots(tubePx, t, fade(t, 0.8, 5.5), '#7B3FE0', 9, 0.18, 4.5, 0.1, 0.9, true);
  label('Trompa de Eustaquio', 150, 640, C.BLUE, ...pl.P(1000, 850), fade(t, 1.2, 10));
  label('Resfrío: mucosa edematosa', 150, 600, C.RED, ...pl.P(940, 760), fade(t, 2.6, 9));
  const [xx, xy] = pl.P(905, 690); xmark(xx, xy, 14, C.RED, seg(t, 4.6, 0.4) * (1 - seg(t, 12, 0.6)));
  // 2) presión negativa: tímpano se retrae, sale trasudado seroso
  if (t > 6) { ctx.save(); pl.clip(); path(pl, CAV); ctx.clip();
    const lvl = lerp(692, 590, ease(seg(t, 6, 3.5))) - 150 * ease(seg(t, 10.5, 4)), pus = ease(seg(t, 10.5, 3.5));
    const mix = (a, b) => Math.round(lerp(a, b, pus));
    ctx.fillStyle = `rgba(${mix(255, 255)},${mix(205, 232)},${mix(80, 120)},${0.62 + 0.25 * pus})`; ctx.fillRect(pl.dx, pl.P(0, lvl)[1], pl.dw, pl.dh); ctx.restore(); }
  arrow(...pl.P(715, 575), ...pl.P(762, 560), C.BLUE, fade(t, 6.2, 9.5), 4);
  label('Presión negativa: tímpano retraído', 190, 215, C.BLUE, ...pl.P(762, 540), fade(t, 6.4, 10));
  // 3) bacterias en el líquido
  swarm(pl, [770, 430, 920, 680], 26, t, '#2E7D32', seg(t, 9, 1.2), 3.6, 4);
  label('Neumococo, Haemophilus, Moraxella', 200, 255, C.GREEN, ...pl.P(840, 520), fade(t, 9.2, 15));
  // 4) pus a presión: el tímpano se abomba
  const bulge = ease(seg(t, 13.5, 4.5)), A = [748, 508], B = [836, 686], ctl = [lerp(792, 664, bulge), lerp(597, 600, bulge)];
  if (bulge > 0) { ctx.save(); pl.clip(); const [ax, ay] = pl.P(...A), [bx, by] = pl.P(...B), [cx, cy] = pl.P(...ctl);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(cx, cy, bx, by); ctx.closePath(); ctx.fillStyle = 'rgba(255,226,120,0.9)'; ctx.fill();
    ctx.strokeStyle = `rgba(230,40,30,${0.6 + 0.4 * pulse(t, 4)})`; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(cx, cy, bx, by); ctx.stroke(); ctx.restore(); }
  label('Tímpano abombado = OMA', 170, 470, C.RED, ...pl.P(718, 598), seg(t, 16.8, 0.6));
  const dolor = seg(t, 17.5, 0.5), ph = (t * 1.2) % 1; if (dolor > 0) ring(...pl.P(718, 598), 16 + 30 * ph, C.RED, dolor * (1 - ph), 3);
  // panel
  K.card(640, 150, 600, 118, C.RED, 'La trompa se tapa con el resfrío', ['Presión negativa y trasudado seroso', 'Bacterias suben desde la nariz'], seg(t, 1.8, 0.5), 18);
  K.card(640, 282, 600, 118, C.AMBER, 'Pus a presión detrás del tímpano', ['Neumococo, Haemophilus, Moraxella', 'Otalgia, fiebre, llanto'], seg(t, 9.5, 0.5), 18);
  K.card(640, 414, 600, 156, C.GREEN, 'Tres criterios de OMA', ['Inicio agudo de síntomas', 'Efusión en el oído medio', 'Inflamación del tímpano'], seg(t, 15.5, 0.5), 18);
  K.banner(640, 590, 600, 'Tímpano abombado: es OMA', C.RED, seg(t, 20.5, 0.5));
});

// ================= orl-02 · colesteatoma: bolsillo de retracción → saco de queratina → erosión ósea =================
def('colesteatoma', 27, { ear: 'servier/Oreille.png' }, SV, t => {
  K.title('Colesteatoma', 'Epitelio queratinizante que come hueso', C.RED);
  const pl = Plate('ear', 480, 250, 700, 700, 40, 140, 540); pl.draw(seg(t, 0, 0.7));
  // bolsillo de retracción en la pars flaccida (arriba del tímpano)
  const pk = ease(seg(t, 0.8, 3));
  if (pk > 0) { ctx.save(); pl.clip(); const [ax, ay] = pl.P(738, 498), [bx, by] = pl.P(776, 470), [cx, cy] = pl.P(752, 476 - 12 * pk);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(cx - 6, cy + 26 * (1 - pk), bx, by); ctx.lineTo(bx + 6, by + 26); ctx.closePath(); ctx.fillStyle = 'rgba(245,225,205,0.95)'; ctx.fill(); ctx.restore(); }
  label('Bolsillo de retracción', 150, 285, C.AMBER, ...pl.P(752, 484), fade(t, 1.4, 6));
  // saco de queratina que crece hacia el ático y el antro mastoideo
  const g = ease(seg(t, 3.5, 6.5)); const cx0 = lerp(770, 705, g), cy0 = lerp(465, 425, g), rx = lerp(8, 70, g), ry = lerp(8, 44, g);
  if (g > 0) { ctx.save(); pl.clip(); const [x, y] = pl.P(cx0, cy0);
    ctx.fillStyle = 'rgba(250,246,238,0.96)'; ctx.strokeStyle = '#B9A98F'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.ellipse(x, y, rx * pl.s, ry * pl.s, -0.35, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(190,175,150,0.8)'; ctx.lineWidth = 1.6; for (let k = 1; k <= 3; k++) { ctx.beginPath(); ctx.ellipse(x, y, rx * pl.s * (1 - k * 0.22), ry * pl.s * (1 - k * 0.22), -0.35, 0, 7); ctx.stroke(); } ctx.restore(); }
  label('Escamas de queratina que se acumulan', 190, 190, '#E9E2D2', ...pl.P(700, 410), fade(t, 4.5, 10));
  // colagenasas
  swarm(pl, [650, 380, 780, 470], 14, t, '#FFB020', seg(t, 8.5, 1) * (1 - seg(t, 14, 1)), 3, 11, 5);
  // erosión de huesecillos
  const er = seg(t, 9.5, 2);
  if (er > 0) { const [ix, iy] = pl.P(850, 500); ring(ix, iy, 22 + 4 * pulse(t, 5), C.RED, er * fade(t, 9.5, 13.5, 0.3) + 0.0, 4);
    ctx.save(); pl.clip(); ctx.globalAlpha = 0.45 * er; ctx.fillStyle = '#FF3B30'; const [ox, oy] = pl.P(805, 470); ctx.beginPath(); ctx.ellipse(ox, oy, 26 * pl.s, 46 * pl.s, 0, 0, 7); ctx.fill(); ctx.restore(); }
  label('Huesecillos: hipoacusia severa', 150, 300, C.RED, ...pl.P(805, 480), fade(t, 9.8, 13.8));
  // nervio facial
  const fa = fade(t, 13.8, 17.8); if (fa > 0) { const [fx, fy] = pl.P(878, 462); ring(fx, fy, 18 + 14 * ((t * 1.1) % 1), C.AMBER, fa * (1 - ((t * 1.1) % 1)), 4); ell(fx, fy, 7, 7, C.AMBER, fa); }
  label('Canal del nervio facial: parálisis', 200, 590, C.AMBER, ...pl.P(878, 462), fade(t, 14, 18));
  // canal semicircular lateral
  const fi = fade(t, 17.8, 21.8); if (fi > 0) { const [sx, sy] = pl.P(905, 395); ring(sx, sy, 18 + 14 * ((t * 1.1) % 1), C.VIOLET, fi * (1 - ((t * 1.1) % 1)), 4); ell(sx, sy, 7, 7, C.VIOLET, fi); }
  label('Fístula del canal semicircular: vértigo', 190, 260, C.VIOLET, ...pl.P(905, 395), fade(t, 18, 22));
  // tegmen tympani
  const te = seg(t, 21.8, 0.8); if (te > 0) { ctx.save(); pl.clip(); ctx.strokeStyle = C.RED; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); [[770, 372], [786, 366], [798, 376], [812, 366], [826, 374]].forEach(([x, y], i) => { const [X, Y] = pl.P(x, y); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.stroke(); ctx.restore(); }
  label('Tegmen: meningitis o absceso cerebral', 250, 175, C.RED, ...pl.P(798, 372), seg(t, 22, 0.6));
  // panel
  K.card(640, 150, 600, 100, C.AMBER, 'Epitelio escamoso en el oído medio', ['Colagenasas y citoquinas: osteolítico'], seg(t, 3.5, 0.5), 18);
  K.card(640, 264, 600, 130, C.RED, 'Orden de la destrucción', ['1. Huesecillos: hipoacusia', '2. Nervio facial: parálisis periférica'], seg(t, 9.5, 0.5), 18);
  K.card(640, 408, 600, 130, C.VIOLET, 'Y si sigue avanzando', ['3. Canal semicircular: fístula y vértigo', '4. Tegmen: meningitis, absceso'], seg(t, 17.5, 0.5), 18);
  K.banner(640, 560, 600, 'No es un tumor, pero se opera siempre', C.RED, seg(t, 23.2, 0.5));
});

// ================= orl-03 · otitis externa difusa → maligna (diabético): conducto → hueso → base de cráneo =================
def('otitisext', 28, { ear: 'servier/Oreille.png' }, SV, t => {
  K.title('Otitis externa', 'Del oído del nadador a la osteomielitis del peñasco', C.AMBER);
  const pl = Plate('ear', 320, 430, 790, 600, 40, 150, 570); pl.draw(seg(t, 0, 0.7));
  const CAN = [[325, 505], [505, 497], [735, 502], [835, 688], [675, 657], [540, 642], [400, 648], [325, 655]];
  // 1) difusa: agua, maceración, edema del conducto (tímpano indemne)
  const ed = ease(seg(t, 1, 3)) * (1 - 0.0);
  if (ed > 0) { ctx.save(); pl.clip(); path(pl, CAN); ctx.lineWidth = 18 * ed; ctx.strokeStyle = 'rgba(255,70,60,0.55)'; ctx.stroke(); ctx.restore(); }
  swarm(pl, [340, 520, 700, 640], 18, t, '#6AA8FF', fade(t, 0.6, 3.4) , 3.4, 21, 7);
  swarm(pl, [380, 540, 700, 640], 16, t, '#2E7D32', seg(t, 3, 1) * (1 - seg(t, 9, 1)) , 3.4, 22, 4);
  label('Agua y maceración: Pseudomonas', 190, 350, '#6AA8FF', ...pl.P(450, 560), fade(t, 1, 6));
  label('Conducto edematoso, tímpano indemne', 190, 400, C.RED, ...pl.P(600, 525), fade(t, 3.5, 9));
  // signo del trago
  const tr = fade(t, 5.5, 9); if (tr > 0) { const [tx, ty] = pl.P(335, 590); arrow(tx - 40, ty + 34, tx - 12, ty + 8, C.AMBER, tr, 4); ring(tx, ty, 14 + 12 * ((t * 1.3) % 1), C.RED, tr * (1 - ((t * 1.3) % 1)), 3); }
  label('Dolor al tirar del pabellón', 190, 450, C.AMBER, ...pl.P(335, 590), fade(t, 5.8, 9));
  // 2) maligna: diabético, granulación en el piso (unión cartílago-hueso)
  const gr = ease(seg(t, 10, 2.5));
  if (gr > 0) { ctx.save(); pl.clip(); for (const [x, y, r] of [[520, 636, 15], [556, 640, 18], [598, 646, 14]]) { const [X, Y] = pl.P(x, y); ctx.fillStyle = 'rgba(214,92,100,0.95)'; ctx.strokeStyle = '#8A2A33'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(X, Y - 3, r * pl.s * gr, 0, 7); ctx.fill(); ctx.stroke(); } ctx.restore(); }
  label('Diabético: granulación en el piso', 190, 350, C.RED, ...pl.P(556, 642), fade(t, 10.5, 16));
  // 3) el hueso: osteomielitis hacia la base del cráneo
  const sp = ease(seg(t, 13, 6)); const BONE = [[520, 660], [690, 690], [780, 760], [860, 850], [980, 930]];
  const bp = poly(BONE.map(p => pl.P(...p)));
  if (sp > 0) { ctx.save(); pl.clip(); ctx.lineCap = 'round'; bp.stroke(ctx, 0, sp, 20, 'rgba(255,60,50,0.5)'); bp.stroke(ctx, 0, sp, 7, 'rgba(255,200,60,0.9)'); ctx.restore();
    const [ax, ay] = bp.at(sp); ell(ax, ay, 9 + 3 * pulse(t, 6), 9 + 3 * pulse(t, 6), '#FFD54A', 1); }
  label('Osteomielitis del peñasco', 190, 400, C.RED, ...pl.P(690, 700), fade(t, 13.5, 20));
  const f7 = fade(t, 15.2, 22.5); if (f7 > 0) { const [fx, fy] = pl.P(790, 770); ring(fx, fy, 14 + 14 * ((t * 1.1) % 1), C.AMBER, f7 * (1 - ((t * 1.1) % 1)), 4); ell(fx, fy, 6, 6, C.AMBER, f7); }
  label('Nervio facial: se afecta primero', 190, 450, C.AMBER, ...pl.P(790, 770), fade(t, 15.4, 22.5));
  label('Base del cráneo: IX, X, XI', 190, 500, C.VIOLET, ...pl.P(955, 915), fade(t, 18.5, 24));
  // panel
  K.card(640, 150, 600, 120, C.AMBER, 'Difusa: oído del nadador', ['Conducto edematoso, dolor al tirar la oreja', 'Gotas de ciprofloxacino, sin antibiótico oral'], seg(t, 1.5, 0.5), 18);
  K.card(640, 284, 600, 120, C.RED, 'Maligna: diabético mayor', ['Dolor nocturno intenso y otorrea', 'Pseudomonas invade el hueso'], seg(t, 10, 0.5), 18);
  K.card(640, 418, 600, 120, C.VIOLET, 'Cómo se confirma', ['TAC de peñasco con contraste', 'Cintigrafía para seguir la actividad'], seg(t, 18, 0.5), 18);
  K.banner(640, 560, 600, 'Hospitalizar: antibiótico endovenoso 6 a 8 semanas', C.RED, seg(t, 23, 0.5));
});

// ================= orl-04 · mastoiditis: pus → celdas → absceso subperióstico / complicaciones intracraneales =================
def('mastoiditis', 27, { ear: 'servier/Oreille.png' }, SV, t => {
  K.title('Mastoiditis aguda', 'El pus que no tiene por dónde salir busca el hueso', C.RED);
  const pl = Plate('ear', 330, 100, 700, 700, 40, 140, 540); pl.draw(seg(t, 0, 0.7));
  const CAV = [[757, 395], [790, 380], [835, 392], [860, 430], [868, 520], [890, 545], [930, 560], [945, 600], [915, 660], [880, 692], [838, 690], [836, 640], [800, 610], [780, 560], [758, 520], [752, 450]];
  const HC = [[505, 200], [600, 185], [700, 260], [740, 350], [738, 470], [640, 482], [560, 430], [500, 330]];
  // 1) otitis media: pus en el oído medio
  fillPoly(pl, CAV, 'rgba(255,224,110,0.9)', ease(seg(t, 0.8, 2)));
  label('Otitis media aguda: pus', 170, 640, C.AMBER, ...pl.P(820, 470), fade(t, 1, 5.5));
  // 2) por el aditus ad antrum hacia las celdas mastoideas
  const sp = ease(seg(t, 3.5, 5.5));
  if (sp > 0) { ctx.save(); pl.clip(); path(pl, HC); ctx.clip(); const [x, y] = pl.P(745, 430); ctx.fillStyle = 'rgba(255,214,90,0.8)'; ctx.beginPath(); ctx.arc(x, y, 300 * sp * pl.s, 0, 7); ctx.fill(); ctx.restore();

// ================= orl-05 · audiograma: normal, conducción, sensorioneural, mixta (+ Weber y Rinne) =================
def('audiograma', 28, { head: 'servier/Sinus.png' }, SV, t => {

  ctx.save(); ctx.fillStyle = 'rgba(61,220,132,0.12)'; ctx.fillRect(X(0) - 20, Y(0), X(6) - X(0) + 40, 25 * DY); ctx.restore();
  for (let d = 0; d <= 100; d += 20) { ctx.strokeStyle = C.GRID; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(X(0) - 20, Y(d)); ctx.lineTo(X(6) + 20, Y(d)); ctx.stroke(); text(String(d), X(0) - 34, Y(d) + 5, 14, C.MUTED, '', 'right'); }

  text('Frecuencia (Hz)', (X(0) + X(6)) / 2, Y(100) + 48, 15, C.MUTED, '', 'center'); text('dB', 56, 176, 15, C.MUTED);
  text('Normal: hasta 25 dB', X(6) + 14, Y(22), 14, C.GREEN, 'bold', 'right');
  // estados: [aire], [hueso]
  const ST = [
    { a: [10, 8, 10, 5, 10, 15, 15], b: [8, 6, 8, 5, 8, 12, 12] },
    { a: [45, 45, 40, 40, 35, 30, 30], b: [8, 6, 8, 5, 8, 12, 12] },
    { a: [25, 30, 40, 50, 60, 70, 75], b: [22, 27, 36, 47, 56, 66, 70] },

  const cur = k => ST[0][k].map((_, i) => ST.reduce((s, st, j) => s + m[j] * st[k][i], 0));
  const A = cur('a'), B = cur('b'), rev = ease(seg(t, 2.5, 3));
  const n = Math.max(1, Math.round(rev * 6) + 1), part = (arr) => arr.slice(0, n).map((v, i) => [X(i) + (i === n - 1 ? (rev * 6 - (n - 1)) * DX * 0 : 0), Y(v)]);
  const gap = A.map((v, i) => v - B[i]), g = clamp((gap.reduce((s, v) => s + v, 0) / 7 - 8) / 18, 0, 1);
  if (g > 0 && rev >= 1) { ctx.save(); ctx.globalAlpha = 0.5 * g; ctx.fillStyle = C.AMBER; ctx.beginPath(); B.forEach((v, i) => i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v))); for (let i = 6; i >= 0; i--) ctx.lineTo(X(i), Y(A[i])); ctx.closePath(); ctx.fill(); ctx.restore();
    text('Brecha óseo-aérea', X(3), Y((A[3] + B[3]) / 2) + 5, 16, C.INK, 'bold', 'center'); }
  const drawCurve = (arr, col, shape) => { const pts = part(arr); ctx.strokeStyle = col; ctx.lineWidth = 3.5; ctx.lineJoin = 'round'; ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
    pts.forEach(([x, y]) => { ctx.fillStyle = '#141A22'; ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); if (shape === 'o') ctx.arc(x, y, 7, 0, 7); else ctx.rect(x - 6, y - 6, 12, 12); ctx.fill(); ctx.stroke(); }); };
  drawCurve(B, C.BLUE, 'b'); drawCurve(A, C.RED, 'o');
  const lg = seg(t, 3, 0.5); if (lg > 0) { ctx.save(); ctx.globalAlpha = lg; ctx.strokeStyle = C.RED; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(X(0) + 6, Y(88), 7, 0, 7); ctx.stroke(); text('Vía aérea (auriculares)', X(0) + 22, Y(88) + 5, 15, C.INK);
    ctx.strokeStyle = C.BLUE; ctx.strokeRect(X(0), Y(96) - 6, 12, 12); text('Vía ósea (vibrador en la mastoides)', X(0) + 22, Y(96) + 5, 15, C.INK); ctx.restore(); }
  // tarjeta activa
  const CARDS = [
    [C.GREEN, 'Audición normal', ['Aire y hueso superpuestos', 'Ambas bajo 20 a 25 dB'], 2.5, 6.2],
    [C.AMBER, 'Hipoacusia de conducción', ['Hueso normal, aire descendido', 'Brecha de 15 dB o más'], 6.4, 13.2],
    [C.RED, 'Hipoacusia sensorioneural', ['Aire y hueso bajan juntos', 'Sin brecha, menos de 10 dB'], 13.4, 20.2],
    [C.VIOLET, 'Hipoacusia mixta', ['Curvas descendidas y además brecha'], 20.4, 26],
  ];
  for (const [col, ti, ls, a, b] of CARDS) K.card(660, 150, 580, 130, col, ti, ls, fade(t, a, b, 0.35), 19);
  // cabeza: Weber y Rinne
  const hp = Plate('head', 0, 60, 792, 860, 660, 300, 262, '#141A22'); hp.draw(seg(t, 6, 0.6));
  { const [x0, y0] = hp.P(190, 250), [x1, y1] = hp.P(610, 760); ctx.save(); ctx.globalAlpha = seg(t, 6, 0.6); ctx.fillStyle = '#C8E9F5'; ctx.beginPath(); ctx.roundRect(x0, y0, x1 - x0, y1 - y0, 40); ctx.fill(); ctx.restore(); }
  const fx = hp.P(395, 225), earL = hp.P(28, 560), earR = hp.P(768, 545);
  const wb = fade(t, 7, 26, 0.5);
  if (wb > 0) { ell(fx[0], fx[1], 6, 6, '#F5F5F7', wb); ring(fx[0], fx[1], 8 + 8 * ((t * 1.6) % 1), C.INK, wb * (1 - ((t * 1.6) % 1)), 2); text('Diapasón 512 Hz', fx[0], fx[1] - 16, 14, C.INK, 'bold', 'center'); }
  const sick = [earR, 'Oído enfermo'], well = [earL, 'Oído sano'];
  const wTo = (to, a) => { if (a <= 0) return; arrow(fx[0], fx[1] + 10, to[0][0] + (to[0] === earR ? -14 : 14), to[0][1] - 20, C.AMBER, a, 4); ring(to[0][0], to[0][1], 22 + 6 * pulse(t, 5), to[1] === 'Oído enfermo' ? C.RED : C.GREEN, a, 4); };
  wTo(sick, fade(t, 8.6, 13.0, 0.4)); wTo(well, fade(t, 15.4, 20.0, 0.4));
  const note = (s, col, a) => { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; rrect(940, 330, 300, 100, 14, '#161B22'); ctx.fillStyle = col; ctx.fillRect(940, 330, 5, 100); text(s[0], 958, 362, 18, col, 'bold'); text(s[1], 958, 390, 16, C.INK); text(s[2], 958, 414, 16, C.INK); ctx.restore(); };
  note(['Conducción', 'Weber: al oído enfermo', 'Rinne negativo: hueso > aire'], C.AMBER, fade(t, 8.8, 13.2, 0.4));
  note(['Sensorioneural', 'Weber: al oído sano', 'Rinne positivo: aire > hueso'], C.RED, fade(t, 15.6, 20.2, 0.4));
  K.banner(940, 460, 300, 'Brecha ≥ 15 dB: conducción', C.AMBER, fade(t, 10, 13.2, 0.4));
  K.banner(940, 460, 300, 'Sin brecha: sensorioneural', C.RED, fade(t, 17, 20.2, 0.4));
  K.banner(660, 640, 580, 'Rinne positivo también en la sensorioneural', C.BLUE, seg(t, 23.5, 0.5));
});

// ================= orl-07 · VPPB: otoconias en el canal posterior, maniobra de Epley, y duración de los tres vértigos =================
def('vppb', 28, { lab: 'blausen/orl_laberinto.png' }, BL, t => {
  K.title('Vértigo posicional', 'Una piedrita en el canal posterior', C.VIOLET);
  const pl = Plate('lab', 0, 0, 693, 900, 40, 140, 410, '#FFFFFF'); pl.draw(seg(t, 0, 0.7));
  const POST = [[395, 565], [335, 620], [255, 628], [190, 592], [150, 520], [138, 450], [170, 398], [250, 380], [330, 420], [385, 480], [410, 545]];
  const pp = poly(POST.map(p => pl.P(...p)));
  strokePoly(pl, POST, 'rgba(179,136,255,0.35)', 18, fade(t, 1.2, 25, 0.6));
  label('Canal semicircular posterior', 300, 190, C.VIOLET, ...pl.P(150, 500), fade(t, 1, 8));
  label('Utrículo: otoconias', 330, 640, C.AMBER, ...pl.P(470, 560), fade(t, 1.6, 6));
  // otoconias: se desprenden del utrículo y caen al canal (canalitiasis)
  const fall = ease(seg(t, 2.5, 3));
  const N = 9, particle = (i, s) => { const [x, y] = pp.at(s); const ox = (rnd(i + 5) - 0.5) * 10, oy = (rnd(i + 9) - 0.5) * 10; ell(x + ox, y + oy, 5.5, 4.5, '#F5F1E4', 1); ctx.strokeStyle = '#8D8470'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.ellipse(x + ox, y + oy, 5.5, 4.5, 0, 0, 7); ctx.stroke(); };
  // posición del grupo a lo largo del canal (0 = utrículo, 1 = vuelta completa)
  const sRest = 0.12, sFall = lerp(0.0, 0.3, fall);
  let sGroup = sFall;                                         // reposo tras caer
  const mov = ease(seg(t, 7, 2.2)) * (1 - ease(seg(t, 9.5, 1.5))); // cambio de posición: se mueven
  sGroup += 0.2 * mov + 0.2 * ease(seg(t, 7, 2.2));
  // Epley: recorre el canal de vuelta hacia el utrículo
  const ep = ease(seg(t, 15.5, 7));
  const sPos = t < 15.5 ? sGroup : lerp(sGroup, 1.0, ep);
  if (t > 2.5) for (let i = 0; i < N; i++) particle(i, clamp(sPos - 0.012 * i, 0, 1));
  // cúpula y señal falsa
  const [cx, cy] = pl.P(350, 600), cu = fade(t, 7.5, 13, 0.4);
  if (cu > 0) { ring(cx, cy, 22 + 6 * pulse(t, 6), C.RED, cu, 4); label('Cúpula: señal falsa de giro', 300, 645, C.RED, cx, cy, cu); }
  // vértigo y nistagmo: línea de tiempo 10 a 60 s
  const tl = (x, y, w, a) => { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; rrect(x, y, w, 118, 14, '#161B22'); text('Crisis de 10 a 60 segundos', x + 18, y + 30, 19, C.VIOLET, 'bold');
    ctx.strokeStyle = C.GRID; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 18, y + 92); ctx.lineTo(x + w - 18, y + 92); ctx.stroke();
    const lat = seg(t, 7.2, 0.4), pw = (w - 36) / 60; const on = clamp((t - 7.2) * 5.5, 0, 45);   // 1 s de pantalla = 5,5 s de nistagmo (cuenta atrás)
    ctx.strokeStyle = C.RED; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x + 18, y + 92); ctx.lineTo(x + 18 + pw * 3, y + 92); for (let k = 0; k <= 45; k++) { if (k > on) break; const xx = x + 18 + pw * (3 + k); ctx.lineTo(xx, y + 92 - 38 * Math.sin(k * 0.9) * Math.exp(-k / 28)); } ctx.stroke();
    text('latencia 2 a 5 s  ·  el nistagmo se agota solo', x + w - 18, y + 30, 15, C.MUTED, '', 'right'); ctx.restore(); };
  tl(480, 290, 760, fade(t, 7, 14.5, 0.4));
  K.card(480, 150, 760, 120, C.VIOLET, 'Canalitiasis', ['Cristales del utrículo caen al canal posterior (85 a 90 %)', 'Cada cambio de posición mueve la endolinfa'], seg(t, 3.2, 0.5), 18);
  // Epley
  const es = fade(t, 14.5, 23, 0.4); if (es > 0) { ctx.save(); ctx.globalAlpha = es; rrect(480, 290, 760, 118, 14, '#161B22'); text('Maniobra de Epley: cuatro tiempos', 498, 320, 19, C.GREEN, 'bold');
    for (let k = 0; k < 4; k++) { const on = t > 15.6 + k * 1.8; const x = 540 + k * 190; ctx.fillStyle = on ? C.GREEN : '#2A2F38'; ctx.beginPath(); ctx.arc(x, 370, 22, 0, 7); ctx.fill(); text(String(k + 1), x, 378, 22, on ? C.BG : C.MUTED, 'bold', 'center'); if (k < 3) { ctx.strokeStyle = on ? C.GREEN : '#2A2F38'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 26, 370); ctx.lineTo(x + 160, 370); ctx.stroke(); } }
    text('Las partículas vuelven al utrículo: cura a más del 90 %', 498, 400, 15, C.INK); ctx.restore(); }
  label('De vuelta al utrículo', 330, 640, C.GREEN, ...pl.P(450, 520), fade(t, 20.5, 25));
  // duración de los tres vértigos (escala logarítmica)
  const dur = seg(t, 22.5, 0.6);

// ================= orl-09 · rinitis alérgica: alérgeno → IgE/mastocito → mucosa edematosa → clasificación ARIA =================

    for (let i = 0; i < 12; i++) { const u = ((t * 0.16) + i / 12) % 1, [x, y] = ap.at(u * 0.9); ctx.globalAlpha = a * Math.min(1, u * 8) * 0.95; ctx.beginPath(); ctx.arc(x + (rnd(i) - 0.5) * 36, y + (rnd(i + 7) - 0.5) * 30, 4, 0, 7); ctx.fill(); } ctx.restore(); }

    ctx.fillStyle = '#4B2F7F'; ctx.beginPath(); ctx.arc(cx - 8, cy + 6, 26, 0, 7); ctx.fill();

    // IgE (Y) en la membrana

    for (let i = 0; i < 8; i++) { const a = -2.6 + i * 0.5, bx = cx + Math.cos(a) * 74, by = cy + Math.sin(a) * 74, tx = cx + Math.cos(a) * 100, ty = cy + Math.sin(a) * 100, nx = -Math.sin(a), ny = Math.cos(a);
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(tx, ty); ctx.moveTo(tx, ty); ctx.lineTo(tx + Math.cos(a) * 14 + nx * 11, ty + Math.sin(a) * 14 + ny * 11); ctx.moveTo(tx, ty); ctx.lineTo(tx + Math.cos(a) * 14 - nx * 11, ty + Math.sin(a) * 14 - ny * 11); ctx.stroke(); }
    // alérgeno que entra y puentea la IgE
    const ax = lerp(1000, 804, ease(seg(t, 5.2, 2.6))), ay = lerp(220, 270, ease(seg(t, 5.2, 2.6)));
    ctx.fillStyle = '#C97A1E'; ctx.beginPath(); ctx.moveTo(ax - 12, ay); ctx.lineTo(ax, ay - 12); ctx.lineTo(ax + 12, ay); ctx.lineTo(ax, ay + 12); ctx.closePath(); ctx.fill();
    // histamina y leucotrienos que salen
    for (let i = 0; i < 14; i++) { const u = seg(t, 8.8 + i * 0.1, 3), ang = -0.9 + (i / 14) * 2.2; if (u <= 0 || u >= 1) continue; ctx.globalAlpha = ins * (1 - u); ctx.fillStyle = C.AMBER; ctx.beginPath(); ctx.arc(cx + Math.cos(ang) * (110 + u * 160), cy + Math.sin(ang) * (110 + u * 90), 5, 0, 7); ctx.fill(); }

  // 3) la mucosa se edematiza: cornetes pálidos y azulados, rinorrea, estornudos

  const es = fade(t, 12.5, 18.5, 0.5); if (es > 0) { const [sx, sy] = pl.P(20, 600); arrow(sx - 4, sy, sx - 30, sy - 24, C.AMBER, es, 4); arrow(sx - 4, sy + 10, sx - 32, sy + 10, C.AMBER, es, 4); arrow(sx - 4, sy + 20, sx - 30, sy + 44, C.AMBER, es, 4); }

    const gx = 650, gy = 200, cw = 285, ch = 92;
    text('Frecuencia', 530, gy + ch / 2 + 6, 16, C.BLUE, 'bold'); text('Severidad', 530, gy + ch * 1.5 + 14, 16, C.AMBER, 'bold');
    const cells = [['Intermitente', 'Menos de 4 días/semana', 'o menos de 4 semanas', 0], ['Persistente', '4 o más días/semana', 'y 4 o más semanas', 1], ['Leve', 'Sin alteración funcional', '', 0], ['Moderada a severa', 'Basta uno: sueño, actividades,', 'rendimiento o molestia', 1]];
    cells.forEach((c, i) => { const x = gx + (i % 2) * (cw + 10), y = gy + Math.floor(i / 2) * (ch + 10), hot = c[3] && t > 18; rrect(x, y, cw, ch, 12, hot ? 'rgba(255,194,71,0.2)' : '#1E2530');

// ================= orl-10 · rinosinusitis: viral vs bacteriana (10 días, doble caída) y complicaciones orbitarias de Chandler =================

    ctx.strokeStyle = C.GRID; ctx.lineWidth = 1; for (let d = 0; d <= 14; d += 2) { const x = cx0 + cw * d / 14; ctx.beginPath(); ctx.moveTo(x, cy0 - chh); ctx.lineTo(x, cy0); ctx.stroke(); text(String(d), x, cy0 + 20, 13, C.MUTED, '', 'center'); } text('días', cx0 + cw + 10, cy0 + 20, 13, C.MUTED);
    const Y = v => cy0 - v * chh, X = d => cx0 + cw * d / 14;
    const vir = d => d < 4 ? 0.1 + 0.22 * d : Math.max(0.05, 0.98 - 0.12 * (d - 4));

// ================= orl-11 · epistaxis: escalera anterior (compresión, vasoconstrictor, nitrato de plata, tapón) y posterior (Foley) =================
def('epistaxis', 29, { nose: 'servier/Cavite_nasale.png' }, SV, t => {
  K.title('Epistaxis', 'La escalera de manejo', C.RED);
  const pl = Plate('nose', 0, 380, 740, 520, 40, 150, 520); pl.draw(seg(t, 0, 0.7));
  const NOS = pl.P(45, 670), KIE = [150, 640], KP = pl.P(...KIE);

  if (bl > 0) { ctx.save(); pl.clip(); ctx.fillStyle = `rgba(200,16,46,${0.5 + 0.2 * pulse(t, 4)})`; ctx.beginPath(); ctx.arc(KP[0], KP[1], 20, 0, 7); ctx.fill(); ctx.restore();
    for (let i = 0; i < 3; i++) { const u = ((t * 0.8) + i / 3) % 1; drop(NOS[0] + 4, NOS[1] + 30 + u * 70, bl * (1 - u), '#C8102E'); } }
  label('Plexo de Kiesselbach (tabique anterior)', 300, 205, C.RED, ...KP, fade(t, 1, 5.5));
  label('Más de 90 %: anterior', 150, 560, C.GREEN, NOS[0] + 10, NOS[1] - 6, fade(t, 2, 5.5));
  // 1) compresión digital: pinzar las alas, 15 minutos
  const c1 = fade(t, 5.5, 9.2, 0.4); if (c1 > 0) { const [ax, ay] = pl.P(80, 590), [bx, by] = pl.P(80, 700); arrow(ax, ay - 40, ax, ay, C.AMBER, c1, 6); arrow(bx, by + 40, bx, by, C.AMBER, c1, 6);
    ctx.save(); ctx.globalAlpha = c1; ctx.strokeStyle = '#2A2F38'; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(300, 440, 34, 0, 7); ctx.stroke(); ctx.strokeStyle = C.AMBER; ctx.beginPath(); ctx.arc(300, 440, 34, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * seg(t, 5.8, 3)); ctx.stroke(); text('15 min', 300, 446, 16, C.INK, 'bold', 'center'); ctx.restore(); }
  // 2) algodón con vasoconstrictor
  const c2 = fade(t, 9.4, 13.2, 0.4); if (c2 > 0) { ctx.save(); pl.clip(); ctx.globalAlpha = c2; ctx.lineCap = 'round'; const [x0, y0] = pl.P(70, 650), [x1, y1] = pl.P(200, 640); ctx.strokeStyle = '#8F96A3'; ctx.lineWidth = 24; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.strokeStyle = '#F3EEE6'; ctx.lineWidth = 19; ctx.stroke(); ctx.restore(); }
  label('Algodón con lidocaína y adrenalina', 330, 560, '#DDE7EE', ...pl.P(130, 645), fade(t, 9.6, 13.2));
  // 3) nitrato de plata sobre el vaso visible
  const c3 = fade(t, 13.4, 16.6, 0.3); if (c3 > 0) { ctx.save(); pl.clip(); ctx.globalAlpha = c3; ctx.lineCap = 'round'; const [sx, sy] = pl.P(20, 610), k = ease(seg(t, 13.5, 1.5)); const tx = lerp(sx, KP[0] - 4, k), ty = lerp(sy, KP[1] - 2, k);
    ctx.strokeStyle = '#4A525C'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(sx - 30, sy - 30); ctx.lineTo(tx, ty); ctx.stroke(); ctx.strokeStyle = '#C9D1D9'; ctx.lineWidth = 4; ctx.stroke(); ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(tx, ty, 6, 0, 7); ctx.fill();
    if (k >= 1) { ctx.globalAlpha = c3 * seg(t, 15, 0.5); ctx.fillStyle = '#E8E8E8'; ctx.beginPath(); ctx.arc(KP[0], KP[1], 14, 0, 7); ctx.fill(); } ctx.restore(); }
  label('Nitrato de plata: un solo lado', 330, 600, '#C9D1D9', ...KP, fade(t, 14, 16.6));
  // 4) taponamiento anterior (capas de gasa / esponja)
  const c4 = fade(t, 16.8, 28.5, 0.4); if (c4 > 0) { ctx.save(); pl.clip(); ctx.globalAlpha = c4; ctx.lineCap = 'round'; const n = Math.round(1 + 6 * ease(seg(t, 17, 2.2)));
    for (let i = 0; i < n; i++) { const [x0, y0] = pl.P(75, 690 - i * 6), [x1, y1] = pl.P(250, 686 - i * 6); ctx.strokeStyle = i % 2 ? '#E4DCCB' : '#F3EEE6'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); } ctx.restore(); }
  label('Tapón anterior: 48 horas', 330, 520, '#E4DCCB', ...pl.P(160, 685), fade(t, 17, 21));
  // 5) posterior: sangre a la faringe, Foley con balón, tapón anterior
  const po = fade(t, 21, 29, 0.5);
  if (po > 0) { const [rx, ry] = pl.P(570, 560); ring(rx, ry, 18 + 5 * pulse(t, 5), C.RED, po, 4);
    for (let i = 0; i < 4; i++) { const u = ((t * 0.9) + i / 4) % 1; const [px, py] = pl.P(600 + 30 * u, 640 + 80 * u); drop(px, py, po * (1 - u) , '#C8102E'); }
    label('Esfenopalatina: sangra hacia la faringe', 400, 205, C.RED, rx, ry, fade(t, 21, 25.5)); }
  const fo = fade(t, 23.5, 28.8, 0.4); if (fo > 0) { ctx.save(); pl.clip(); ctx.globalAlpha = fo; ctx.lineCap = 'round'; const FP = [[40, 640], [140, 662], [300, 650], [450, 636], [560, 640]].map(p => pl.P(...p)); const fp = poly(FP);

    const [bx, by] = FP[4], r = 26 * ease(seg(t, 25.4, 1.2)) * pl.s / 0.7; if (r > 1) { const g = ctx.createRadialGradient(bx - r * 0.3, by - r * 0.3, r * 0.1, bx, by, r); g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(1, 'rgba(140,165,190,0.95)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx + 14, by, r, 0, 7); ctx.fill(); ctx.strokeStyle = '#56616E'; ctx.lineWidth = 2; ctx.stroke(); } ctx.restore();
    label('Sonda Foley: balón con 8 a 10 mL', 400, 560, '#DDE7EE', ...pl.P(575, 640), fade(t, 25.4, 28.8)); }
  // escalera
  const SC = [['1. Compresión digital', 'Cabeza hacia adelante, 15 min', 5.5, C.AMBER], ['2. Vasoconstrictor tópico', 'Algodón 5 a 10 min', 9.4, C.AMBER], ['3. Nitrato de plata', 'Solo si ves el vaso', 13.4, C.GREEN], ['4. Taponamiento anterior', 'Gasa o Merocel, 48 h', 16.8, C.BLUE], ['Posterior: sonda Foley', 'Hospitalizar y antibiótico', 21, C.RED]];
  SC.forEach(([ti, d, a, col], i) => { const k = seg(t, a, 0.5); if (k <= 0) return; const x = 620 + i * 12, y = 160 + i * 98, on = t >= a && (i === 4 || t < SC[i + 1][2]);
    ctx.save(); ctx.globalAlpha = k; rrect(x, y, 600 - i * 12, 84, 14, on ? '#222B38' : '#161B22'); ctx.fillStyle = col; ctx.fillRect(x, y, 6, 84); text(ti, x + 24, y + 36, 21, col, 'bold'); text(d, x + 24, y + 64, 17, C.INK); ctx.restore(); });
});

// ================= orl-12 · hematoma septal: sangre bajo el pericondrio → cartílago sin irrigación → silla de montar; drenaje =================
def('hematoma', 27, { head: 'servier/Sinus.png', nose: 'servier/Cavite_nasale.png' }, SV, t => {
  K.title('Hematoma septal', 'Un golpe en la nariz que no se puede observar', C.RED);
  const pl = Plate('head', 130, 390, 530, 400, 40, 150, 470); pl.draw(seg(t, 0, 0.7));
  strokePoly(pl, [[395, 490], [395, 705]], '#8FB4C8', 4, seg(t, 0.4, 0.5) * 0.9);
  // golpe
  const gp = seg(t, 1, 0.4) * (1 - seg(t, 3, 0.8)); if (gp > 0) { const [x, y] = pl.P(395, 440); ctx.save(); ctx.globalAlpha = gp; ctx.strokeStyle = C.AMBER; ctx.lineWidth = 5; ctx.lineCap = 'round'; for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * 18, y + Math.sin(a) * 18); ctx.lineTo(x + Math.cos(a) * 40, y + Math.sin(a) * 40); ctx.stroke(); } ctx.restore(); }
  label('Golpe en la nariz', 130, 215, C.AMBER, ...pl.P(395, 440), fade(t, 1, 4));
  // sangre bajo el pericondrio: dos abultamientos que ocluyen ambas fosas
  const hm = ease(seg(t, 4, 4));
  if (hm > 0) { ctx.save(); pl.clip(); for (const [cx, sg] of [[372, 1], [418, -1]]) { const [x, y] = pl.P(cx + sg * 4 * hm, 610); ctx.fillStyle = `rgba(112,36,110,${0.85 * hm})`; ctx.strokeStyle = `rgba(70,20,80,${hm})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(x, y, (6 + 22 * hm) * pl.s, (20 + 60 * hm) * pl.s, 0, 0, 7); ctx.fill(); ctx.stroke(); } ctx.restore(); }
  label('Abombamiento violáceo, blando y bilateral', 300, 190, C.VIOLET, ...pl.P(420, 600), fade(t, 5, 12));
  label('No se retrae con descongestionante', 300, 235, C.RED, ...pl.P(370, 600), fade(t, 6.5, 12));
  // cartílago sin irrigación: necrosis
  const ne = ease(seg(t, 9.5, 3));
  if (ne > 0) { ctx.save(); pl.clip(); ctx.strokeStyle = `rgba(40,30,30,${0.85 * ne})`; ctx.lineWidth = 12; ctx.setLineDash([14, 8]); ctx.beginPath(); const [a1, b1] = pl.P(395, 500), [a2, b2] = pl.P(395, 700); ctx.moveTo(a1, b1); ctx.lineTo(a2, b2); ctx.stroke(); ctx.restore(); }
  label('Cartílago septal: se nutre del pericondrio', 300, 495, C.RED, ...pl.P(395, 690), fade(t, 9.5, 15));
  const ck = fade(t, 11, 16, 0.4); if (ck > 0) { ctx.save(); ctx.globalAlpha = ck; ctx.strokeStyle = '#2A2F38'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(590, 330, 34, 0, 7); ctx.stroke(); ctx.strokeStyle = C.RED; ctx.beginPath(); ctx.arc(590, 330, 34, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * seg(t, 11, 4)); ctx.stroke(); text('24 a 48 h', 590, 336, 15, C.INK, 'bold', 'center'); ctx.restore(); }
  // inset sagital: silla de montar
  const sa = seg(t, 14, 0.8); if (sa > 0) { ctx.save(); ctx.globalAlpha = sa; rrect(660, 150, 580, 300, 16, '#161B22'); text('Necrosis: nariz en silla de montar', 680, 184, 20, C.RED, 'bold'); ctx.restore();
    const pn = Plate('nose', 0, 0, 330, 520, 690, 200, 150); pn.draw(sa);
    const dors = [[200, 20], [190, 120], [170, 230], [140, 330], [100, 420]], coll = [[200, 20], [190, 120], [172, 215], [118, 300], [88, 400]];
    const k = ease(seg(t, 15.5, 2.5));
    strokePoly(pn, dors, 'rgba(61,220,132,0.95)', 4, sa * (1 - 0.0), false, [10, 7]);
    strokePoly(pn, dors.map((p, i) => [lerp(p[0], coll[i][0], k), lerp(p[1], coll[i][1], k)]), '#FF5A4E', 6, sa * k);
    const [ax, ay] = pn.P(130, 270); arrow(ax + 40, ay - 30, ax + 8, ay - 2, C.RED, sa * k, 5);
    ctx.save(); ctx.globalAlpha = sa; text('Dorso previo', 880, 270, 16, C.GREEN, 'bold'); text('Dorso hundido', 880, 300, 16, C.RED, 'bold'); text('Absceso septal si se infecta', 880, 360, 17, C.AMBER, 'bold'); ctx.restore(); }
  // conducta
  K.card(660, 464, 580, 118, C.GREEN, 'Drenaje quirúrgico urgente', ['Incisión del mucopericondrio y aspiración, idealmente en 24 horas', 'Después, taponamiento bilateral compresivo'], seg(t, 19, 0.5), 18);
  K.card(40, 530, 470, 118, C.AMBER, 'Mientras se traslada', ['Analgesia, hielo, cabecera elevada', 'Amoxicilina con clavulánico'], seg(t, 21.5, 0.5), 18);
  K.banner(660, 600, 580, 'No observar ni puncionar con aguja', C.RED, seg(t, 23.5, 0.5));
});

// ================= orl-13 · faringoamigdalitis: escala de McIsaac sobre la amígdala con exudado, conducta por puntaje =================
def('mcisaac', 29, { th: 'blausen/faringe_normal_anormal.png' }, BL, t => {
  K.title('Faringoamigdalitis aguda', 'La escala de McIsaac decide', C.AMBER);
  const pl = Plate('th', 400, 80, 720, 700, 40, 150, 500); pl.draw(seg(t, 0, 0.7));
  tag('Normal', pl.P(560, 100)[0], pl.dy + 24, '#C9D3DC', 16); tag('Faringoamigdalitis', pl.P(960, 100)[0] - 10, pl.dy + 24, '#FF8A80', 16);
  const TON = pl.P(900, 420);
  // criterios
  const CR = [['Fiebre mayor de 38 °C', '+1', 3.5], ['Exudado amigdalino', '+1', 7], ['Adenopatías cervicales anteriores dolorosas', '+1', 10.5], ['Ausencia de tos', '+1', 14], ['Edad de 3 a 14 años', '+1', 17.5]];
  const score = CR.reduce((s, c) => s + (t >= c[2] + 0.8 ? 1 : 0), 0);
  rrect(580, 150, 660, 60, 14, '#161B22'); text('Puntaje de McIsaac', 600, 188, 22, C.INK, 'bold'); text(String(score), 1200, 194, 40, score >= 4 ? C.RED : score >= 2 ? C.AMBER : C.GREEN, 'bold', 'right');
  CR.forEach(([ti, pt, a], i) => { const k = seg(t, a, 0.5); if (k <= 0) return; const y = 222 + i * 56; ctx.save(); ctx.globalAlpha = k; rrect(580, y, 660, 48, 12, '#1B2230'); ctx.fillStyle = C.AMBER; ctx.fillRect(580, y, 5, 48); text(ti, 604, y + 31, 19, C.INK); text(pt, 1216, y + 32, 22, C.GREEN, 'bold', 'right'); ctx.restore(); });
  // anotaciones en la imagen real
  const fv = fade(t, 3.5, 7, 0.4); if (fv > 0) { ctx.save(); ctx.globalAlpha = fv; rrect(60, 590, 200, 44, 12, '#3B1411'); text('Fiebre alta', 160, 619, 20, C.RED, 'bold', 'center'); ctx.restore(); }
  const ex = fade(t, 7, 10.5, 0.4); if (ex > 0) { ring(TON[0], TON[1], 54 + 6 * pulse(t, 5), C.AMBER, ex, 5); label('Exudado blanco', 330, 600, C.AMBER, TON[0] - 20, TON[1] + 20, ex); }
  const ad = fade(t, 10.5, 14, 0.4); if (ad > 0) { const [x, y] = pl.P(1060, 640); ctx.save(); ctx.globalAlpha = ad; ctx.strokeStyle = C.RED; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, 18 + 5 * pulse(t, 5), 0, 7); ctx.stroke(); ctx.restore(); label('Adenopatía anterior dolorosa', 330, 600, C.RED, x, y, ad); }
  const tos = fade(t, 14, 17.5, 0.4); if (tos > 0) { ctx.save(); ctx.globalAlpha = tos; rrect(60, 590, 260, 44, 12, '#10261A'); text('Sin tos ni coriza', 190, 619, 20, C.GREEN, 'bold', 'center'); ctx.restore(); }
  // decisión
  const dc = seg(t, 20, 0.6);
  if (dc > 0) { ctx.save(); ctx.globalAlpha = dc; rrect(580, 150, 660, 500, 16, '#0E1116'); ctx.restore(); ctx.save(); ctx.globalAlpha = dc; rrect(580, 150, 660, 500, 16, '#161B22'); text('Qué hacer según el puntaje', 604, 188, 22, C.INK, 'bold'); ctx.restore();
    const RW = [['0 a 1', 'Sin test ni cultivo', 'Solo sintomático', C.GREEN, 0], ['2 a 3', 'Test rápido o cultivo', 'Antibiótico si es positivo', C.AMBER, 0], ['4 a 5', 'Test, cultivo o tratamiento empírico', 'Penicilina benzatina o amoxicilina', C.RED, 1]];
    RW.forEach(([p, d, tr, col, hot], i) => { const y = 214 + i * 86, k = seg(t, 20.4 + i * 0.5, 0.5); ctx.save(); ctx.globalAlpha = dc * k; rrect(604, y, 612, 76, 12, hot && t > 22.5 ? 'rgba(255,90,78,0.2)' : '#1B2230'); ctx.fillStyle = col; ctx.fillRect(604, y, 6, 76); text(p, 628, y + 46, 30, col, 'bold'); text(d, 740, y + 34, 18, C.INK, 'bold'); text(tr, 740, y + 60, 17, C.MUTED); if (hot && t > 22.5) { ctx.strokeStyle = C.RED; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(604, y, 612, 76, 12); ctx.stroke(); } ctx.restore(); });
    K.card(604, 482, 612, 128, C.BLUE, 'Antibiótico: diez días', ['Penicilina benzatina intramuscular única, o amoxicilina 10 días', 'El objetivo es evitar la fiebre reumática'], seg(t, 24, 0.5), 18); }
  K.banner(580, 660, 660, 'Sin tos ni coriza: casi siempre es viral', C.GREEN, 0 * seg(t, 26, 0.5));
});

// ================= orl-14 · absceso periamigdalino: pilar abombado, úvula al lado sano, trismus; otras infecciones profundas =================

// ================= orl-15 · adenoides y amígdalas: obstrucción del cavum, respirador bucal, escala de Brodsky =================
def('adenoides', 27, { sag: 'blausen/faringe_sagital.png', mouth: 'blausen/boca_amigdalas.png' }, BL, t => {
  K.title('Hipertrofia adenoamigdalina', 'Respirador bucal, ronquido y apneas', C.AMBER);
  const p1 = Plate('sag', 0, 230, 880, 900, 40, 140, 360); p1.draw(seg(t, 0, 0.7));
  const p2 = Plate('mouth', 0, 120, 690, 640, 430, 140, 340); p2.draw(seg(t, 0.4, 0.7));
  // 1) adenoides crecen en el cavum
  const g = ease(seg(t, 1.5, 4));
  if (g > 0) { ctx.save(); p1.clip(); const [x, y] = p1.P(180, 450); ctx.fillStyle = 'rgba(230,130,155,0.93)'; ctx.strokeStyle = '#9B3A55'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(x, y, (20 + 80 * g) * p1.s, (28 + 70 * g) * p1.s, 0.2, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore(); }
  label('Adenoides en el cavum', 130, 540, C.AMBER, ...p1.P(180, 450), fade(t, 2, 8));
  // aire por la nariz: se bloquea
  const air = poly([p1.P(860, 430), p1.P(600, 440), p1.P(420, 470), p1.P(320, 520), p1.P(280, 640), p1.P(250, 800)]);
  dots(air, t, fade(t, 1, 5.5, 0.3) * (1 - 0.7 * g), '#7FC8FF', 9, 0.25, 4);
  const xm = seg(t, 5.5, 0.4) * (1 - seg(t, 12, 0.6)); if (xm > 0) { const [a, b] = p1.P(310, 500); xmark(a, b, 12, C.RED, xm); }
  const mb = fade(t, 6, 14, 0.4); if (mb > 0) { const mp = poly([p1.P(800, 830), p1.P(600, 900), p1.P(380, 850), p1.P(260, 800), p1.P(240, 900)]); dots(mp, t, mb, '#FFC247', 8, 0.3, 4); label('Respira por la boca', 170, 580, C.AMBER, ...p1.P(500, 880), fade(t, 6.5, 14)); }
  // 2) Brodsky: las amígdalas crecen hacia la línea media
  const bs = [[8, 30, 1], [10.5, 55, 2], [13, 95, 3], [15.5, 140, 4]];
  let gr = 0, rad = 18; bs.forEach(([a, r, n]) => { if (t >= a) { gr = n; rad = lerp(rad, r, 1); } });
  const rr = bs.reduce((acc, [a, r]) => acc + (t >= a ? 0 : 0), 0);
  const cur = (() => { let r0 = 18; for (const [a, r] of bs) { r0 = lerp(r0, r, ease(seg(t, a, 1.2))); } return r0; })();
