<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0E1116;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="../lib.js"></script><script src="../kit.js"></script>
<script>
// Diabetes y nutrición, clases nuevas. Gráficos solo de código (sin anatomía): los cortes y las conductas son los del libro.
//   ?v=imc   diab-25 A1: el IMC por tramos (bajo peso, normal, sobrepeso, obesidad I-II, mórbida) y la conducta de cada uno
const V = new URLSearchParams(location.search).get('v') || 'imc';
const L = LIB(document.getElementById('c')), { ctx, C, ease, clamp, lerp, text, tag, rrect } = L;
const K = KIT(L), { seg, fade } = K;

// ---------- diab-25 A1: IMC y conducta ----------
const X0 = 70, X1 = 1210, IMC0 = 14, IMC1 = 46;
const px = v => lerp(X0, X1, (v - IMC0) / (IMC1 - IMC0));
const SEGS = [
  { a: 14, b: 18.5, col: '#4FA3FF', name: 'Bajo peso', rng: '< 18,5' },
  { a: 18.5, b: 25, col: '#3DDC84', name: 'Normal', rng: '18,5 - 24,9' },
  { a: 25, b: 30, col: '#FFC247', name: 'Sobrepeso', rng: '25 - 29,9' },
  { a: 30, b: 35, col: '#FF9A3D', name: 'Obesidad I', rng: '30 - 34,9' },
  { a: 35, b: 40, col: '#FF6B4E', name: 'Obesidad II', rng: '35 - 39,9' },
  { a: 40, b: 46, col: '#E5384F', name: 'Obesidad III', rng: '≥ 40 (mórbida)' },
];
const STAGES = [
  { t0: 4.5, imc: 16.2, col: '#4FA3FF', head: 'Bajo peso · IMC < 18,5',
    lines: ['Con miedo intenso a engordar: sospechar anorexia nerviosa', 'ECG y electrolitos; estabilizar y derivar', 'Realimentar de a poco: 10-15 kcal/kg/día + tiamina'] },
  { t0: 8.8, imc: 21.7, col: '#3DDC84', head: 'Normal · 18,5 - 24,9',
    lines: ['Riesgo habitual', 'Mantener alimentación saludable y ejercicio'] },
  { t0: 11.6, imc: 27.4, col: '#FFC247', head: 'Sobrepeso · 25 - 29,9',
    lines: ['Riesgo cardiometabólico aumentado', 'Estilo de vida; tamizar glicemia y perfil lipídico'] },
  { t0: 15.0, imc: 32.5, col: '#FF9A3D', head: 'Obesidad I y II · 30 - 39,9',
    lines: ['Déficit de 500-750 kcal/día y ejercicio', 'Meta: bajar 5-10% en 6 meses; tratar comorbilidades', 'Fármacos si IMC ≥ 30 (o ≥ 27 con comorbilidad) y fracaso'] },
  { t0: 20.0, imc: 42, col: '#E5384F', head: 'Obesidad mórbida · IMC ≥ 40 (o ≥ 35 con comorbilidad)',
    lines: ['Fracaso del manejo médico bien llevado (≥ 6 meses)', 'Derivar a equipo: cirugía bariátrica (manga o bypass en Y de Roux)'] },
];

function imc(t) {
  const u = STAGES; let v = u[0].imc;
  for (let i = 1; i < u.length; i++) {
    const a = u[i].t0 - 1.0; if (t >= a) v = lerp(u[i - 1].imc, u[i].imc, ease(clamp((t - a) / 1.0, 0, 1)));
  }
  return t < u[0].t0 - 1 ? u[0].imc : v;
}
function stageIdx(t) { let k = -1; STAGES.forEach((s, i) => { if (t >= s.t0) k = i; }); return k; }

function scene(t) {
  K.title('IMC y conducta por tramos', 'El mismo número, cinco conductas distintas', C.AMBER);
  // escala
  const sy = 200, sh = 76, grow = ease(seg(t, 0.3, 2.2));
  SEGS.forEach((s, i) => {
    const x0 = px(s.a), x1 = px(s.b), w = (x1 - x0) * grow;
    ctx.save(); ctx.globalAlpha = 0.92; ctx.fillStyle = s.col; ctx.fillRect(x0, sy, Math.max(0, w - 2), sh); ctx.restore();
  });
  if (grow > 0.9) SEGS.forEach(s => {
    const x0 = px(s.a), x1 = px(s.b), mid = (x0 + x1) / 2;
    ctx.save(); ctx.globalAlpha = seg(t, 2.5, 0.8);
    text(s.name, mid, sy + 33, 20, C.BG, 'bold', 'center'); text(s.rng, mid, sy + 58, 16, C.BG, '', 'center');
    ctx.restore();
  });
  // marcas de corte
  [18.5, 25, 30, 35, 40].forEach(v => { ctx.save(); ctx.globalAlpha = seg(t, 2.5, 0.8); ctx.fillStyle = '#ddd'; ctx.fillRect(px(v) - 1, sy - 8, 2, sh + 16);
    text(String(v).replace('.', ','), px(v), sy - 14, 18, C.MUTED, '', 'center'); ctx.restore(); });
  // marcador
  const k = stageIdx(t), m = imc(t), mx = px(m), ma = seg(t, 3.5, 0.6);
  if (ma > 0) {
    ctx.save(); ctx.globalAlpha = ma;
    const col = k >= 0 ? STAGES[k].col : C.INK;
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(mx, sy + sh + 6); ctx.lineTo(mx - 13, sy + sh + 30); ctx.lineTo(mx + 13, sy + sh + 30); ctx.closePath(); ctx.fill();
    tag('IMC ' + m.toFixed(1).replace('.', ','), mx, sy + sh + 56, col, 22);
    ctx.restore();
  }
  // cintura (fija)
  K.banner(650, 56, 560, 'Cintura ≥ 102 cm (H) · ≥ 88 cm (M): obesidad abdominal', C.VIOLET, seg(t, 3, 0.6));
  // tarjeta de la etapa actual
  if (k >= 0) {
    const s = STAGES[k], a = seg(t, s.t0, 0.5);
    const y = 392, h = 56 + 38 * s.lines.length + 16;
    ctx.save(); ctx.globalAlpha = a;
    rrect(70, y, 1140, h, 16, '#161B22'); ctx.fillStyle = s.col; ctx.fillRect(70, y, 7, h);
    text(s.head, 100, y + 44, 29, s.col, 'bold');
    s.lines.forEach((l, i) => text(l, 100, y + 90 + i * 38, 25, C.INK));
    ctx.restore();
  }
  // cierre
  const fin = seg(t, 25.3, 0.6);
  if (fin > 0) {
    ctx.save(); ctx.globalAlpha = fin;
    rrect(70, 618, 1140, 66, 16, '#1B2230'); ctx.strokeStyle = C.GREEN; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(70, 618, 1140, 66, 16); ctx.stroke();
    text('Obeso con glicemia normal y resistencia a la insulina: solo dieta y ejercicio', 640, 660, 26, C.INK, 'bold', 'center');
    ctx.restore();
  }
}

const SCN = { imc: { f: scene, dur: 29 } };
window.SCENE = { duration: SCN[V].dur, fps: 30 };
window.render = function (t) {
  ctx.fillStyle = C.BG; ctx.fillRect(0, 0, 1280, 720); SCN[V].f(t);
  ctx.fillStyle = 'rgba(14,17,22,0.85)'; ctx.fillRect(700, 696, 580, 24);
  text('Gráfico propio con los cortes del libro (MINSAL y OMS)', 1268, 712, 13, C.MUTED, '', 'right');
};
LOAD({});
</script>
</body></html>
