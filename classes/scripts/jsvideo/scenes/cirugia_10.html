function lamina(a) {
  ctx.save(); ctx.globalAlpha = a; rrect(DST.x - 6, DST.y - 6, DST.w + 12, DST.h + 12, 18, '#FFFFFF');
  ctx.beginPath(); ctx.roundRect(DST.x, DST.y, DST.w, DST.h, 14); ctx.clip();
  ctx.drawImage(I('tor'), SRC.x, SRC.y, SRC.w, SRC.h, DST.x, DST.y, DST.w, DST.h); ctx.restore();
}
function clipL() { ctx.beginPath(); ctx.roundRect(DST.x, DST.y, DST.w, DST.h, 14); ctx.clip(); }
function arrow(x0, y0, x1, y1, col, w = 5, a = 1) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  const dx = x1 - x0, dy = y1 - y0, n = Math.hypot(dx, dy), ux = dx / n, uy = dy / n;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - ux * 12, y1 - uy * 12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - ux * 18 - uy * 9, y1 - uy * 18 + ux * 9); ctx.lineTo(x1 - ux * 18 + uy * 9, y1 - uy * 18 - ux * 9); ctx.closePath(); ctx.fill(); ctx.restore();
}
function label(s, x, y, col, tx, ty, a, size = 16) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = '#1B2230'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(tx, ty, 4.5, 0, 7); ctx.fill(); tag(s, x, y, col, size); ctx.restore();
}
function air(x, y, r, a) {
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(0.6, 'rgba(150,220,255,0.6)'); g.addColorStop(1, 'rgba(90,180,240,0.75)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
}
const WOUND = P(1030, 640), NEEDLE_TIP = P(820, 520);        // herida lateral; 2.º espacio intercostal, línea medioclavicular
const TRACH = P(655, 560), MED = P(690, 620);

window.render = function (t) {
  ctx.fillStyle = C.BG; ctx.fillRect(0, 0, 1280, 720);
  K.title('Neumotórax a tensión', 'El aire entra al inspirar y no puede salir', C.RED);
  lamina(seg(t, 0, 0.6));
  const cyc = (t * 0.9) % 1;                                // ciclo respiratorio: 0-0.5 inspira, 0.5-1 espira
  const insp = cyc < 0.5;
  // 1) válvula + llenado
  const fill = ease(seg(t, 2, 11)), decomp = ease(seg(t, 24, 3.5));
  const vol = fill * (1 - decomp * 0.92);
  ctx.save(); clipL();
  const n = Math.floor(SPOTS.length * vol * 0.95);
  for (let i = 0; i < n; i++) { const [x, y, q] = SPOTS[i], [px, py] = P(x, y); air(px + Math.sin(t * 2 + q * 9) * 2, py + Math.cos(t * 2 + q * 7) * 2, 9 + 7 * q, 0.55); }
  ctx.restore();
  if (t > 2 && t < 24.5) {
    // flecha de aire entrando solo al inspirar; "X" al espirar
    const a = seg(t, 2, 0.5) * (1 - seg(t, 23.5, 0.8));
    if (insp) arrow(WOUND[0] + 90, WOUND[1] - 26 + 0, WOUND[0] + 6, WOUND[1] - 6, C.BLUE, 7, a * clamp(cyc * 6, 0, 1));
    else { ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = C.RED; ctx.lineWidth = 7; const [x, y] = [WOUND[0] + 54, WOUND[1] - 16]; ctx.beginPath(); ctx.moveTo(x - 14, y - 14); ctx.lineTo(x + 14, y + 14); ctx.moveTo(x + 14, y - 14); ctx.lineTo(x - 14, y + 14); ctx.stroke(); ctx.restore(); }
    label('Válvula: entra, no sale', WOUND[0] - 10, WOUND[1] + 68, C.AMBER, WOUND[0] + 4, WOUND[1] - 2, seg(t, 2.2, 0.5) * (1 - seg(t, 8, 0.5)), 16);
  }
  // 2) desplazamiento del mediastino y de la tráquea hacia el lado sano (pantalla: izquierda)
  const shift = ease(seg(t, 11, 3.5)) * (1 - decomp);
  if (shift > 0.02) {
    arrow(MED[0] + 60, MED[1], MED[0] + 60 - 70 * shift, MED[1], C.AMBER, 7, 0.95);
    arrow(TRACH[0] + 24, TRACH[1] - 70, TRACH[0] + 24 - 54 * shift, TRACH[1] - 70, C.RED, 6, 0.95);
    ctx.save(); ctx.globalAlpha = 0.9 * shift; ctx.strokeStyle = C.RED; ctx.setLineDash([6, 6]); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(TRACH[0] + 4, TRACH[1] - 190); ctx.lineTo(TRACH[0] + 4 - 30 * shift, TRACH[1] + 20); ctx.stroke(); ctx.restore();
    label('Tráquea desviada', TRACH[0] - 110, TRACH[1] - 50, C.RED, TRACH[0] - 8, TRACH[1] - 50, seg(t, 13, 0.5) * (1 - decomp), 15);
    label('Mediastino desplazado', MED[0] - 120, MED[1] + 70, C.AMBER, MED[0], MED[1] + 8, seg(t, 12.5, 0.5) * (1 - decomp), 15);
  }
  // 3) signos y shock
  const yug = P(660, 330);
  label('Yugulares ingurgitadas', yug[0] - 150, yug[1] - 4, C.VIOLET, yug[0] - 22, yug[1] + 4, seg(t, 15, 0.5) * (1 - decomp), 15);
  K.card(640, 130, 590, 112, C.AMBER, 'Examen del lado afectado', ['Timpanismo a la percusión · murmullo abolido'], seg(t, 15.5, 0.6) * (1 - seg(t, 24, 0.6)), 18);
  // monitor de presión
  const bp = lerp(120, 70, ease(seg(t, 17, 5))) * (1 - decomp) + 112 * decomp;
  const a2 = seg(t, 17, 0.6);
  if (a2 > 0) {
    ctx.save(); ctx.globalAlpha = a2; rrect(640, 262, 590, 150, 16, '#161B22'); ctx.fillStyle = bp < 90 ? C.RED : C.GREEN; ctx.fillRect(640, 262, 6, 150);
    text('Shock obstructivo', 662, 296, 21, bp < 90 ? C.RED : C.GREEN, 'bold');
    text(`${Math.round(bp)}/${Math.round(bp * 0.58)}`, 662, 370, 56, C.INK, 'bold'); text('mmHg', 840, 370, 20, C.MUTED);
    text('El corazón no se llena: la vena cava se comprime', 662, 398, 17, C.MUTED); ctx.restore();
  }
  // 4) descompresión con aguja
  const nd = ease(seg(t, 22, 2));
  if (nd > 0) {
    const [tx, ty] = NEEDLE_TIP, sx = tx + 160 * (1 - nd), sy = ty - 80 * (1 - nd);
    ctx.save(); ctx.strokeStyle = '#DDE3EA'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(sx + 70, sy - 35); ctx.lineTo(sx, sy); ctx.stroke();
    ctx.strokeStyle = '#8FA0B3'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(sx + 110, sy - 55); ctx.lineTo(sx + 70, sy - 35); ctx.stroke(); ctx.restore();
    label('2.º espacio intercostal, línea medioclavicular', tx - 20, ty + 150, C.GREEN, tx, ty, nd, 15);
    for (let i = 0; i < 6; i++) { const k = (t * 0.8 + i / 6) % 1; if (decomp < 0.98) air(sx + 110 + k * 110, sy - 55 - k * 70, 9 - 4 * k, (1 - k) * 0.9 * nd); }
  }
  K.banner(640, 600, 590, 'Se descomprime sin esperar la radiografía', C.GREEN, seg(t, 25.5, 0.6));
  K.card(640, 436, 590, 118, C.GREEN, 'Después', ['Tubo pleural en el 5.º espacio intercostal'], seg(t, 27, 0.6), 18);
  K.credit('Ilustración: Blausen.com staff (2014), CC BY 3.0 · rótulos y animación propios');
};
