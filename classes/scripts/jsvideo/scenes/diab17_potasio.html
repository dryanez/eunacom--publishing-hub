<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0E1116;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="../lib.js"></script>
<script>
// diab-17: la insulina activa la bomba sodio-potasio y mete el potasio a la célula: el potasio plasmático cae.
// ?v=1 potasio normal (4,5 → 3,6); ?v=2 parte bajo 3,3: cae a 2,4 y aparece la arritmia → primero potasio, después insulina.
// Base: Servier Medical Art (CC BY 4.0): membrana celular y bomba.
const V2 = new URLSearchParams(location.search).get('v') === '2';
window.SCENE = { duration: V2 ? 22 : 17, fps: 30 };
const { ctx, C, ease, clamp, lerp, text, tag, rrect } = LIB(document.getElementById('c'));
const seg = (t, a, d) => clamp((t - a) / d, 0, 1);
const S = 3.25, X0 = -70, Y0 = 100;                         // membrana.png 415x280: cuarto de elipse centrada abajo a la derecha
const CX = X0 + 415 * S, CY = Y0 + 280 * S, RX = 415 * S, RY = 280 * S;
const onM = (th, d = 0) => { const c = Math.cos(th), s = Math.sin(th), n = Math.hypot(c / RX, s / RY);
  return [CX + RX * c + (c / RX / n) * d, CY + RY * s + (s / RY / n) * d]; };       // d > 0: hacia afuera (sangre)
const PUMPS = [3.55, 3.85, 4.15];                            // ángulos de las bombas sobre la membrana
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

function ion(x, y, label, col, r = 15, a = 1) {
  ctx.globalAlpha = a; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
  text(label, x, y + 5, 13, '#0E1116', 'bold', 'center'); ctx.globalAlpha = 1;
}

window.render = function (t) {
  ctx.fillStyle = C.BG; ctx.fillRect(0, 0, 1280, 720);
  ctx.drawImage(window.IMGS.mem, X0, Y0, 415 * S, 280 * S);
  text(V2 ? 'Si el potasio ya está bajo' : 'La insulina mete el potasio a la célula', 40, 70, 40, V2 ? C.RED : C.BLUE, 'bold');
  text(V2 ? 'Bajo 3,3: primero potasio, después insulina' : 'Activa la bomba sodio-potasio', 40, 106, 23, C.MUTED);
  const la = seg(t, 0.6, 0.5);
  ctx.globalAlpha = la; tag('Sangre', 110, 180, '#C0392B'); tag('Célula', 760, 620, '#E78FB3'); ctx.globalAlpha = 1;

  // la insulina se une y las bombas se encienden
  const tI = V2 ? 13.2 : 2.4, tOn = tI + 1.2;
  const ins = seg(t, tI, 1.0);
  if (ins > 0) {
    const [px, py] = onM(4.0, 16), sx = 520, sy = 190, e = ease(ins);
    ctx.save(); ctx.translate(lerp(sx, px, e), lerp(sy, py, e));
    ctx.fillStyle = C.BLUE; ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ctx.lineTo(16 * Math.cos(a), 16 * Math.sin(a)); } ctx.fill();
    ctx.restore();
    if (ins > 0.2) { ctx.globalAlpha = seg(t, tI + 0.2, 0.4); tag('Insulina', lerp(sx, px, e) - 70, lerp(sy, py, e) - 30, C.BLUE, 17); ctx.globalAlpha = 1; }
  }
  const on = seg(t, tOn, 0.6);
  PUMPS.forEach((th, i) => {
    const [x, y] = onM(th, 0), ang = Math.atan2(Math.sin(th) / RY, Math.cos(th) / RX) + Math.PI / 2;
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    if (on > 0) { ctx.shadowColor = 'rgba(255,194,71,0.9)'; ctx.shadowBlur = 25 * on * (0.7 + 0.3 * Math.sin(t * 6 + i)); }
    ctx.drawImage(window.IMGS.pump, -44, -51, 88, 101); ctx.restore();
  });
  if (on > 0) { ctx.globalAlpha = on; const [x, y] = onM(3.85, 120); tag('Bomba Na/K', x - 20, y, C.AMBER, 17); ctx.globalAlpha = 1; }

  // potasio: N iones afuera; con la bomba encendida entran por la bomba más cercana
  const N = V2 ? 10 : 16, flow = clamp((t - tOn) / 7.5, 0, 1);
  for (let i = 0; i < N; i++) {
    const th = 3.5 + rnd(i) * 0.75, d = 60 + rnd(i + 50) * 170;
    const out0 = onM(th, d); out0[1] = Math.max(150, out0[1]); out0[0] = Math.max(20, out0[0]);
    const wob = [Math.sin(t * 1.3 + i) * 6, Math.cos(t * 1.1 + i * 2) * 6];
    const go = clamp(flow * N * 1.15 - i * 1.0, 0, 1);                                   // cada ion entra en su turno
    const pump = PUMPS[i % 3], pIn = onM(pump, 20), pOut = onM(pump, -60 - rnd(i + 9) * 150);
    let x, y;
    if (go <= 0) { x = out0[0] + wob[0]; y = out0[1] + wob[1]; }
    else if (go < 0.5) { const k = ease(go * 2); x = lerp(out0[0], pIn[0], k); y = lerp(out0[1], pIn[1], k); }
    else { const k = ease((go - 0.5) * 2); x = lerp(pIn[0], pOut[0], k) + wob[0] * k; y = lerp(pIn[1], pOut[1], k) + wob[1] * k; }
    ion(x, y, 'K+', '#B388FF');
  }
  // sodio sale (pocos, para mostrar el intercambio)
  if (on > 0) for (let i = 0; i < 6; i++) {
    const u = ((t - tOn) * 0.35 + i / 6) % 1, pump = PUMPS[i % 3];
    const a = onM(pump, -40), b = onM(pump, 120 + 40 * rnd(i));
    ion(lerp(a[0], b[0], u), lerp(a[1], b[1], u), 'Na+', '#F2CF5B', 12, on * Math.min(1, u * 5, (1 - u) * 5) * 0.85);
  }

  // medidor del potasio plasmático
  const K0 = V2 ? 3.1 : 4.5, K1 = V2 ? 2.4 : 3.6;
  let K = lerp(K0, K1, ease(flow));
  if (V2) K = t < 12.5 ? lerp(3.1, 4.0, ease(seg(t, 4.5, 6))) : lerp(4.0, 3.6, ease(flow));   // con reposición previa
  const gx = 930, gy = 150;
  rrect(gx, gy, 310, 200, 18, '#161B22');
  text('Potasio en sangre', gx + 22, gy + 38, 21, C.INK, 'bold');
  const kc = K < 3.3 ? C.RED : K < 3.5 ? C.AMBER : C.GREEN;
  text(K.toFixed(1).replace('.', ','), gx + 22, gy + 110, 60, kc, 'bold');
  text('mEq/L', gx + 140, gy + 110, 20, C.MUTED);
  rrect(gx + 22, gy + 140, 266, 14, 7, '#222833'); rrect(gx + 22, gy + 140, 266 * clamp((K - 2) / 3.5, 0, 1), 14, 7, kc);
  const m33 = gx + 22 + 266 * (3.3 - 2) / 3.5; ctx.fillStyle = '#ddd'; ctx.fillRect(m33 - 1, gy + 134, 2, 26); text('3,3', m33, gy + 180, 14, C.MUTED, '', 'center');

  if (V2) {
    // al inicio: K bajo → no se parte con insulina; se repone potasio
    const a1 = seg(t, 1.0, 0.5) * (1 - seg(t, 12.6, 0.5));
    if (a1 > 0) {
      ctx.globalAlpha = a1;
      rrect(930, 380, 310, 150, 18, '#1E1517');
      text('Insulina ahora:', 952, 416, 20, C.RED, 'bold');
      text('el potasio caería a 2,4', 952, 448, 19, C.INK);
      text('→ arritmia ventricular', 952, 478, 19, C.INK);
      // electro con extrasístoles
      ctx.strokeStyle = C.RED; ctx.lineWidth = 2.5; ctx.beginPath();
      for (let x = 0; x < 270; x++) { const ph = (x + t * 120) % 90; const y = 510 - (ph > 40 && ph < 46 ? 22 * Math.sin((ph - 40) * Math.PI / 6) : 0) + (ph > 60 && ph < 80 ? 8 * Math.sin((ph - 60) * Math.PI / 20) : 0);
        x ? ctx.lineTo(952 + x, y) : ctx.moveTo(952 + x, y); }
      ctx.stroke(); ctx.globalAlpha = 1;
    }
    const a2 = seg(t, 4.0, 0.5) * (1 - seg(t, 12.6, 0.5));
    if (a2 > 0) { ctx.globalAlpha = a2; tag('Primero: cloruro de potasio', 1085, 580, C.GREEN, 19); ctx.globalAlpha = 1; }
    const a3 = seg(t, 12.8, 0.5);
    if (a3 > 0) { ctx.globalAlpha = a3; tag('Sobre 3,3: recién ahora la insulina', 1085, 400, C.BLUE, 19); ctx.globalAlpha = 1; }
  } else if (t > 12) {
    const a = seg(t, 12, 0.5); ctx.globalAlpha = a;
    rrect(930, 380, 310, 110, 18, '#131B26');
    text('El tanque estaba vacío:', 952, 418, 20, C.BLUE, 'bold');
    text('el potasio de la sangre', 952, 450, 19, C.INK); text('era engañoso', 952, 478, 19, C.INK);
    ctx.globalAlpha = 1;
  }
  rrect(780, 694, 500, 26, 6, 'rgba(14,17,22,0.85)');
  text('Ilustración: Servier Medical Art, CC BY 4.0 · rótulos y animación propios', 1268, 712, 13, C.MUTED, '', 'right');
};
LOAD({ mem: '../assets/servier/membrana.png', pump: '../assets/servier/bomba_na_k.png' });
</script>
</body></html>
