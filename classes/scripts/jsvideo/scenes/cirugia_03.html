<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0E1116;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="../lib.js"></script><script src="../kit.js"></script>
<script>
// Cirugía 11.3: diverticulitis. Divertículo que se obstruye y microperfora; escalones de Hinchey (flemón → absceso → peritonitis purulenta → fecal).
// Base: Blausen.com staff (2014) "The Large Intestine", CC BY 3.0; rótulos quitados (assets/blausen/colon_grueso.png, 1402x1428).
const L = LIB(document.getElementById('c')), { ctx, C, ease, clamp, lerp, text, tag, rrect, poly } = L;
const K = KIT(L), { seg, fade } = K;
const I = k => window.IMGS[k];
function LAM(crop, box) {
  const [bx, by, bw, bh] = box, s = Math.min(bw / crop[2], bh / crop[3]);
  const w = crop[2] * s, h = crop[3] * s, x0 = bx + (bw - w) / 2, y0 = by + (bh - h) / 2;
  const o = { s, x: x0, y: y0, w, h, P: (x, y) => [x0 + (x - crop[0]) * s, y0 + (y - crop[1]) * s],
    clip() { ctx.beginPath(); ctx.roundRect(x0, y0, w, h, 14); ctx.clip(); },
    draw(a = 1) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; rrect(x0 - 6, y0 - 6, w + 12, h + 12, 18, '#FFFFFF');
      o.clip(); ctx.drawImage(I('img'), crop[0], crop[1], crop[2], crop[3], x0, y0, w, h); ctx.restore(); },
    bulge(pts, anchor, kx, ky, tint) {
      const [ax, ay] = o.P(...anchor); ctx.save(); o.clip(); ctx.translate(ax, ay); ctx.scale(kx, ky); ctx.translate(-ax, -ay);
      ctx.beginPath(); pts.forEach((p, i) => { const [x, y] = o.P(...p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.clip();
      ctx.drawImage(I('img'), crop[0], crop[1], crop[2], crop[3], x0, y0, w, h);
      if (tint) { ctx.fillStyle = tint; ctx.fillRect(x0, y0, w, h); } ctx.restore(); },
  };
  return o;
}
function label(s, x, y, col, tx, ty, a, size = 15) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = '#1B2230'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(tx, ty, 4.5, 0, 7); ctx.fill(); tag(s, x, y, col, size); ctx.restore();
}
function pain(x, y, r, col, a, t) {
  if (a <= 0) return; K.glow(x, y, r * 2.4, col, 0.55 * a);
  for (let i = 0; i < 2; i++) { const u = ((t * 0.9) + i / 2) % 1; ctx.save(); ctx.globalAlpha = a * (1 - u); ctx.strokeStyle = `rgb(${col})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, r + 22 * u, 0, 7); ctx.stroke(); ctx.restore(); }
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = `rgb(${col})`; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
}

const CR = [560, 640, 700, 788];                                  // recorte: colon descendente, sigmoides y recto
const G = LAM(CR, [40, 128, 540, 560]);
const Q = (x, y) => G.P(x + CR[0], y + CR[1]);                    // coordenadas del recorte
const DIV = [[315,376],[364,343],[399,291],[442,242],[252,361],[470,193]];   // posiciones de los divertículos (borde inferior del sigmoides)
const PERF = [364, 343];
function grid() { if (!location.search.includes('grid')) return; ctx.save(); G.clip(); ctx.font = '11px sans-serif';
  for (let x = 0; x <= 700; x += 50) { const [a] = Q(x, 0); ctx.strokeStyle = 'rgba(255,0,0,.6)'; ctx.beginPath(); ctx.moveTo(a, 0); ctx.lineTo(a, 720); ctx.stroke(); ctx.fillStyle = 'red'; ctx.fillText(x, a + 2, 160); }
  for (let y = 0; y <= 788; y += 50) { const [, b] = Q(0, y); ctx.strokeStyle = 'rgba(255,0,0,.6)'; ctx.beginPath(); ctx.moveTo(0, b); ctx.lineTo(1280, b); ctx.stroke(); ctx.fillStyle = 'red'; ctx.fillText(y, 50, b - 2); } ctx.restore(); }
function blob(x, y, rx, ry, col, a, t = 0) {
  if (a <= 0) return; ctx.save(); G.clip(); ctx.globalAlpha = a; const g = ctx.createRadialGradient(x, y, 1, x, y, Math.max(rx, ry));
  g.addColorStop(0, col[0]); g.addColorStop(0.75, col[1]); g.addColorStop(1, col[2]);
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, rx * (1 + 0.03 * Math.sin(t * 4)), ry, 0, 0, 7); ctx.fill(); ctx.restore();
}
const YEL = ['rgba(255,236,150,.95)', 'rgba(236,196,70,.85)', 'rgba(236,196,70,0)'], BRN = ['rgba(150,100,45,.95)', 'rgba(120,76,32,.85)', 'rgba(120,76,32,0)'];
const DUR = 28;
function scene(t) {
  K.title('Diverticulitis aguda', 'Del divertículo obstruido a los escalones de Hinchey', C.RED);
  G.draw(seg(t, 0, 0.7)); grid();
  label('Colon descendente', 560, 190, '#D9D2C3', ...Q(515, 120), fade(t, 0.8, 3.5));
  label('Sigmoides', 560, 330, '#D9D2C3', ...Q(420, 268), fade(t, 1.2, 8, 0.5));
  label('Recto', 440, 620, '#D9D2C3', ...Q(175, 560), fade(t, 1.6, 3.5));
  // 1) divertículos (herniación de mucosa en puntos débiles)
  DIV.forEach((p, i) => { const u = ease(seg(t, 3 + i * 0.35, 1.2)); if (u <= 0) return; const [x, y] = Q(...p); const infl = i === 0 ? ease(seg(t, 7.5, 1.5)) : 0;
    ctx.save(); G.clip(); ctx.globalAlpha = u; const g = ctx.createRadialGradient(x - 3, y - 3, 1, x, y, 15); g.addColorStop(0, infl ? '#FF8A7A' : '#F08C86'); g.addColorStop(1, infl ? '#B21E1E' : '#C85A55');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x - 5, y + 9, 13 * u, 0, 7); ctx.fill(); ctx.strokeStyle = infl ? '#7A1010' : '#8E3B38'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore(); });
  label('Divertículos: presión alta, poca fibra', 300, 600, C.AMBER, ...Q(315, 384), fade(t, 4.5, 8));
  // 2) obstrucción + microperforación
  const [px, py] = Q(...PERF);
  if (t > 7.5) { K.glow(px, py + 8, 40, '255,60,50', 0.6 * fade(t, 7.5, 11, 0.5)); }
  label('Se obstruye e inflama → microperforación', 330, 640, C.RED, px, py + 10, fade(t, 8.2, 11.5));
  // 3) Hinchey
  const s1 = ease(seg(t, 11, 1.5)), s1o = 1 - seg(t, 14, 0.6);
  if (s1 > 0) blob(px, py - 6, 70 * s1, 44 * s1, ['rgba(255,150,150,.55)', 'rgba(255,120,120,.4)', 'rgba(255,120,120,0)'], s1 * (t < 14.3 ? 1 : 0.5), t);
  // Ib: absceso pericólico pequeño, II: grande/pélvico
  const s2 = ease(seg(t, 14, 1.5)), s3 = ease(seg(t, 17, 2));
  if (s2 > 0) blob(px + 10, py + 26, 34 * s2, 26 * s2, YEL, s2, t);
  if (s3 > 0) { blob(px - 30, py + 110, 80 * s3, 62 * s3, YEL, s3, t);
    ctx.save(); G.clip(); ctx.globalAlpha = s3 * 0.6; ctx.strokeStyle = '#E6B93C'; ctx.lineWidth = 3; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(px, py + 40); ctx.lineTo(px - 25, py + 80); ctx.stroke(); ctx.restore(); }
  // drenaje percutáneo (aguja) en el absceso grande
  const dr = seg(t, 19, 1.5) * (1 - seg(t, 21, 0.5));
  if (dr > 0) { const [dx, dy] = [px - 30, py + 110]; ctx.save(); G.clip(); ctx.globalAlpha = dr; ctx.strokeStyle = '#3A4350'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(dx - 150 + 150 * ease(seg(t, 19, 1.5)), dy - 90 + 90 * ease(seg(t, 19, 1.5))); ctx.lineTo(dx - 210, dy - 150); ctx.stroke(); ctx.restore(); }
  // III: peritonitis purulenta (líquido difuso en toda la pelvis); IV: fecal
  const s4 = ease(seg(t, 21.3, 1.8)), s5 = ease(seg(t, 24.2, 1.8));
  if (s4 > 0) { ctx.save(); G.clip(); ctx.globalAlpha = 0.55 * s4; const gg = ctx.createLinearGradient(0, py - 30, 0, py + 60); gg.addColorStop(0, 'rgba(236,196,70,0)'); gg.addColorStop(1, 'rgba(236,196,70,.7)'); ctx.fillStyle = gg; ctx.fillRect(G.x, py - 30, G.w, G.h); ctx.restore(); }
  if (s5 > 0) for (let i = 0; i < 22; i++) { const u = ease(clamp((t - 24.2 - i * 0.05) / 1.8, 0, 1)); const [x, y] = [px + (K.rnd(i) - 0.4) * 160 * u, py + 8 + u * (30 + K.rnd(i + 5) * 190)];
    ctx.save(); G.clip(); ctx.globalAlpha = 0.9 * Math.min(1, u * 5); ctx.fillStyle = '#6E4A22'; ctx.beginPath(); ctx.arc(x, y, 4 + K.rnd(i + 2) * 5, 0, 7); ctx.fill(); ctx.restore(); }
  // tarjetas Hinchey (se enciende la fila activa)
  const rows = [
    ['Hinchey 0 – Ia', 'Engrosamiento o flemón, sin colección', 'Antibióticos', C.GREEN, 11, 14],
    ['Hinchey Ib', 'Absceso pericólico menor de 4 cm', 'Antibióticos, sin drenar', C.AMBER, 14, 17],
    ['Hinchey II', 'Absceso de 4 cm o más, pélvico', 'Drenaje percutáneo guiado por TAC', C.AMBER, 17, 21.3],
    ['Hinchey III – IV', 'Peritonitis purulenta o fecal', 'Operación de Hartmann', C.RED, 21.3, 99],
  ];
  rows.forEach(([a, b, c, col, t0, t1], i) => { const y = 150 + i * 118, on = seg(t, t0, 0.4) * (t < t1 ? 1 : 0.55);
    if (seg(t, t0, 0.4) <= 0) return; ctx.save(); ctx.globalAlpha = on; K.card(620, y, 620, 104, col, a, [b, '→ ' + c], 1, 18); ctx.restore(); });
}
window.SCENE = { duration: DUR, fps: 30 };
window.render = function (t) { ctx.fillStyle = C.BG; ctx.fillRect(0, 0, 1280, 720); scene(t); K.credit('Ilustración: Blausen.com staff (2014), CC BY 3.0 · rótulos y animación propios'); };
LOAD({ img: '../assets/blausen/colon_grueso.png' });
</script>
</body></html>
