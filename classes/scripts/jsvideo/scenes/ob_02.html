<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0E1116;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="../lib.js"></script><script src="../kit.js"></script>
<script>
// Obstetricia 02: amniocentesis guiada por ecografía sobre ilustración real (Blausen "Amniocentesis", rótulos y jeringa quitados).
// Coordenadas en píxeles de la imagen escalada a 800x800. ?v=amniocentesis
const L = LIB(document.getElementById('c')), { ctx, C, ease, clamp, lerp, text, tag, rrect } = L;
const K = KIT(L), { seg, fade } = K;
const I = k => window.IMGS[k];
const S = 0.74, DST = { x: 40, y: 122 }; DST.w = 800 * S; DST.h = 800 * S;
const P = (x, y) => [DST.x + x * S, DST.y + y * S];
const ENTRY = [472, 228], TIP = [425, 305];                       // piel → bolsillo de líquido libre
const dir = (() => { const dx = TIP[0] - ENTRY[0], dy = TIP[1] - ENTRY[1], n = Math.hypot(dx, dy); return [dx / n, dy / n]; })();

function lamina(a) {
  ctx.save(); ctx.globalAlpha = a; rrect(DST.x - 6, DST.y - 6, DST.w + 12, DST.h + 12, 18, '#FFFFFF');
  ctx.beginPath(); ctx.roundRect(DST.x, DST.y, DST.w, DST.h, 14); ctx.clip();
  ctx.drawImage(I('am'), DST.x, DST.y, DST.w, DST.h); ctx.restore();
}
function label(s, x, y, col, tx, ty, a, size = 15) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = '#1B2230'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(tx, ty, 4.5, 0, 7); ctx.fill();
  tag(s, x, y, col, size); ctx.restore();
}
// aguja y jeringa: k = avance (0 fuera, 1 en el líquido), fill 0..1 llenado del cuerpo de la jeringa
function syringe(k, fill, a) {
  if (a <= 0) return; const out = 78 * (1 - k);                           // cuánto queda fuera de la piel (px imagen)
  const tip = [TIP[0] - dir[0] * out, TIP[1] - dir[1] * out];             // punta
  const back = (len) => [tip[0] - dir[0] * len, tip[1] - dir[1] * len];
  ctx.save(); ctx.globalAlpha = a; ctx.lineCap = 'round'; ctx.beginPath(); ctx.roundRect(DST.x, DST.y, DST.w, DST.h, 14); ctx.clip();
  const line = (p, q, w, col) => { ctx.strokeStyle = col; ctx.lineWidth = w * S; ctx.beginPath(); ctx.moveTo(...P(...p)); ctx.lineTo(...P(...q)); ctx.stroke(); };
  line(tip, back(95), 2.4, '#4A525C'); line(tip, back(95), 1.2, '#E8EDF0');   // aguja
  const b0 = back(95), b1 = back(190);
  line(b0, b1, 21, '#56616E'); line(b0, b1, 18, '#F2F5F7');                    // cuerpo
  const f1 = [b0[0] + (b1[0] - b0[0]) * fill, b0[1] + (b1[1] - b0[1]) * fill];
  if (fill > 0) line(b0, f1, 15, '#F4C430');                                   // líquido amniótico aspirado
  const pl = [b1[0] + (f1[0] - b1[0]) * 0 , 0]; const e = back(190 + 40 * fill);
  line(b1, back(235 + 30 * fill), 3, '#56616E');                                // émbolo
  line(back(228 + 30 * fill), back(232 + 30 * fill), 24, '#56616E');
  ctx.restore();
}
function arcs(t, a) {                                                        // ondas del transductor
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.beginPath(); ctx.roundRect(DST.x, DST.y, DST.w, DST.h, 14); ctx.clip();
  const [x, y] = P(275, 190);
  for (let i = 0; i < 3; i++) { const u = ((t * 0.6) + i / 3) % 1; ctx.globalAlpha = a * (1 - u) * 0.8; ctx.strokeStyle = '#7FD6FF'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, (30 + u * 190) * S, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke(); }
  ctx.restore();
}
function credit() { ctx.fillStyle = 'rgba(14,17,22,0.88)'; ctx.fillRect(700, 696, 580, 24); text('Ilustración: Blausen.com staff (2014), CC BY 3.0 · rótulos y animación propios', 1268, 712, 13, C.MUTED, '', 'right'); }

function amniocentesis(t) {
  K.title('Amniocentesis', 'Punción del saco amniótico guiada por ecografía', C.BLUE);
  lamina(seg(t, 0, 0.7));
  arcs(t, fade(t, 1.5, 17, 0.6));
  label('Transductor', 150, 215, '#7FD6FF', ...P(262, 160), fade(t, 1.5, 24));
  label('Feto', 130, 470, '#FFB1B1', ...P(300, 330), fade(t, 2.2, 24));
  label('Líquido amniótico', 360, 190, C.BLUE, ...P(430, 290), fade(t, 3, 8.5));
  const adv = ease(seg(t, 5, 3)) * (1 - ease(seg(t, 14.6, 2.4)));
  const fill = ease(seg(t, 9.5, 4.5)) * (1 - seg(t, 17.5, 0.01));
  syringe(adv, fill, seg(t, 4.8, 0.4));
  label('Aguja bajo visión ecográfica continua', 400, 165, C.GREEN, ...P(448, 262), fade(t, 6.5, 14.5));
  K.card(690, 130, 550, 108, C.BLUE, 'Lo hace el especialista', ['Medicina materno-fetal, desde las 15 a 16 semanas', 'Tú reconoces la indicación, informas y derivas'], seg(t, 1.6, 0.5), 17);
  const ml = 20 * ease(seg(t, 9.5, 4.5)) * (1 - seg(t, 17.5, 0.01));
  if (t > 9.2 && t < 17.5) { ctx.save(); ctx.globalAlpha = seg(t, 9.2, 0.4); rrect(690, 254, 550, 74, 16, '#161B22');
    K.bar(712, 290, 506, 'Líquido aspirado', ml, 20, 'mL', C.AMBER, [[15, '15']], v => Math.round(v)); ctx.restore(); }
  K.card(690, 254, 550, 140, C.AMBER, 'Indicaciones', ['Cariotipo o microarray: tamizaje alto, malformación', 'PCR en infección fetal confirmada (CMV, toxoplasma)', 'Gram, cultivo y glucosa: corioamnionitis'], seg(t, 17.8, 0.5), 17);
  K.card(690, 410, 550, 140, C.RED, 'Riesgos', ['Pérdida fetal atribuible: 0,1 a 0,3 %', 'Pérdida de líquido, corioamnionitis (menos de 1 por mil)', 'Antes de las 15 semanas: más pérdida y pie equino'], seg(t, 20, 0.5), 17);
  K.banner(690, 574, 550, 'Rh negativa no sensibilizada: anti-D 300 µg IM', C.GREEN, seg(t, 22.5, 0.5));
}
window.SCENE = { duration: 27, fps: 30 };
window.render = function (t) { ctx.fillStyle = C.BG; ctx.fillRect(0, 0, 1280, 720); amniocentesis(t); credit(); };
LOAD({ am: '../assets/blausen/ob_amniocentesis.png' });
</script>
</body></html>
