<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0E1116;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="../lib.js"></script><script src="../kit.js"></script>
<script>
// Oftalmología sobre ilustración real. Base: Blausen.com staff (2014), CC BY 3.0:
//   "Pink Eye" (ojo de frente, recortado)  → assets/oftal/ojo_frente.png  (750x620)
//   "Eye Anatomy" (corte del ojo, rótulos quitados con inpainting) → assets/oftal/ojo_corte.png (1500x1320)
// y fondo de ojo de Servier Medical Art (CC BY 4.0) → assets/oftal/fondo_ojo.png (388x388).
// Las capas animadas (vasos, rayos, desprendimiento, tinciones) son propias. Variantes: ?v=<nombre> (ver SCN al final).
const V = new URLSearchParams(location.search).get('v') || 'ojorojo';
const L = LIB(document.getElementById('c')), { ctx, C, ease, clamp, lerp, text, tag, rrect, poly } = L;
const K = KIT(L), { seg, fade, rnd } = K;
const I = k => window.IMGS[k];
const TAU = Math.PI * 2;
const CRED_B = 'Ilustración: Blausen.com staff (2014), CC BY 3.0 · capas y rótulos propios';
const CRED_S = 'Fondo de ojo: Servier Medical Art, CC BY 4.0 · capas y rótulos propios';
let CRED = CRED_B;

// ---------- hoja de ilustración (tarjeta blanca) ----------
function sheet(key, dst, sc, a = 1, bg = '#FFFFFF') {
  const im = I(key), w = im.width * sc, h = im.height * sc;
  dst.w = w; dst.h = h;
  ctx.save(); ctx.globalAlpha = a; rrect(dst.x - 6, dst.y - 6, w + 12, h + 12, 18, bg);
  ctx.beginPath(); ctx.roundRect(dst.x, dst.y, w, h, 14); ctx.clip();
  ctx.drawImage(im, dst.x, dst.y, w, h); ctx.restore();
}
function clipSheet(d) { ctx.beginPath(); ctx.roundRect(d.x, d.y, d.w, d.h, 14); ctx.clip(); }
let AUTO = false;
function label(s, x, y, col, tx, ty, a, size = 15) {
  if (a <= 0) return;
  if (AUTO && (y === 640 || y === 596 || y === 600)) { y = y === 640 ? 612 : 566; x = clamp(tx - 10, 140, 530); }
  ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = '#1B2230'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(tx, ty, 4.5, 0, TAU); ctx.fill();
  tag(s, x, y, col, size); ctx.restore();
}
function credit() { ctx.fillStyle = 'rgba(14,17,22,0.88)'; ctx.fillRect(640, 696, 640, 24); text(CRED, 1268, 712, 13, C.MUTED, '', 'right'); }
function drop(x, y, a, col, s = 1) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y - 12 * s);
  ctx.quadraticCurveTo(x + 9 * s, y + 3 * s, x, y + 9 * s); ctx.quadraticCurveTo(x - 9 * s, y + 3 * s, x, y - 12 * s); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.arc(x - 3 * s, y + 1 * s, 2.2 * s, 0, TAU); ctx.fill(); ctx.restore();
}
// frasco con gota que cae: (x,y) boca del gotero, la gota cae `fall` px
function dropper(x, y, t0, col, fall = 70) {
  const k = seg(L2t, t0, 0.9); if (k <= 0 || k >= 1) return;
  ctx.save(); ctx.globalAlpha = Math.min(1, k * 6, (1 - k) * 6);
  rrect(x - 12, y - 78, 24, 56, 6, '#DDE7EE'); rrect(x - 7, y - 28, 14, 18, 3, '#9FB0BE');
  ctx.restore(); drop(x, y - 4 + fall * ease(k), Math.min(1, k * 5, (1 - k) * 12), col, 1.1);
}
let L2t = 0; // tiempo vigente (para dropper)

// =============== OJO DE FRENTE ===============
const FR = { x: 36, y: 134, w: 0, h: 0 }, FS = 0.8;           // hoja
const F = (x, y) => [FR.x + x * FS, FR.y + y * FS];
const IC = [380, 288], IR = 115, PR = 45;                     // centro del iris, radio del iris, radio de la pupila (px de la imagen)
// borde de los párpados (px de la imagen) para recortar las capas a la apertura palpebral
const UPPER = [[120, 312], [160, 275], [200, 248], [250, 218], [300, 200], [380, 186], [460, 196], [520, 222], [570, 270], [612, 332]];
const LOWER = [[612, 336], [570, 358], [520, 372], [460, 388], [380, 398], [300, 386], [250, 366], [200, 346], [160, 328], [120, 314]];
function aperture() { ctx.beginPath(); [...UPPER, ...LOWER].forEach(([x, y], i) => { const [X, Y] = F(x, y); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.closePath(); }
function frente(a) { sheet('frente', FR, FS, a); }
function inAperture(fn) { ctx.save(); clipSheet(FR); aperture(); ctx.clip(); fn(); ctx.restore(); }
function outAperture(fn) { ctx.save(); clipSheet(FR); fn(); ctx.restore(); }
function irisCircle(r, fn) { const [x, y] = F(...IC); ctx.beginPath(); ctx.arc(x, y, r * FS, 0, TAU); fn(x, y); }
// vasos conjuntivales: de la periferia hacia el limbo (terminan antes del limbo)
function vesselsConj(k, ox = 0, seed = 0) {
  const N = 70; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 0; i < N; i++) {
    const left = i % 2 === 0, th = (rnd(i + seed) - 0.5) * 1.9 + (left ? Math.PI : 0);
    const r0 = 270 + rnd(i + 9) * 40, r1 = 138 + rnd(i + 21) * 36, n = 6, pts = [];
    for (let j = 0; j <= n; j++) { const u = j / n, r = lerp(r0, r1, u), a = th + Math.sin(j * 1.9 + i) * 0.06 * (1 - u * 0.4);
      pts.push([IC[0] + Math.cos(a) * r + ox * (1 - u * 0.4), IC[1] + 26 + Math.sin(a) * r * 0.5]); }
    ctx.strokeStyle = `rgba(214,30,48,${0.92 * k})`; ctx.lineWidth = (2.8 - rnd(i + 3) * 1.1) * FS * 1.5;
    ctx.beginPath(); pts.forEach(([x, y], j) => { const [X, Y] = F(x, y); j ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.stroke();
  }
  const [cx, cy] = F(...IC); const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 300 * FS);
  g.addColorStop(0, 'rgba(230,70,80,0)'); g.addColorStop(0.45, 'rgba(230,70,80,0)'); g.addColorStop(1, `rgba(230,70,80,${0.34 * k})`);
  ctx.fillStyle = g; ctx.fillRect(FR.x, FR.y, FR.w, FR.h);
}
function haloCiliar(k) {
  const [cx, cy] = F(...IC), R = (IR + 52) * FS, g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R), f = v => clamp(v * FS / R, 0, 1);
  g.addColorStop(0, 'rgba(150,30,110,0)'); g.addColorStop(f(IR - 10), 'rgba(150,30,110,0)'); g.addColorStop(f(IR + 2), `rgba(150,30,110,${0.8 * k})`);
  g.addColorStop(f(IR + 20), `rgba(190,40,90,${0.5 * k})`); g.addColorStop(1, 'rgba(190,40,90,0)');
  ctx.fillStyle = g; ctx.fillRect(FR.x, FR.y, FR.w, FR.h);
  ctx.lineCap = 'round';
  for (let i = 0; i < 60; i++) { const a = rnd(i + 5) * TAU, r0 = IR - 2, r1 = IR + 12 + rnd(i + 8) * 28;
    ctx.strokeStyle = `rgba(150,25,95,${0.7 * k})`; ctx.lineWidth = 1.8 * FS * 1.4; ctx.beginPath();
    ctx.moveTo(...F(IC[0] + Math.cos(a) * r0, IC[1] + Math.sin(a) * r0)); ctx.lineTo(...F(IC[0] + Math.cos(a) * r1, IC[1] + Math.sin(a) * r1)); ctx.stroke(); }
}
function cobalto(k) { // luz azul de cobalto: oscurece y tiñe
  if (k <= 0) return; ctx.save(); ctx.globalAlpha = k; ctx.fillStyle = 'rgba(8,24,86,0.62)'; ctx.fillRect(FR.x, FR.y, FR.w, FR.h); ctx.restore();
}
function glowPath(pts, w, col, a, tipR) { // trazo fluorescente con botones terminales
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalAlpha = a;
  ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); pts.forEach(([x, y], i) => { const [X, Y] = F(x, y); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.stroke(); ctx.restore();
}
function panel(x, y, w, col, title, lines, a, size = 17) { K.card(x, y, w, 56 + lines.length * (size + 10) + 6, col, title, lines, a, size); }

// ---------- 01 · ojo rojo: conjuntival vs ciliar ----------
function ojorojo(t) {
  L2t = t; K.title('Ojo rojo: ¿superficial o profundo?', 'Dónde está el rojo decide la conducta', C.RED);
  frente(seg(t, 0, 0.7));
  const conj = fade(t, 1.2, 11.4), swab = seg(t, 4.6, 1.2) * (1 - seg(t, 6, 0.8)), bl = ease(seg(t, 8.4, 2.2));
  inAperture(() => { if (conj > 0) vesselsConj(conj * (1 - 0.92 * bl), 14 * Math.sin(swab * Math.PI * 3) * swab); });
  dropper(...F(250, 215), 6.7, '#CFE8FF');
  label('Inyección conjuntival: roja en la periferia', 330, 640, C.RED, ...F(180, 300), fade(t, 2.4, 9.2), 15);
  label('Vasos móviles con el aplicador', 330, 600, C.AMBER, ...F(160, 330), fade(t, 4.8, 7.8), 15);
  label('Blanquea con fenilefrina', 330, 640, C.GREEN, ...F(180, 300), fade(t, 9.4, 11.6), 15);
  const hal = fade(t, 12.4, 25.5, 0.9), pul = 0.85 + 0.15 * Math.sin(t * 5);
  inAperture(() => { if (hal > 0) haloCiliar(hal * pul); });
  dropper(...F(250, 215), 16.4, '#CFE8FF');
  label('Inyección ciliar: halo violáceo en el limbo', 330, 640, '#C23C8E', ...F(IC[0] - IR - 8, IC[1] + 20), fade(t, 13.2, 21), 15);
  label('No blanquea ni se mueve', 330, 596, C.RED, ...F(IC[0] - IR - 14, IC[1] - 30), fade(t, 17.6, 22), 15);
  panel(660, 140, 580, C.GREEN, 'Superficial: conjuntival', ['Rojo brillante, mayor en la periferia', 'Vasos móviles; blanquea con fenilefrina', 'Sin dolor real ni baja de visión'], seg(t, 1.6, 0.5));
  panel(660, 300, 580, '#C23C8E', 'Profundo: ciliar', ['Halo violáceo pegado a la córnea', 'No se mueve ni blanquea', 'Uveítis, queratitis, glaucoma agudo'], seg(t, 12.6, 0.5));
  K.card(660, 460, 580, 146, C.RED, 'Un solo signo basta para derivar', ['Baja visual · dolor real · pupila alterada', 'Córnea turbia · hipopión o hipema'], seg(t, 19.5, 0.5), 17);
  K.banner(660, 630, 580, 'Jamás corticoides en un ojo rojo sin diagnóstico', C.AMBER, seg(t, 22.2, 0.5));
}

// ---------- 04 · fluoresceína: úlcera dendrítica y bacteriana ----------
const SD = ([x, y]) => [380 + (x - 380) * 1.8, 288 + (y - 288) * 1.8];
const DEND = [[352, 262], [372, 276], [388, 294], [404, 306], [424, 318]].map(SD);
const BR = [[[372, 276], [366, 300], [356, 318]], [[388, 294], [402, 274], [414, 262]], [[404, 306], [394, 326], [386, 338]], [[372, 276], [356, 270], [340, 276]]].map(b => b.map(SD));
const BULBS = [[424, 318], [356, 318], [414, 262], [386, 338], [340, 276]].map(SD);
function fluoresceina(t) {
  L2t = t; K.title('Fluoresceína: qué se tiñe en la córnea', 'Dolor corneal, blefarospasmo y fotofobia: se tiñe antes de tratar', C.BLUE);
  frente(seg(t, 0, 0.7));
  const blue = ease(seg(t, 4.2, 0.9)) * (1 - ease(seg(t, 13.8, 0.8))) + ease(seg(t, 15.4, 0.9)) * (1 - ease(seg(t, 24.2, 0.8)));
  dropper(...F(380, 130), 1.6, '#FFC21A', 120);
  // fluoresceína sobre la lágrima (amarillo suave)
  const yel = fade(t, 3.2, 5.2, 0.8) * 0.25; if (yel > 0) inAperture(() => { ctx.fillStyle = `rgba(255,214,60,${yel})`; ctx.fillRect(FR.x, FR.y, FR.w, FR.h); });
  // 1) dendrítica
  const g1 = seg(t, 5, 3.8);
  outAperture(() => { cobalto(blue);
    if (g1 > 0 && t < 14.6) { const a = 1 - seg(t, 13.8, 0.8); const n = g1 * (DEND.length - 1);
      glowPath(DEND.slice(0, Math.floor(n) + 2).map((p, i, arr) => i === arr.length - 1 && i > 0 ? [lerp(arr[i - 1][0], p[0], n % 1), lerp(arr[i - 1][1], p[1], n % 1)] : p), 5, '#B6FF3A', a);
      BR.forEach((b, k) => { const kk = clamp(g1 * 1.4 - k * 0.25, 0, 1); if (kk > 0) glowPath([b[0], [lerp(b[0][0], b[1][0], kk), lerp(b[0][1], b[1][1], kk)], [lerp(b[0][0], b[2][0], kk), lerp(b[0][1], b[2][1], kk)]], 3.4, '#B6FF3A', a * kk); });
      if (g1 > 0.8) BULBS.forEach(([x, y]) => { const [X, Y] = F(x, y); ctx.save(); ctx.globalAlpha = a * (g1 - 0.8) * 5; ctx.shadowColor = '#B6FF3A'; ctx.shadowBlur = 12; ctx.fillStyle = '#D6FF7A'; ctx.beginPath(); ctx.arc(X, Y, 5, 0, TAU); ctx.fill(); ctx.restore(); }); } });
  label('Úlcera dendrítica: ramas con botones terminales', 330, 640, '#B6FF3A', ...F(...DEND[4]), fade(t, 8.6, 13.6), 15);
  label('Herpes simple: la córnea pierde sensibilidad', 330, 596, C.AMBER, ...F(...DEND[0]), fade(t, 9.6, 13.4), 15);
  // 2) bacteriana
  const g2 = seg(t, 15.4, 2.4), hyp = ease(seg(t, 19, 1.6));
  outAperture(() => { cobalto(blue);
    if (t > 14.6) { ctx.save(); ctx.globalAlpha = g2;
      const [x, y] = F(380, 330); const r = ctx.createRadialGradient(x, y, 0, x, y, 52 * FS);
      r.addColorStop(0, 'rgba(255,252,235,0.95)'); r.addColorStop(0.7, 'rgba(255,238,170,0.6)'); r.addColorStop(1, 'rgba(255,238,170,0)'); ctx.fillStyle = r; ctx.beginPath(); ctx.arc(x, y, 52 * FS, 0, TAU); ctx.fill();
      ctx.shadowColor = '#B6FF3A'; ctx.shadowBlur = 18; ctx.strokeStyle = '#B6FF3A'; ctx.lineWidth = 3.4; ctx.beginPath(); ctx.arc(x, y, 38 * FS, 0, TAU); ctx.stroke(); ctx.restore();
      // hipopión: nivel de pus abajo, dentro del iris
      if (hyp > 0) { ctx.save(); ctx.beginPath(); const [cx, cy] = F(...IC); ctx.arc(cx, cy, (IR - 4) * FS, 0, TAU); ctx.clip();
        const top = cy + (IR - 4) * FS * (1 - 0.34 * hyp); ctx.fillStyle = `rgba(250,244,205,${0.92 * hyp})`; ctx.fillRect(cx - IR * FS, top, 2 * IR * FS, IR * FS); ctx.restore(); } } });
  label('Infiltrado blanco con tinción difusa', 330, 640, '#FFE49A', ...F(380, 330), fade(t, 17.6, 24), 15);
  label('Hipopión: nivel de pus', 330, 596, '#FFF3C4', ...F(380, 360), fade(t, 20.4, 24), 15);
  panel(660, 140, 580, '#B6FF3A', 'Dendrítica: virus herpes simple', ['Aciclovir en pomada al 3 %, 5 veces al día', 'Nunca corticoides: úlcera geográfica'], seg(t, 6, 0.5));
  panel(660, 270, 580, '#FFE49A', 'Bacteriana: lentes de contacto, Pseudomonas', ['Retirar y guardar los lentes para cultivo', 'Antibióticos reforzados, derivar el mismo día', 'Este ojo nunca se ocluye con parche'], seg(t, 17, 0.5));
  K.card(660, 450, 580, 100, C.BLUE, 'Cómo se mira', ['Gota de fluoresceína + luz azul de cobalto', 'Lo que se tiñe es el epitelio que falta'], seg(t, 4.4, 0.5), 17);
  K.banner(660, 600, 580, 'Jamás corticoides en una úlcera corneal', C.RED, seg(t, 22, 0.5));
}

// ---------- 05 · fenilefrina: epiescleritis vs escleritis ----------
function esclera(kind, k, bl) {
  // kind 'epi': cuña salmón temporal (izquierda de la imagen); 'esc': rojo violáceo profundo, más extenso
  const [cx, cy] = F(...IC);
  ctx.save();
  const a0 = kind === 'epi' ? Math.PI * 0.82 : Math.PI * 0.74, a1 = kind === 'epi' ? Math.PI * 1.18 : Math.PI * 1.26;
  const g = ctx.createRadialGradient(cx, cy, (IR + 4) * FS, cx, cy, 300 * FS);
  if (kind === 'epi') { g.addColorStop(0, `rgba(240,110,90,${0.62 * k * (1 - 0.9 * bl)})`); g.addColorStop(1, `rgba(240,120,100,${0.15 * k * (1 - 0.9 * bl)})`); }
  else { g.addColorStop(0, `rgba(130,30,95,${0.78 * k})`); g.addColorStop(1, `rgba(150,50,110,${0.35 * k})`); }
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 330 * FS, a0, a1); ctx.arc(cx, cy, (IR + 3) * FS, a1, a0, true); ctx.closePath(); ctx.fill();
  // vasos finos
  ctx.lineCap = 'round';
  for (let i = 0; i < 16; i++) { const a = lerp(a0, a1, rnd(i + 40)), r0 = 300 * FS, r1 = (IR + 14 + rnd(i + 3) * 16) * FS;
    ctx.strokeStyle = kind === 'epi' ? `rgba(224,60,64,${0.8 * k * (1 - 0.92 * bl)})` : `rgba(120,26,86,${0.55 * k})`; ctx.lineWidth = 1.8 * FS * 1.4;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0 * 0.62); ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1 * 0.62); ctx.stroke(); }
  ctx.restore();
}
function fenilefrina(t) {
  L2t = t; K.title('Prueba de fenilefrina', 'Una gota decide si el rojo es superficial o de la esclera', C.AMBER);
  frente(seg(t, 0, 0.7));
  const epi = fade(t, 1, 11.4), escA = fade(t, 12.4, 23.5, 0.8);
  inAperture(() => { if (epi > 0) esclera('epi', epi, ease(seg(t, 6.6, 2.4))); if (escA > 0) esclera('esc', escA, 0); });
  dropper(...F(250, 215), 4.4, '#CFE8FF'); dropper(...F(250, 215), 15.2, '#CFE8FF');
  label('Epiescleritis: cuña roja salmón', 330, 640, '#F08A72', ...F(190, 290), fade(t, 1.8, 6.4), 15);
  label('Blanquea: el plexo superficial responde', 330, 640, C.GREEN, ...F(190, 290), fade(t, 8.2, 11.6), 15);
  label('Escleritis: rojo oscuro, violáceo', 330, 640, '#C23C8E', ...F(190, 290), fade(t, 13, 18.4), 15);
  label('No blanquea: plexo profundo', 330, 596, C.RED, ...F(180, 300), fade(t, 17.6, 23.4), 15);
  // dolor terebrante
  const dol = fade(t, 14.2, 23.4, 0.8); if (dol > 0) { ctx.save(); ctx.globalAlpha = dol * (0.6 + 0.4 * Math.sin(t * 8)); ctx.strokeStyle = C.RED; ctx.lineWidth = 3; ctx.lineCap = 'round';
    const [x, y] = F(120, 220); for (let i = 0; i < 5; i++) { const a = -0.9 + i * 0.45; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * 18, y + Math.sin(a) * 18); ctx.lineTo(x + Math.cos(a) * 36, y + Math.sin(a) * 36); ctx.stroke(); } ctx.restore(); }
  panel(660, 140, 580, '#F08A72', 'Epiescleritis: benigna', ['Rojo salmón sectorial, molestia leve', 'Blanquea con fenilefrina', 'Se resuelve sola: lágrimas y, si molesta, AINE'], seg(t, 1.4, 0.5));
  panel(660, 300, 580, '#C23C8E', 'Escleritis: amenaza el ojo', ['Dolor terebrante que despierta de noche', 'No blanquea: hay que estudiar una enfermedad sistémica', 'AINE orales o corticoides sistémicos, nunca solo colirios'], seg(t, 13, 0.5));
  K.banner(660, 520, 580, 'Artritis reumatoide: la asociación más frecuente', C.AMBER, seg(t, 19.8, 0.5));
}

// =============== CORTE DEL OJO ===============
const CR = { x: 36, y: 134, w: 0, h: 0 }, CS = 0.44, CX0 = 300, CY0 = 30;
const Cc = (x, y) => [CR.x + (x - CX0) * CS, CR.y + (y - CY0) * CS];
const RET = { c: [950, 660], r: 510 }, MAC = [685, 715], DISC = [500, 660], LENS = { c: [1118, 665], rx: 85, ry: 176 };
function corte(a) {
  const im = I('corte'), w = 1190 * CS, h = 1260 * CS; CR.w = w; CR.h = h;
  ctx.save(); ctx.globalAlpha = a; rrect(CR.x - 6, CR.y - 6, w + 12, h + 12, 18, '#FFFFFF'); ctx.beginPath(); ctx.roundRect(CR.x, CR.y, w, h, 14); ctx.clip();
  ctx.drawImage(im, CX0, CY0, 1190, 1260, CR.x, CR.y, w, h); ctx.restore();
}
function rayosEnfoque(k, scatter, focus, a = 1, spread = 90) {
  // haces paralelos desde la derecha, convergen en `focus` (px de la imagen)
  ctx.save(); ctx.globalAlpha = a; ctx.lineCap = 'round';
  const N = 7;
  for (let i = 0; i < N; i++) { const y = 665 + (i - (N - 1) / 2) * 24;
    const xs = lerp(1500, lerp(1500, focus[0] + 0, 1), 0) , x0 = 1500, x1 = 1210;
    const p0 = Cc(x0 - (1 - k) * 0, y), p1 = Cc(x1, y), pL = Cc(1035, y * 0.86 + focus[1] * 0.14);
    const endX = lerp(1035, focus[0], k), endY = lerp(pL[1], Cc(0, focus[1])[1], k);
    ctx.strokeStyle = 'rgba(255,214,30,0.9)'; ctx.lineWidth = 3;
    ctx.shadowColor = 'rgba(255,214,30,0.9)'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.moveTo(...p0); ctx.lineTo(...p1); ctx.lineTo(...pL);
    if (scatter > 0) { const sy = (rnd(i + 3) - 0.5) * 2 * spread * scatter, ex = Cc(focus[0] + 40 * (rnd(i) - 0.5), 0)[0];

// ---------- 10 · desprendimiento de retina ----------

  label('Desgarro en herradura', 300, 600, C.AMBER, ...Cc(...ang(th0 + 0.02)), fade(t, 5.4, 10.4), 15);
  label('Líquido entra bajo la retina', 330, 640, '#F5DCA0', ...Cc(...ang(-140 * D2R)), fade(t, 9.6, 15.6), 15);
