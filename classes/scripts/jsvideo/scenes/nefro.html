<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0E1116;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="../lib.js"></script><script src="../kit.js"></script>
<script>
// Nefrología sobre ilustraciones reales (Servier Medical Art, CC BY 4.0).
// ?v=podocito (nefro-13) ?v=hipona_aguda|hipona_cronica|hipona_rapida (nefro-05) ?v=ntа (nefro-02) ?v=hepatorrenal (nefro-04)
// ?v=siadh (nefro-06) ?v=vomito (nefro-12) ?v=semiluna (nefro-16) ?v=pielo (nefro-21) ?v=glomerulopatias (nefro-14) ?v=lupus (nefro-17)
// ?v=dialisis (nefro-03) ?v=hiperk (nefro-09, gráfico) ?v=ecg (nefro-10, gráfico) ?v=gnpe (nefro-15) ?v=erc (nefro-18) ?v=epo (nefro-19) ?v=renal (nefro-20) ?v=farm (nefro-22, gráfico)
const V = new URLSearchParams(location.search).get('v') || 'podocito';
const DUR = { dialisis: 26, hiperk: 24, ecg: 24, gnpe: 24, erc: 24, epo: 24, renal: 24, farm: 24 };
window.SCENE = { duration: DUR[V] || 21, fps: 30 };
const L = LIB(document.getElementById('c')), { ctx, C, ease, clamp, lerp, text, tag, rrect, poly } = L;
const K = KIT(L), { seg, fade, rnd } = K;
const I = k => window.IMGS[k];
function draw(k, x, y, w, a = 1, rot = 0, filter) { const im = I(k), h = w * im.height / im.width; ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.rotate(rot); if (filter) ctx.filter = filter; ctx.drawImage(im, -w / 2, -h / 2, w, h); ctx.restore(); }
function flow(P, n, t, col, sp = 0.35, sz = 6, shape = 'dot', a0 = 1) { for (let i = 0; i < n; i++) { const u = ((t * sp) + i / Math.max(1, n)) % 1, [x, y] = P.at(u);
  ctx.globalAlpha = a0 * Math.min(1, u * 8, (1 - u) * 8); ctx.fillStyle = col; if (shape === 'sq') ctx.fillRect(x - sz, y - sz, 2 * sz, 2 * sz); else { ctx.beginPath(); ctx.arc(x, y, sz, 0, 7); ctx.fill(); } } ctx.globalAlpha = 1; }
function cnt(t, x, y, w, rows, t0 = 1.2) { ctx.globalAlpha = seg(t, t0, 0.5); rrect(x, y, w, 40 + rows.length * 62, 16, '#161B22');
  rows.forEach(([lab, val, max, unit, col, fmt, marks], i) => K.bar(x + 24, y + 42 + i * 62, w - 48, lab, val, max, unit, col, marks || [], fmt)); ctx.globalAlpha = 1; }
const f1 = v => v.toFixed(1).replace('.', ',');

// glomérulo ampliado (recorte de la nefrona)
const GZ = 2.4, GOX = 50, GOY = 150, GX0 = 20, GY0 = 60, G = (x, y) => [GOX + (x - GX0) * GZ, GOY + (y - GY0) * GZ];
function glom(t, a = 1, filter) { ctx.save(); ctx.globalAlpha = a; ctx.beginPath(); ctx.roundRect(GOX, GOY, 220 * GZ, 220 * GZ, 20); ctx.clip(); if (filter) ctx.filter = filter;
  ctx.drawImage(I('nef'), GX0, GY0, 220, 220, GOX, GOY, 220 * GZ, 220 * GZ); ctx.restore(); }
const GLO = G(140, 152), URI = poly([[146, 150], [160, 128], [168, 108], [170, 88], [172, 62]].map(p => G(...p)));

function podocito(t) {
  K.title('Síndrome nefrótico: la barrera se abre', 'Se dañan los pies de los podocitos', C.AMBER);
  glom(t, seg(t, 0, 0.7));
  const dmg = ease(seg(t, 3, 2));
  for (let i = 0; i < 14; i++) { const a = -2.6 + i * 0.37, r = 78; const x = GLO[0] + Math.cos(a) * r, y = GLO[1] + Math.sin(a) * r * 0.9;
    ctx.strokeStyle = dmg > 0.5 ? '#8A6A5A' : '#F2CF9B'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * (14 - 8 * dmg), y + Math.sin(a) * (14 - 8 * dmg)); ctx.stroke(); }
  ctx.globalAlpha = fade(t, 1, 5); tag('Podocitos: el filtro de la albúmina', GLO[0], GLO[1] - 140, '#F2CF9B', 15); ctx.globalAlpha = 1;
  ctx.globalAlpha = seg(t, 3.5, 0.5); tag('Pedicelos borrados', GLO[0], GLO[1] - 140, C.RED, 15); ctx.globalAlpha = 1;
  flow(URI, Math.round(14 * dmg), t, '#F2CF5B', 0.35, 8);
  const e = ease(seg(t, 4, 7));
  cnt(t, 640, 150, 600, [['Proteinuria', lerp(0.1, 6, e), 8, 'g/día', C.RED, f1, [[3.5, '3,5']]], ['Albúmina', lerp(4.2, 2.1, e), 5, 'g/dL', C.AMBER, f1], ['Colesterol', lerp(180, 360, e), 400, 'mg/dL', C.VIOLET]]);
  K.card(640, 390, 600, 150, C.AMBER, 'Edema', ['Parte en los párpados en la mañana', 'y baja a las piernas en el día'], seg(t, 12, 0.5), 17);
  K.banner(640, 560, 600, 'Más de 3,5 g al día: rango nefrótico', C.RED, seg(t, 16, 0.5));
}

function hipona(t, mode) {
  const T = { aguda: ['Hiponatremia aguda: el cerebro se hincha', 'El agua entra a la neurona'], cronica: ['Hiponatremia crónica: la neurona se adapta', 'Más de 48 horas: expulsa osmolitos'], rapida: ['Corregir muy rápido: desmielinización', 'El agua sale de golpe'] }[mode];
  K.title(T[0], T[1], mode === 'cronica' ? C.BLUE : C.RED);
  const cx = 300, cy = 420;
  let sc = 1;
  if (mode === 'aguda') sc = 1 + 0.25 * ease(seg(t, 3, 5));
  if (mode === 'cronica') sc = 1 + 0.25 * ease(seg(t, 2, 3)) - 0.25 * ease(seg(t, 7, 5));
  if (mode === 'rapida') sc = 1 - 0.18 * ease(seg(t, 5, 3));
  ctx.save(); ctx.globalAlpha = seg(t, 0, 0.6); ctx.strokeStyle = '#B9C2CC'; ctx.lineWidth = 10; ctx.beginPath(); ctx.ellipse(cx, cy, 250, 245, 0, 0, 7); ctx.stroke(); ctx.restore();
  ctx.globalAlpha = seg(t, 0.5, 0.5); tag('Cráneo: no se expande', cx, cy - 265, '#B9C2CC', 14); ctx.globalAlpha = 1;
  const im = I('neu'), w = 230 * sc, h = w * im.height / im.width;
  ctx.save(); ctx.globalAlpha = seg(t, 0, 0.6); ctx.beginPath(); ctx.ellipse(cx, cy, 245, 240, 0, 0, 7); ctx.clip();
  const dem = mode === 'rapida' ? ease(seg(t, 8, 4)) : 0; if (dem) ctx.filter = `saturate(${1 - 0.7 * dem})`;
  ctx.drawImage(im, cx - w / 2, cy - h * 0.25, w, h); ctx.restore();
  if (dem > 0) { for (let i = 0; i < 6; i++) { ctx.globalAlpha = dem; ctx.fillStyle = C.RED; ctx.beginPath(); ctx.arc(cx + 2, cy + 110 + i * 26, 6, 0, 7); ctx.fill(); } ctx.globalAlpha = dem; tag('Mielina dañada', cx + 120, cy + 180, C.RED, 14); ctx.globalAlpha = 1; }
  // agua y osmolitos
  const inF = mode === 'aguda' ? seg(t, 2.5, 0.5) * (1 - seg(t, 12, 1)) : mode === 'cronica' ? fade(t, 1.5, 6) : 0;
  const outF = mode === 'rapida' ? fade(t, 4.5, 11) : 0;
  for (let i = 0; i < 12; i++) { const a = i * 0.52, u = ((t * 0.55) + i / 12) % 1;
    if (inF > 0) { const r = lerp(230, 70, u); drawDrop(cx + Math.cos(a) * r, cy + Math.sin(a) * r, inF * Math.min(1, u * 4)); }
    if (outF > 0) { const r = lerp(70, 230, u); drawDrop(cx + Math.cos(a) * r, cy + Math.sin(a) * r, outF * Math.min(1, (1 - u) * 4)); } }
  if (mode === 'cronica') for (let i = 0; i < 8; i++) { const u = clamp((t - 6.5 - i * 0.3) / 2, 0, 1); if (u <= 0) continue; const a = i * 0.8;
    ctx.globalAlpha = 1 - seg(u, 0.8, 0.2); ctx.fillStyle = '#F2CF5B'; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * lerp(40, 220, u), cy - 60 + Math.sin(a) * lerp(40, 200, u), 7, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  const na = mode === 'aguda' ? lerp(140, 118, ease(seg(t, 1, 3))) : mode === 'cronica' ? 118 : lerp(112, 126, ease(seg(t, 4, 5)));
  cnt(t, 640, 150, 600, [['Sodio', na, 150, 'mEq/L', na < 125 ? C.RED : na < 135 ? C.AMBER : C.GREEN, null, [[135, '135']]]]);
  if (mode === 'aguda') { K.card(640, 270, 600, 150, C.RED, 'Edema cerebral', ['Cefalea, vómitos, convulsiones, coma', 'Urgencia: salino hipertónico al 3 %'], seg(t, 7, 0.5), 17); }
  if (mode === 'cronica') { K.card(640, 270, 600, 150, C.BLUE, 'Más de 48 horas', ['La neurona expulsa osmolitos', 'y recupera su tamaño: pocos síntomas'], seg(t, 7.5, 0.5), 17); }
  if (mode === 'rapida') { K.card(640, 270, 600, 150, C.RED, 'Síndrome de desmielinización osmótica', ['El plasma se vuelve hipertónico de golpe', 'y daña la mielina de los oligodendrocitos'], seg(t, 9, 0.5), 17);
    rrect(640, 440, 600, 80, 16, '#161B22'); ctx.globalAlpha = seg(t, 5, 0.5); text(`Subió ${Math.round(na - 112)} mEq/L en 24 horas`, 664, 490, 22, na - 112 > 10 ? C.RED : C.AMBER, 'bold'); ctx.globalAlpha = 1; }
  K.banner(640, 560, 600, 'Máximo: 8 a 10 mEq/L en 24 horas', C.AMBER, seg(t, 15.5, 0.5));
}
function drawDrop(x, y, a) { ctx.globalAlpha = a; ctx.fillStyle = C.BLUE; ctx.beginPath(); ctx.moveTo(x, y - 9); ctx.quadraticCurveTo(x + 7, y + 2, x, y + 6); ctx.quadraticCurveTo(x - 7, y + 2, x, y - 9); ctx.fill(); ctx.globalAlpha = 1; }

// túbulo real de la nefrona
const NF = { x: 60, y: 150, s: 0.8 }, N = (x, y) => [NF.x + x * NF.s, NF.y + y * NF.s];
const TUB = poly([[150, 130], [175, 95], [185, 45], [205, 22], [235, 25], [262, 15], [290, 12], [320, 25], [322, 70], [302, 105], [305, 150], [310, 220], [312, 300], [313, 450], [315, 600], [330, 622], [345, 600], [345, 450],
  [345, 330], [352, 240], [370, 190], [392, 120], [400, 60], [415, 22], [445, 25], [460, 70], [440, 130], [450, 200], [458, 300], [480, 380], [515, 410], [522, 500], [522, 650], [522, 800]].map(p => N(...p)));
function nta(t) {
  K.title('Necrosis tubular aguda: el túbulo se descama', 'Isquemia o tóxicos matan el epitelio', C.AMBER);
  draw('nefz', NF.x + 285 * NF.s, NF.y + 412 * NF.s, 570 * NF.s, seg(t, 0, 0.7));
  const dead = ease(seg(t, 3, 3));
  // células que se desprenden y forman cilindros
  for (let i = 0; i < 26; i++) { const born = 3.5 + i * 0.3; if (t < born) continue; const u = Math.min(0.97, (t - born) * 0.07 + 0.08 * rnd(i)); const [x, y] = TUB.at(u);
    ctx.fillStyle = '#8B5A2B'; ctx.save(); ctx.translate(x, y); ctx.rotate(rnd(i) * 3); ctx.fillRect(-7, -4, 14, 8); ctx.restore(); }
  ctx.globalAlpha = fade(t, 1, 5); tag('Túbulo proximal: el más sensible', ...N(250, -20), C.BLUE, 15); ctx.globalAlpha = 1;
  ctx.globalAlpha = seg(t, 4, 0.5); tag('Células muertas → cilindros granulosos pardos', ...N(440, 700), '#8B5A2B', 15); ctx.globalAlpha = 1;
  cnt(t, 640, 150, 600, [['Creatinina', lerp(0.9, 4.2, ease(seg(t, 3, 6))), 6, 'mg/dL', C.RED, f1], ['FeNa', lerp(0.5, 3.5, dead), 5, '%', C.AMBER, f1, [[2, '2']]], ['Sodio urinario', lerp(15, 60, dead), 80, 'mEq/L', C.AMBER, null, [[40, '40']]]]);
  K.card(640, 390, 600, 150, C.AMBER, 'El túbulo no concentra ni retiene sodio', ['Orina isostenúrica', 'Prerrenal: FeNa bajo 1 % y sedimento limpio'], seg(t, 9, 0.5), 17);
  K.banner(640, 560, 600, 'Causas: shock, sepsis, aminoglicósidos, contraste', C.RED, seg(t, 14, 0.5));
}

function hepatorrenal(t) {
  K.title('Síndrome hepatorrenal: el riñón sano que se cierra', 'Vasodilatación esplácnica en la cirrosis', C.AMBER);
  draw('cirr', 230, 280, 340, seg(t, 0, 0.6)); draw('int', 230, 520, 230, seg(t, 0.3, 0.6));
  draw('rin2', 560, 470, 220, seg(t, 0.6, 0.6), 0, `saturate(${1 - 0.5 * ease(seg(t, 8, 3))}) brightness(${1 - 0.2 * ease(seg(t, 8, 3))})`);
  ctx.globalAlpha = seg(t, 0.8, 0.5); tag('Hígado cirrótico', 230, 165, '#8E3A2A', 15); tag('Riñones sanos', 560, 360, '#C0607A', 15); ctx.globalAlpha = 1;
  const vd = ease(seg(t, 3, 3)); K.glow(230, 520, 160, '255,90,78', 0.45 * vd * (0.8 + 0.2 * Math.sin(t * 3)));
  ctx.globalAlpha = seg(t, 3.5, 0.5); tag('Óxido nítrico: vasodilatación esplácnica', 230, 650, C.RED, 14); ctx.globalAlpha = 1;
  // flujo renal que cae
  const vc = ease(seg(t, 8, 3)); flow(poly([[400, 470], [480, 470], [560, 470]]), Math.round(lerp(8, 2, vc)), t, '#B3122E', 0.4, 6);
  if (vc > 0) { ctx.globalAlpha = vc; tag('Vasoconstricción renal', 560, 590, C.RED, 14); ctx.globalAlpha = 1; }
  cnt(t, 760, 150, 480, [['Presión arterial media', lerp(85, 62, vd), 110, 'mmHg', vd > 0.5 ? C.RED : C.GREEN], ['Creatinina', lerp(1, 2.8, ease(seg(t, 9, 5))), 4, 'mg/dL', C.RED, f1], ['Sodio urinario', lerp(30, 5, vc), 50, 'mEq/L', C.BLUE]]);
  K.card(760, 390, 480, 150, C.BLUE, 'Funciona como prerrenal', ['Sodio urinario muy bajo, sedimento normal', 'El túbulo está sano: retiene sodio'], seg(t, 12, 0.5), 17);
  K.banner(760, 560, 480, 'Terlipresina + albúmina', C.GREEN, seg(t, 16, 0.5));
}

function siadh(t) {
  K.title('Hiponatremia: ¿cuánto volumen y qué orina?', 'SIADH, perdedor de sal y polidipsia', C.BLUE);
  const cols = [['SIADH', 'Euvolémico', 'Orina concentrada: sobre 100', 'Sodio urinario sobre 40', C.BLUE, 'Restringir agua'],
                ['Perdedor de sal', 'Hipovolémico', 'Orina concentrada', 'Sodio urinario alto', C.AMBER, 'Volumen y sal'],
                ['Polidipsia', 'Euvolémico', 'Orina diluida: bajo 100', 'Bebe más de lo que bota', C.GREEN, 'Dejar de beber']];
  cols.forEach(([n, vol, o1, o2, col, tto], i) => { const a = seg(t, 1 + i * 4, 0.6); if (a <= 0) return; const x = 40 + i * 410; ctx.globalAlpha = a;
    rrect(x, 150, 390, 480, 18, '#161B22'); ctx.fillStyle = col; ctx.fillRect(x, 150, 390, 6); text(n, x + 195, 196, 24, col, 'bold', 'center');
    draw('vias', x + 195, 330, 120, a);
    const lvl = vol === 'Hipovolémico' ? 0.35 : 0.7; rrect(x + 40, 440, 310, 16, 8, '#222833'); rrect(x + 40, 440, 310 * lvl, 16, 8, vol === 'Hipovolémico' ? C.RED : C.GREEN);
    text(vol, x + 195, 480, 18, C.INK, 'bold', 'center'); text(o1, x + 195, 520, 17, C.INK, '', 'center'); text(o2, x + 195, 550, 17, C.INK, '', 'center');
    rrect(x + 70, 580, 250, 36, 18, '#1C232D'); text(tto, x + 195, 604, 16, col, 'bold', 'center'); ctx.globalAlpha = 1; });
  K.banner(40, 650, 1200, 'Hemorragia subaracnoidea con sodio bajo: mira la volemia', C.AMBER, seg(t, 15.5, 0.5));
}

function vomito(t) {
  K.title('Alcalosis metabólica por vómitos', 'Se pierde ácido, cloro y volumen; el riñón la mantiene', C.VIOLET);
  draw('est', 220, 380, 300, seg(t, 0, 0.6));
  ctx.globalAlpha = seg(t, 0.6, 0.5); tag('Estómago', 300, 560, '#E7A0B5', 15); ctx.globalAlpha = 1;
  for (let i = 0; i < 10; i++) { const u = ((t * 0.5) + i / 10) % 1; if (t < 2) break; const x = lerp(150, 90, u) + Math.sin(i * 1.3) * 14 * u, y = lerp(250, 150, u);
    ctx.globalAlpha = Math.min(1, (1 - u) * 4); ctx.fillStyle = i % 2 ? '#F2CF5B' : '#E86A5A'; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill();
    text(i % 2 ? 'Cl⁻' : 'H⁺', x + 10, y - 6, 11, C.INK, 'bold'); }
  ctx.globalAlpha = 1;
  draw('rin2', 520, 520, 200, seg(t, 6, 0.6));
  ctx.globalAlpha = seg(t, 6.3, 0.5); tag('Con poco volumen y cloro, el riñón no bota el bicarbonato', 520, 650, C.VIOLET, 14); ctx.globalAlpha = 1;
  const e = ease(seg(t, 2, 6));
  cnt(t, 760, 150, 480, [['pH', lerp(7.4, 7.52, e), 7.7, '', C.VIOLET, v => v.toFixed(2).replace('.', ',')], ['Bicarbonato', lerp(24, 36, e), 45, 'mEq/L', C.VIOLET], ['Cloro', lerp(102, 88, e), 110, 'mEq/L', C.AMBER], ['Potasio', lerp(4.2, 2.9, ease(seg(t, 6, 5))), 6, 'mEq/L', C.RED, f1]]);
  K.card(760, 460, 480, 130, C.GREEN, 'Cloro urinario bajo 20', ['Sensible al cloro: suero fisiológico y potasio'], seg(t, 12, 0.5), 17);
  K.banner(760, 610, 480, 'El pulmón compensa reteniendo CO2', C.BLUE, seg(t, 16, 0.5));
}

function semiluna(t) {
  K.title('Glomerulonefritis rápidamente progresiva', 'Semilunas que asfixian al ovillo', C.RED);
  glom(t, seg(t, 0, 0.7));
  const gr = ease(seg(t, 3, 6));
  ctx.save(); ctx.globalAlpha = 0.85; ctx.fillStyle = '#E8DCC8'; ctx.beginPath();
  const R1 = 105, R2 = 105 - 55 * gr; ctx.arc(GLO[0], GLO[1], R1, -2.4, -2.4 + 4.2 * Math.max(0.15, gr)); ctx.arc(GLO[0], GLO[1], R2, -2.4 + 4.2 * Math.max(0.15, gr), -2.4, true); ctx.fill();
  ctx.strokeStyle = '#9A8A70'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  ctx.globalAlpha = seg(t, 3.5, 0.5); tag('Semiluna: células parietales que proliferan', GLO[0], GLO[1] - 170, '#E8DCC8', 14); ctx.globalAlpha = 1;
  flow(URI, Math.round(10 * seg(t, 2, 1)), t, '#C0122E', 0.4, 6);
  cnt(t, 640, 150, 600, [['Creatinina', lerp(1, 5, ease(seg(t, 3, 8))), 6, 'mg/dL', C.RED, f1]]);
  const IF = [['Lineal', 'Anti membrana basal (Goodpasture)', 'Tipo 1'], ['Granular', 'Inmunocomplejos, C3 bajo', 'Tipo 2'], ['Escasa: pauciinmune', 'ANCA: la más frecuente', 'Tipo 3']];
  IF.forEach(([a, b, c], i) => { const al = seg(t, 9 + i * 1.5, 0.5); if (al <= 0) return; ctx.globalAlpha = al; rrect(640, 280 + i * 92, 600, 80, 14, '#161B22');
    ctx.fillStyle = C.VIOLET; ctx.fillRect(640, 280 + i * 92, 6, 80); text(`${c} · ${a}`, 664, 312 + i * 92, 20, C.VIOLET, 'bold'); text(b, 664, 342 + i * 92, 17, C.INK); ctx.globalAlpha = 1; });
  K.banner(640, 580, 600, 'Urgencia: biopsia y tratamiento inmediato', C.RED, seg(t, 15.5, 0.5));
}

function pielo(t) {
  K.title('Pielonefritis: la infección sube', 'De la vejiga al riñón', C.AMBER);
  const S = 0.48, VX = 180, VY = 145, P = (x, y) => [VX + x * S, VY + y * S];
  draw('vias', VX + 795 * S / 2, VY + 1356 * S / 2, 795 * S, seg(t, 0, 0.6));
  const UP = poly([P(395, 1050), P(530, 900), P(545, 700), P(545, 500), P(560, 330), P(620, 200)]);
  const k = seg(t, 5, 6);
  for (let i = 0; i < 14; i++) { const base = rnd(i) * 0.2, u = i < 6 ? base : Math.min(base + k * 1.0, 1); if (u < 0 || (i >= 6 && k <= 0)) { }
    const [x, y] = i < 6 ? P(330 + rnd(i + 3) * 140, 1080 + rnd(i + 7) * 90) : UP.at(Math.min(1, k * (0.7 + 0.3 * rnd(i))));
    if (i >= 6 && k <= 0) continue; ctx.save(); ctx.translate(x, y); ctx.rotate(rnd(i) * 3); ctx.fillStyle = '#5FBF5F'; ctx.beginPath(); ctx.ellipse(0, 0, 8, 4, 0, 0, 7); ctx.fill(); ctx.restore(); }
  ctx.globalAlpha = seg(t, 1.5, 0.5); tag('E. coli: 75 a 85 %', ...P(395, 1250), '#5FBF5F', 14); ctx.globalAlpha = 1;
  ctx.globalAlpha = fade(t, 2, 6); tag('Cistitis: disuria, sin fiebre', ...P(130, 1000), C.BLUE, 14); ctx.globalAlpha = 1;
  const inf = seg(t, 10, 1.5); if (inf > 0) { K.glow(...P(640, 200), 120, '255,90,78', 0.55 * inf * (0.8 + 0.2 * Math.sin(t * 4))); ctx.globalAlpha = inf; tag('Pielonefritis: el parénquima', ...P(640, 30), C.RED, 14); ctx.globalAlpha = 1; }
  K.card(640, 150, 600, 160, C.RED, 'Tríada', ['Fiebre alta con calofríos', 'Dolor lumbar · puñopercusión positiva', 'Síntomas urinarios'], seg(t, 11, 0.5), 17);
  K.card(640, 330, 600, 120, C.AMBER, 'Urocultivo antes del antibiótico', ['Y hemocultivos si se hospitaliza'], seg(t, 14, 0.5), 17);
  K.banner(640, 480, 600, 'Sin fiebre es cistitis; con fiebre, pielonefritis', C.BLUE, seg(t, 17, 0.5));
}

function glomerulopatias(t) {
  K.title('Tres glomerulopatías del nefrótico del adulto', 'Lo que muestra la biopsia', C.VIOLET);
  const items = [['Membranosa', 'Membrana basal engrosada con espículas', 'Depósitos subepiteliales · mayor de 50', C.VIOLET, 'm'],
                 ['Cambios mínimos', 'Microscopía de luz normal', 'Solo la electrónica: pedicelos borrados', C.GREEN, 'c'],

// nefro-10 · ECG de la hipokalemia (sin anatomía): T plana, ST infra, onda U, QU y torsades
function ecgV(tt, kst) {
  // kst: 0 normal → 1 T plana → 2 ST infra + U → 3 U > T (QU)
  const T = tt % 0.85, g = (x, m, w) => Math.exp(-(((x - m) / w) ** 2));
  const f1 = clamp(kst, 0, 1), f2 = clamp(kst - 1, 0, 1), f3 = clamp(kst - 2, 0, 1);
  const tA = lerp(0.38, -0.05, f1) - 0.10 * f2, st = -0.16 * f2 * (T > 0.23 && T < 0.34 ? 1 : T >= 0.34 && T < 0.44 ? 1 - (T - 0.34) / 0.10 : 0);
  const uA = 0.45 * f2 + 0.25 * f3;
  return 0.11 * g(T, 0.10, 0.025) - 0.12 * g(T, 0.188, 0.008) + 1.0 * g(T, 0.20, 0.011) - 0.22 * g(T, 0.214, 0.009) + st + tA * g(T, 0.38 + 0.02 * f2, 0.055) + uA * g(T, 0.53 + 0.04 * f3, 0.045);
}
function ecg(t) {
  K.title('Hipokalemia: lo que cambia en el ECG', 'La repolarización se alarga y aparece la onda U', C.BLUE);
  const kst = clamp((t - 2.5) / 3, 0, 1) + clamp((t - 8) / 3, 0, 1) + clamp((t - 13) / 3, 0, 1);   // 0..3
  const ar = seg(t, 18.5, 0.6);                                                                // arritmia
  const kv = lerp(4.2, 3.4, clamp(kst, 0, 1)) - 0.5 * clamp(kst - 1, 0, 1) - 0.5 * clamp(kst - 2, 0, 1) - 0.4 * ar;
  // tira de ECG
  const X0 = 40, XW = 780, YB = 410, AM = 150, win = 5;
  rrect(X0 - 10, 150, XW + 20, 400, 16, '#0A0D12');
  ctx.strokeStyle = '#1B2230'; ctx.lineWidth = 1; for (let x = X0; x <= X0 + XW; x += 26) { ctx.beginPath(); ctx.moveTo(x, 160); ctx.lineTo(x, 540); ctx.stroke(); } for (let y = 160; y <= 540; y += 26) { ctx.beginPath(); ctx.moveTo(X0, y); ctx.lineTo(X0 + XW, y); ctx.stroke(); }
  ctx.save(); ctx.beginPath(); ctx.rect(X0, 156, XW, 388); ctx.clip(); ctx.strokeStyle = ar > 0.5 ? C.RED : C.GREEN; ctx.lineWidth = 3; ctx.beginPath();
  const t0 = Math.max(0, t - win);
  for (let px = 0; px <= XW; px += 2) { const tt = t - win + (px / XW) * win; if (tt < 0) continue; const kk = clamp((tt - 2.5) / 3, 0, 1) + clamp((tt - 8) / 3, 0, 1) + clamp((tt - 13) / 3, 0, 1);

    if (tt > 18.6) { const q = tt - 18.6; v = lerp(v, 0.9 * Math.sin(2 * Math.PI * 3.2 * q) * (0.35 + 0.65 * Math.abs(Math.sin(2 * Math.PI * 0.45 * q))), clamp(q / 0.5, 0, 1)); }
    const y = YB - v * AM; (px === 0 || tt - 2 / XW * win < 0) ? ctx.moveTo(X0 + px, y) : ctx.lineTo(X0 + px, y); }
  ctx.stroke(); ctx.restore();
  // etiquetas flotantes
  const tg = (a, s, x, y, col) => { ctx.globalAlpha = a; tag(s, x, y, col, 15); ctx.globalAlpha = 1; };
  tg(fade(t, 0.5, 6), 'ECG normal', 150, 190, C.GREEN);
  tg(fade(t, 5.5, 11), 'T aplanada o invertida', 330, 190, C.AMBER);
  tg(fade(t, 10.5, 16), 'ST infradesnivel + onda U', 400, 190, C.AMBER);
  tg(fade(t, 15.5, 19.5), 'QT aparente largo: es un QU', 440, 190, C.RED);
  tg(seg(t, 19, 0.5), 'Taquicardia ventricular polimorfa: torsades', 460, 190, C.RED);
  // medidor de potasio
  cnt(t, 860, 150, 380, [['Potasio', kv, 5, 'mEq/L', kv < 2 ? C.RED : kv < 3.5 ? C.AMBER : C.GREEN, f1, [[3.5, '3,5'], [2, '2,0']]]], 0.5);
  K.card(860, 270, 380, 150, C.BLUE, 'La señal del examen', ['Onda U tras la T, mejor en V2 a V4', 'Mide el intervalo QU, no el QT'], seg(t, 11, 0.5), 17);
  K.card(860, 440, 380, 110, C.RED, 'Con digoxina', ['Mantener el potasio sobre 4,0'], seg(t, 20, 0.5), 17);

// nefro-18 · enfermedad renal crónica: pérdida de nefronas, hiperfiltración y el IECA/ARA-II
function erc(t) {
  K.title('Enfermedad renal crónica: se pierden nefronas', 'Las que sobreviven hiperfiltran y se dañan más', C.AMBER);
  const N = 20, order = [3, 14, 8, 17, 1, 11, 6, 19, 13, 4, 9, 16, 0, 12, 7, 18, 2, 10, 5];     // se pierden 19 de 20; queda 1
  const dead = clamp(Math.floor(ease(seg(t, 2, 11)) * order.length + 0.001), 0, order.length);
  const gone = new Set(order.slice(0, dead));
  const alive = N - gone.size, tfg = Math.round(112 * alive / N);
  const treat = ease(seg(t, 15, 3));
  for (let j = 0; j < N; j++) { const x = 40 + (j % 5) * 120, y = 150 + Math.floor(j / 5) * 120, cx = x + 52, cy = y + 52;
    const a = seg(t, 0.2 + j * 0.04, 0.4), d = gone.has(j);
    ctx.save(); ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(cx, cy, 50, 0, 7); ctx.clip(); if (d) ctx.filter = 'grayscale(1) brightness(0.45)'; ctx.drawImage(I('nef'), 90, 100, 120, 110, x, y, 104, 104); ctx.restore();
    if (d) { ctx.globalAlpha = a; ctx.strokeStyle = '#6B7380'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cx - 20, cy - 20); ctx.lineTo(cx + 20, cy + 20); ctx.moveTo(cx + 20, cy - 20); ctx.lineTo(cx - 20, cy + 20); ctx.stroke(); }
    else if (dead > 4) { const pulse = 0.55 + 0.25 * Math.sin(t * 5 + j); ctx.globalAlpha = a * (1 - treat) * pulse; ctx.strokeStyle = C.RED; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(cx, cy, 53, 0, 7); ctx.stroke();
      ctx.globalAlpha = a * treat; ctx.strokeStyle = C.GREEN; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, 53, 0, 7); ctx.stroke(); }
    ctx.globalAlpha = 1; }
  ctx.globalAlpha = seg(t, 6, 0.5) * (1 - seg(t, 15, 0.4)); tag('Las que quedan hiperfiltran', 340, 640, C.RED, 15); ctx.globalAlpha = 1;
  ctx.globalAlpha = seg(t, 18, 0.5); tag('IECA o ARA-II: baja la presión dentro del glomérulo', 340, 640, C.GREEN, 15); ctx.globalAlpha = 1;
  // TFG y etapas
  rrect(700, 150, 540, 150, 16, '#161B22'); text('Tasa de filtración glomerular', 724, 186, 19, C.INK, 'bold');
  const col = tfg >= 60 ? C.GREEN : tfg >= 30 ? C.AMBER : C.RED;
  text(String(tfg), 724, 270, 78, col, 'bold'); text('mL/min/1,73 m²', 724 + 11 + String(tfg).length * 44, 270, 20, C.MUTED);
  const ST = [['G1', 90], ['G2', 60], ['G3a', 45], ['G3b', 30], ['G4', 15], ['G5', 0]], cur = tfg >= 90 ? 0 : tfg >= 60 ? 1 : tfg >= 45 ? 2 : tfg >= 30 ? 3 : tfg >= 15 ? 4 : 5;
  ST.forEach(([g, lim], i) => { const x = 700 + i * 90; rrect(x, 320, 84, 52, 10, i === cur ? (i < 2 ? C.GREEN : i < 4 ? C.AMBER : C.RED) : '#1B2230'); text(g, x + 42, 344, 18, i === cur ? C.BG : C.INK, 'bold', 'center'); text(i === 0 ? '≥ 90' : i === 5 ? '< 15' : `${lim}–${ST[i - 1][1] - 1}`, x + 42, 364, 13, i === cur ? C.BG : C.MUTED, '', 'center'); });
  const alb = lerp(1, 0.25, treat) * (0.15 + 0.85 * clamp(dead / 12, 0, 1));
  cnt(t, 700, 395, 540, [['Albuminuria', 30 + 270 * alb, 400, 'mg/g', alb > 0.4 ? C.RED : C.GREEN, null, [[30, '30'], [300, '300']]]], 5);
  K.card(700, 512, 540, 116, C.BLUE, 'Etapas por filtración y albuminuria', ['A2 o A3: IECA o ARA-II, aunque la presión sea normal', 'La creatinina puede subir hasta 30 %: se mantiene'], seg(t, 18.5, 0.5), 16);
  K.banner(700, 648, 540, 'Filtración bajo 30: GES y fístula 6 meses antes', C.AMBER, seg(t, 21.5, 0.5));
}

// nefro-19 · el riñón deja de fabricar eritropoyetina y calcitriol (Servier: riñones, médula ósea, hematíe)
function epo(t) {
  K.title('ERC: lo que el riñón deja de fabricar', 'Eritropoyetina, calcitriol y bicarbonato', C.VIOLET);
  const fail = ease(seg(t, 3, 5));                                   // pérdida de función renal
  ctx.globalAlpha = seg(t, 0, 0.6); rrect(30, 170, 590, 340, 16, '#FFFFFF'); ctx.globalAlpha = 1;
  draw('rin2', 325, 340, 560, seg(t, 0, 0.6), 0, `saturate(${1 - 0.65 * fail}) brightness(${1 - 0.25 * fail})`);
  ctx.globalAlpha = seg(t, 0.6, 0.5); tag('Riñones', 325, 532, '#C0607A', 15); ctx.globalAlpha = 1;
  ctx.save(); ctx.globalAlpha = seg(t, 0.3, 0.6); rrect(655, 150, 150, 380, 16, '#FFFFFF'); ctx.restore(); draw('hue', 730, 340, 118, seg(t, 0.3, 0.6));
  ctx.globalAlpha = seg(t, 0.8, 0.5); tag('Médula ósea', 730, 536, '#D9A441', 15); ctx.globalAlpha = 1;
  // eritropoyetina: del riñón a la médula
  const EP = poly([[330, 250], [420, 190], [560, 185], [650, 250], [722, 300]]);
  const nEp = Math.round(12 * (1 - 0.85 * fail)); for (let i = 0; i < nEp; i++) { const u = ((t * 0.28) + i / 12) % 1, [x, y] = EP.at(u);
    ctx.globalAlpha = seg(t, 1.5, 0.5) * Math.min(1, u * 6, (1 - u) * 6); ctx.fillStyle = C.AMBER; ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill(); text('EPO', x, y + 4, 9, C.BG, 'bold', 'center'); } ctx.globalAlpha = 1;
  ctx.globalAlpha = fade(t, 2, 12); tag('Eritropoyetina', 490, 160, C.AMBER, 15); ctx.globalAlpha = 1;
  // hematíes que salen de la médula
  const nRb = Math.round(10 * (1 - 0.8 * fail)); for (let i = 0; i < 10; i++) { if (i >= nRb) continue; const u = ((t * 0.2) + i / 10) % 1; const x = 780 + u * 60, y = 330 + (rnd(i) - 0.5) * 120 + 0 * u;
    draw('hem', x, y, 30, Math.min(1, u * 5, (1 - u) * 5) * seg(t, 2, 0.5), u * 3); }
  // panel derecho: hemoglobina y calcio/PTH
  const hb = lerp(14, 8.6, fail), pth = lerp(40, 100, ease(seg(t, 11, 6))), ca = lerp(9.4, 8.1, ease(seg(t, 11, 6)));
  cnt(t, 850, 150, 390, [['Hemoglobina', hb, 16, 'g/dL', hb < 10 ? C.RED : C.GREEN, f1, [[10, '10'], [11.5, '11,5']]]], 1.5);
  K.card(850, 262, 390, 150, C.AMBER, 'Anemia renal', ['Normocítica y normocrómica', 'Primero hierro; después eritropoyetina', 'Meta 10–11,5 g/dL: nunca sobre 13'], seg(t, 9, 0.5), 16);
  const ph2 = seg(t, 12, 0.5);
  if (ph2 > 0) { ctx.globalAlpha = ph2; rrect(40, 556, 1200, 84, 16, '#161B22');
    const cs = [['Falta calcitriol', C.VIOLET], ['Calcio sube poco', C.BLUE], ['Fósforo se retiene', C.RED], ['PTH sube', C.AMBER], ['Hueso: osteodistrofia', '#D9A441']];
    cs.forEach(([s0, c0], i) => { const a = seg(t, 12.5 + i * 1.3, 0.5), x = 60 + i * 238; ctx.globalAlpha = a; rrect(x, 566, 214, 56, 12, '#1B2230'); ctx.fillStyle = c0; ctx.fillRect(x, 566, 6, 56); text(s0, x + 112, 600, 16, C.INK, 'bold', 'center');
      if (i < 4) text('→', x + 226, 600, 22, C.MUTED, 'bold', 'center'); }); ctx.globalAlpha = 1; }
  K.banner(40, 650, 1200, 'Hierro primero, luego eritropoyetina; PTH alta: mide la vitamina D antes del calcitriol', C.GREEN, seg(t, 20.5, 0.5));
}

// nefro-20 · estenosis de la arteria renal: el riñón isquémico secreta renina (Servier: riñones y grandes vasos)
function renal(t) {
  K.title('Estenosis de la arteria renal', 'Un riñón que cree que le falta presión', C.RED);
  const RX = 40, RY = 190, S = 1.0, R = (x, y) => [RX + x * S, RY + y * S];
  ctx.globalAlpha = seg(t, 0, 0.6); rrect(RX - 10, RY - 10, 717 + 20, 410 + 20, 16, '#FFFFFF'); ctx.globalAlpha = 1;
  const isq = ease(seg(t, 4, 3));
  ctx.save(); ctx.globalAlpha = seg(t, 0, 0.6); ctx.drawImage(I('rin2'), 0, 0, 717, 410, RX, RY, 717, 410); ctx.restore();
  // riñón derecho de la imagen (izquierdo del paciente): se apaga
  ctx.save(); ctx.beginPath(); ctx.rect(RX + 458, RY, 260, 410); ctx.clip(); ctx.fillStyle = `rgba(60,40,70,${0.45 * isq})`; ctx.fillRect(RX + 458, RY, 260, 410); ctx.restore();
  // placa en la arteria renal
  const [px, py] = R(440, 150), pl = ease(seg(t, 2, 2.5));
  if (pl > 0) { ctx.save(); ctx.globalAlpha = pl; ctx.fillStyle = '#E8C468'; ctx.strokeStyle = '#8A6A1F'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px - 28, py - 22); ctx.quadraticCurveTo(px, py - 6 - 5 * (1 - pl), px + 28, py - 22); ctx.lineTo(px + 28, py - 28); ctx.lineTo(px - 28, py - 28); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px - 28, py + 22); ctx.quadraticCurveTo(px, py + 6 + 5 * (1 - pl), px + 28, py + 22); ctx.lineTo(px + 28, py + 28); ctx.lineTo(px - 28, py + 28); ctx.fill(); ctx.stroke(); ctx.restore(); }
  ctx.globalAlpha = seg(t, 2.8, 0.5); tag('Estenosis: placa o displasia', px, py - 52, C.AMBER, 14); ctx.globalAlpha = 1;
  // flujo de sangre por la arteria renal (más lento después de la estenosis)
  const RA = poly([R(330, 200), R(380, 160), R(430, 150), R(470, 155), R(520, 160), R(560, 150)]);
  for (let i = 0; i < 10; i++) { const sp = 0.3 * (1 - 0.65 * pl), u = ((t * sp) + i / 10) % 1, [x, y] = RA.at(u); ctx.globalAlpha = Math.min(1, u * 6, (1 - u) * 6); ctx.fillStyle = '#FF3B30'; ctx.beginPath(); ctx.arc(x, y, 4.5 - 1.2 * pl * (u > 0.4 ? 1 : 0), 0, 7); ctx.fill(); } ctx.globalAlpha = 1;
  // renina → angiotensina II / aldosterona
  const rn = seg(t, 6, 1);
  for (let i = 0; i < 9; i++) { const u = ((t * 0.22) + i / 9) % 1, x = R(600, 150)[0] + u * 70, y = R(600, 150)[1] - 40 - u * 90; ctx.globalAlpha = rn * Math.min(1, u * 6, (1 - u) * 6); ctx.fillStyle = C.AMBER; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill(); } ctx.globalAlpha = 1;
  ctx.globalAlpha = rn * fade(t, 6, 22); tag('Renina masiva', ...R(660, 40), C.AMBER, 15); ctx.globalAlpha = 1;
  const an = seg(t, 9, 1); ctx.globalAlpha = an; tag('Angiotensina II: vasoconstricción', ...R(200, 360), C.VIOLET, 14); tag('Aldosterona: retiene sodio, pierde potasio', ...R(480, 360), C.RED, 14); ctx.globalAlpha = 1;
  const pa = lerp(125, 185, ease(seg(t, 8, 6))), kk = lerp(4.2, 3.4, ease(seg(t, 10, 6)));
  cnt(t, 800, 150, 440, [['Presión arterial', pa, 220, 'mmHg', pa > 160 ? C.RED : pa > 140 ? C.AMBER : C.GREEN, null, [[140, '140']]], ['Potasio', kk, 6, 'mEq/L', kk < 3.5 ? C.AMBER : C.GREEN, f1, [[3.5, '3,5']]]], 5);
  K.card(800, 332, 440, 130, C.RED, 'Pistas', ['HTA refractaria o antes de los 30 / después de 55', 'Soplo en el flanco'], seg(t, 13, 0.5), 17);
  K.card(800, 478, 440, 130, C.AMBER, 'Con IECA o ARA-II', ['Cae la filtración: la creatinina sube más de 30 %'], seg(t, 17, 0.5), 17);
  K.banner(40, 640, 1200, 'Primer examen: Doppler de arterias renales', C.GREEN, seg(t, 20.5, 0.5));
}

// nefro-22 · cortes de filtración que cambian la receta (gráfico, sin anatomía)
function farm(t) {
  K.title('Ajuste de fármacos según la filtración', 'El corte de TFG cambia la receta', C.BLUE);
  const TX0 = 360, TW = 860, tx = v => TX0 + TW * (90 - v) / 80;              // eje TFG: 90 → 10
  const cur = lerp(90, 12, ease(seg(t, 2.5, 15)));
  const rows = [['Metformina', [[90, 45, C.GREEN, 'Dosis habitual (vigilar bajo 60)'], [45, 30, C.AMBER, 'Mitad: máx. 1.000'], [30, 10, C.RED, 'Suspender']], 'Acidosis láctica si se acumula'],
                ['Aminoglucósidos', [[90, 60, C.GREEN, 'Dosis habitual'], [60, 10, C.AMBER, 'Espaciar según niveles']], 'Necrosis tubular y ototoxicidad'],
                ['Enoxaparina', [[90, 30, C.GREEN, 'Dosis habitual'], [30, 10, C.AMBER, 'Mitad o HNF']], 'Se acumula: hemorragia mayor'],
                ['AINE', [[90, 60, C.GREEN, 'Con cuidado'], [60, 10, C.RED, 'Contraindicados en ERC o IRA']], 'Cierran la arteriola aferente']];
  const Y0 = 210, RH = 96;
  [90, 60, 45, 30, 15].forEach(v => { const x = tx(v); ctx.strokeStyle = '#222833'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, Y0 - 20); ctx.lineTo(x, Y0 + RH * 4); ctx.stroke(); text(String(v), x, Y0 - 30, 14, C.MUTED, '', 'center'); });
  text('TFG (mL/min)', TX0 + TW, Y0 - 52, 14, C.MUTED, '', 'right');
  rows.forEach(([n, bands, nota], i) => { const y = Y0 + i * RH, a = seg(t, 0.3 + i * 0.25, 0.5); ctx.globalAlpha = a; text(n, 40, y + 38, 22, C.INK, 'bold'); text(nota, 40, y + 64, 14, C.MUTED);
    bands.forEach(([hi, lo, col, lab]) => { const x0 = tx(hi), x1 = tx(lo), on = cur <= hi && cur > lo; ctx.globalAlpha = a * (on ? 1 : 0.6); rrect(x0 + 1, y + 14, x1 - x0 - 2, 52, 10, col);
      ctx.fillStyle = C.BG; text(lab, (x0 + x1) / 2, y + 46, 14, C.BG, 'bold', 'center'); });
    ctx.globalAlpha = 1; });
  const cx = tx(cur); ctx.strokeStyle = C.INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx, Y0 - 22); ctx.lineTo(cx, Y0 + RH * 4 + 6); ctx.stroke();
  ctx.fillStyle = C.INK; ctx.beginPath(); ctx.moveTo(cx - 9, Y0 - 24); ctx.lineTo(cx + 9, Y0 - 24); ctx.lineTo(cx, Y0 - 10); ctx.fill();
  rrect(40, 112, 270, 62, 14, '#161B22'); text('TFG', 60, 152, 22, C.MUTED, 'bold'); text(String(Math.round(cur)), 290, 156, 44, cur > 45 ? C.GREEN : cur > 30 ? C.AMBER : C.RED, 'bold', 'right');
  K.card(40, 604, 600, 96, C.BLUE, 'Nefropatía por contraste', ['Suero fisiológico 1–1,5 mL/kg/h, 6–12 horas antes y después'], seg(t, 19, 0.5), 17);
  K.card(660, 604, 580, 96, C.RED, 'No protegen', ['Furosemida, manitol ni N-acetilcisteína'], seg(t, 21, 0.5), 17);
}
