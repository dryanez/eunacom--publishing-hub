<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EUNACOM 2026 · Reproductor Adaptativo Suizo (Swiss Editorial Style)</title>
<script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#F5F3EE; color:#111111; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  a { color:#B4322A; text-decoration:none; }
  a:hover { color:#8C231D; }

  /* Smooth animations and transitions */
  :root {
    --acc: #16a34a;
    --acc-t: #f8fafc;
    --acc-p: #0284c7;
    --spring-curve: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Enhanced Q&A Full-Width Layout */
  .question-container {
    width: 100%;
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .q-stem {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.6;
    color: #1a1a1a;
    margin-bottom: 12px;
  }

  .q-options {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
  }

  .q-opt {
    width: 100%;
    padding: 18px 20px;
    border: 2px solid #ddd;
    border-radius: 8px;
    background: #ffffff;
    cursor: pointer;
    transition: all 0.3s var(--ease-out);
    font-size: 16px;
    line-height: 1.5;
    text-align: left;
  }

  .q-opt:hover {
    border-color: var(--acc-p);
    background: #f0f9ff;
    box-shadow: 0 4px 12px rgba(2, 132, 199, 0.12);
    transform: translateX(4px);
  }

  .q-opt.selected {
    border-color: var(--acc);
    background: #f0fdf4;
    box-shadow: 0 4px 12px rgba(22, 163, 74, 0.12);
  }

  .q-opt.correct {
    border-color: #16a34a;
    background: #f0fdf4;
  }

  .q-opt.incorrect {
    border-color: #dc2626;
    background: #fef2f2;
  }

  /* Clinical Pathway Visualization */
  .pathway-container {
    width: 100%;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    min-height: 100%;
  }

  .pathway-node {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 80px;
    animation: nodeEnter 0.6s var(--spring-curve);
  }

  @keyframes nodeEnter {
    from {
      opacity: 0;
      transform: translateY(20px) scale(0.95);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .pathway-entry, .pathway-decision, .pathway-conduct {
    width: 100%;
    max-width: 500px;
    padding: 20px 24px;
    border-radius: 12px;
    text-align: center;
    font-weight: 600;
    position: relative;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .pathway-entry {
    background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    border: 2px solid #cbd5e1;
    color: #0f172a;
    font-size: 16px;
  }

  .pathway-decision {
    background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
    border: 2px solid #0284c7;
    color: #0c4a6e;
    font-size: 15px;
  }

  .pathway-conduct {
    background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
    border: 2px solid #16a34a;
    color: #14532d;
    font-size: 15px;
    font-weight: 700;
  }

  .pathway-conduct.warning {
    background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
    border: 2px solid #dc2626;
    color: #7f1d1d;
  }

  .pathway-branch {
    display: flex;
    gap: 16px;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
  }

  .branch-path {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
  }

  .branch-label {
    font-size: 13px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 6px;
    background: #f5f5f5;
    color: #333;
  }

  .branch-label.yes {
    background: #f0fdf4;
    color: #14532d;
    border: 1px solid #16a34a;
  }

  .branch-label.no {
    background: #fef2f2;
    color: #7f1d1d;
    border: 1px solid #dc2626;
  }

  /* Connector Lines */
  .pathway-arrow {
    width: 2px;
    height: 24px;
    background: #cbd5e1;
    margin: 8px 0;
    position: relative;
  }

  .pathway-arrow::after {
    content: '↓';
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    color: #0f172a;
    font-size: 14px;
  }

  /* Topic Expansion Animation */
  .topic-card {
    padding: 20px;
    border-radius: 12px;
    background: #ffffff;
    border: 2px solid #e5e7eb;
    margin-bottom: 16px;
    transition: all 0.4s var(--spring-curve);
    cursor: pointer;
  }

  .topic-card:hover {
    border-color: var(--acc-p);
    box-shadow: 0 8px 24px rgba(2, 132, 199, 0.15);
    transform: translateY(-2px);
  }

  .topic-card.expanded {
    background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
    border-color: var(--acc-p);
    box-shadow: 0 12px 32px rgba(2, 132, 199, 0.2);
    transform: scale(1.02);
  }

  .topic-title {
    font-size: 16px;
    font-weight: 700;
    color: #0c4a6e;
    margin-bottom: 8px;
  }

  .topic-points {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.5s var(--spring-curve);
  }

  .topic-card.expanded .topic-points {
    max-height: 400px;
  }

  .topic-point {
    padding: 12px 16px;
    background: #ffffff;
    border-left: 3px solid var(--acc-p);
    border-radius: 6px;
    font-size: 14px;
    line-height: 1.5;
    animation: pointPopIn 0.5s var(--spring-curve) forwards;
    opacity: 0;
  }

  @keyframes pointPopIn {
    from {
      opacity: 0;
      transform: translateX(-12px) scale(0.95);
    }
    to {
      opacity: 1;
      transform: translateX(0) scale(1);
    }
  }

  .topic-point:nth-child(1) { animation-delay: 0.1s; }
  .topic-point:nth-child(2) { animation-delay: 0.2s; }
  .topic-point:nth-child(3) { animation-delay: 0.3s; }
  .topic-point:nth-child(4) { animation-delay: 0.4s; }
  .topic-point:nth-child(5) { animation-delay: 0.5s; }

  /* Slide Container */
  .slide {
    display: none;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .slide.active {
    display: flex;
    opacity: 1;
    animation: slideIn 0.5s var(--ease-out);
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateX(12px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  .slide-content {
    flex: 1;
    overflow-y: auto;
    padding: 0;
  }

  /* Header and Navigation */
  .swiss-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #111111;
    height: 58px;
    padding: 0 24px;
    flex-shrink: 0;
  }

  .slide-title {
    font-size: 16px;
    font-weight: 700;
    color: #111111;
  }

  .slide-nav {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .nav-btn {
    padding: 8px 16px;
    background: #f0f0f0;
    border: 1px solid #ddd;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s ease;
  }

  .nav-btn:hover {
    background: #e0e0e0;
    border-color: #999;
  }

  .nav-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Dock Footer */
  .swiss-dock {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 54px;
    padding: 0 24px;
    border-top: 1px solid #111111;
    flex-shrink: 0;
    background: #F5F3EE;
    z-index: 30;
  }

  .slide-counter {
    font-size: 13px;
    color: #666;
    font-weight: 600;
  }

  .audio-controls {
    display: flex;
    gap: 12px;
  }

  .audio-btn {
    width: 40px;
    height: 40px;
    border-radius: 6px;
    border: 1px solid #ddd;
    background: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.2s ease;
  }

  .audio-btn:hover {
    background: #f0f0f0;
    border-color: var(--acc-p);
  }

  .audio-btn.playing {
    background: var(--acc-p);
    color: white;
    border-color: var(--acc-p);
  }

  /* High-Resolution SVG */
  svg.pathway-svg {
    width: 100%;
    max-width: 800px;
    height: auto;
    margin: 20px auto;
    display: block;
  }

  /* Scrollbar styling */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #EDEAE2; }
  ::-webkit-scrollbar-thumb { background: #CFC8B6; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #A9A190; }

  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
</style>
</head>
<body>
<div style="display:flex; flex-direction:column; height:100%;">
  <!-- Header -->
  <div class="swiss-header">
    <div class="slide-title" id="slideTitle">Cargando...</div>
    <div class="slide-nav">
      <button class="nav-btn" id="prevBtn" onclick="prevSlide()">← Anterior</button>
      <button class="nav-btn" id="nextBtn" onclick="nextSlide()">Siguiente →</button>
    </div>
  </div>

  <!-- Main Slide Container -->
  <div class="slide-content" style="flex:1; overflow-y:auto; display:flex; align-items:center; justify-content:center;">
    <div id="slideContainer" style="width:100%; max-width:1200px; padding:32px;">
      <!-- Slides will be injected here -->
    </div>
  </div>

  <!-- Footer with Controls -->
  <div class="swiss-dock">
    <div class="slide-counter"><span id="slideNum">0</span> / <span id="totalSlides">0</span></div>
    <div class="audio-controls">
      <button class="audio-btn" id="playAudioBtn" onclick="toggleAudio()">🔊</button>
      <button class="audio-btn" id="pauseAudioBtn" onclick="pauseAudio()">⏸</button>
    </div>
  </div>
</div>

<audio id="audioPlayer" style="display:none;"></audio>

<script>
// Deck Management System
class DeckPresentation {
  constructor() {
    this.currentSlide = 0;
    this.slides = [];
    this.audio = document.getElementById('audioPlayer');
    this.container = document.getElementById('slideContainer');
    this.init();
  }

  init() {
    // Deck data will be injected by build_swiss_player.cjs
    this.slides = window.deckData || [];
    this.totalSlides = this.slides.length;
    this.render();
    this.setupKeyboard();
  }

  render() {
    this.container.innerHTML = '';
    const slide = this.slides[this.currentSlide];

    if (!slide) return;

    const slideEl = document.createElement('div');
    slideEl.className = 'slide active';

    switch (slide.type) {
      case 'cover':
        slideEl.innerHTML = this.renderCover(slide);
        break;
      case 'bento':
        slideEl.innerHTML = this.renderBento(slide);
        break;
      case 'pathway':
        slideEl.innerHTML = this.renderPathway(slide);
        break;
      case 'question':
        slideEl.innerHTML = this.renderQuestion(slide);
        break;
      case 'figure':
        slideEl.innerHTML = this.renderFigure(slide);
        break;
      default:
        slideEl.innerHTML = this.renderBento(slide);
    }

    this.container.appendChild(slideEl);
    this.updateNav();
    this.updateCounter();

    // Auto-play audio if available
    if (slide.audio) {
      this.playAudio(slide.audio);
    }
  }

  renderCover(slide) {
    return `
      <div style="text-align:center; padding:60px 40px;">
        <h1 style="font-size:48px; font-weight:800; margin:0 0 16px 0; color:#111;">
          ${slide.title}
        </h1>
        <p style="font-size:18px; color:#666; margin:0 0 32px 0;">
          ${slide.subtitle || ''}
        </p>
        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:32px;">
          ${(slide.badges || []).map(b => `
            <span style="padding:8px 16px; border-radius:6px; background:${b.bg}; color:${b.color};
                         border:1px solid ${b.border}; font-weight:600; font-size:13px;">
              ${b.label}
            </span>
          `).join('')}
        </div>
      </div>
    `;
  }

  renderBento(slide) {
    return `
      <div style="padding:32px;">
        <h2 style="font-size:28px; font-weight:700; margin:0 0 28px 0; color:#111;">
          ${slide.nav}
        </h2>
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:20px;">
          ${(slide.cards || []).map((card, i) => `
            <div class="topic-card" onclick="this.classList.toggle('expanded')">
              <div class="topic-title">${card.title}</div>
              <div class="topic-points">
                ${(card.items || []).map(item => `
                  <div class="topic-point">${item}</div>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  renderPathway(slide) {
    return `
      <div class="pathway-container">
        <h2 style="font-size:24px; font-weight:700; margin:0 0 24px 0; text-align:center;">
          ${slide.title}
        </h2>
        ${this.renderPathwaySteps(slide.steps || [])}
      </div>
    `;
  }

  renderPathwaySteps(steps) {
    return steps.map((step, i) => {
      if (step.type === 'entry') {
        return `
          <div class="pathway-node" style="animation-delay: ${i * 0.1}s;">
            <div class="pathway-entry">${step.label}</div>
          </div>
          <div class="pathway-arrow"></div>
        `;
      } else if (step.type === 'decision') {
        return `
          <div class="pathway-node" style="animation-delay: ${i * 0.1}s;">
            <div class="pathway-decision">${step.label}</div>
          </div>
          <div class="pathway-arrow"></div>
        `;
      } else if (step.type === 'branch') {
        return `
          <div class="pathway-node" style="animation-delay: ${i * 0.1}s;">
            <div class="pathway-branch">
              <div class="branch-path">
                <div class="branch-label yes">✓ SÍ</div>
                ${(step.yes || []).map(item => `
                  <div class="pathway-conduct">${item}</div>
                `).join('')}
              </div>
              <div class="branch-path">
                <div class="branch-label no">✗ NO</div>
                ${(step.no || []).map(item => `
                  <div class="pathway-conduct">${item}</div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      } else if (step.type === 'conduct') {
        return `
          <div class="pathway-node" style="animation-delay: ${i * 0.1}s;">
            <div class="pathway-conduct ${step.warning ? 'warning' : ''}">
              ${step.label}
            </div>
          </div>
        `;
      }
      return '';
    }).join('<div class="pathway-arrow"></div>');
  }

  renderQuestion(slide) {
    return `
      <div class="question-container">
        <h2 style="font-size:20px; font-weight:700; margin:0 0 20px 0;">
          ${slide.nav || 'Pregunta'}
        </h2>
        <div class="q-stem">${slide.stem}</div>
        <div class="q-options">
          ${(slide.options || []).map((opt, i) => `
            <div class="q-opt" onclick="selectOption(this, '${opt.id}')">
              <strong>${opt.id}.</strong> ${opt.text}
            </div>
          `).join('')}
        </div>
        ${slide.explanation ? `
          <div style="margin-top:24px; padding:20px; background:#f9fafb; border-left:3px solid var(--acc); border-radius:6px;">
            <h4 style="margin:0 0 12px 0;">Explicación:</h4>
            <p style="margin:0; line-height:1.6;">${slide.explanation}</p>
          </div>
        ` : ''}
      </div>
    `;
  }

  renderFigure(slide) {
    return `
      <div style="padding:32px; text-align:center;">
        <h2 style="font-size:24px; font-weight:700; margin:0 0 24px 0;">
          ${slide.title}
        </h2>
        ${slide.svgContent ? `<div class="svg-stage">${slide.svgContent}</div>` : ''}
      </div>
    `;
  }

  playAudio(audioUrl) {
    this.audio.src = audioUrl;
    this.audio.play();
  }

  setupKeyboard() {
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') this.nextSlide();
      if (e.key === 'ArrowLeft') this.prevSlide();
      if (e.key === ' ') this.toggleAudio();
    });
  }

  nextSlide() {
    if (this.currentSlide < this.totalSlides - 1) {
      this.currentSlide++;
      this.render();
    }
  }

  prevSlide() {
    if (this.currentSlide > 0) {
      this.currentSlide--;
      this.render();
    }
  }

  updateCounter() {
    document.getElementById('slideNum').textContent = this.currentSlide + 1;
    document.getElementById('totalSlides').textContent = this.totalSlides;
  }

  updateNav() {
    document.getElementById('prevBtn').disabled = this.currentSlide === 0;
    document.getElementById('nextBtn').disabled = this.currentSlide === this.totalSlides - 1;
  }
}

function nextSlide() {
  presentation.nextSlide();
}

function prevSlide() {
  presentation.prevSlide();
}

function toggleAudio() {
  if (presentation.audio.paused) {
    presentation.audio.play();
  } else {
    presentation.audio.pause();
  }
}

function pauseAudio() {
  presentation.audio.pause();
}

function selectOption(el, optionId) {
  el.parentElement.querySelectorAll('.q-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
}

// Initialize presentation
const presentation = new DeckPresentation();
</script>
</body>
</html>
