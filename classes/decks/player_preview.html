    let currentDeck = null;
    let currentSlideIdx = 0;

    function setDeck(classId) {
      currentDeck = DEMO_DECKS[classId] || DEMO_DECKS["gastro-01"];
      currentSlideIdx = 0;

      document.getElementById('class-title').innerText = currentDeck.title;
      document.getElementById('v3-code-badge').innerText = currentDeck.perfilCodes[0] || 'ASOFAMECh';
      document.getElementById('topic-real-q').innerText = `${currentDeck.realQuestionCount || 0} preguntas en banco EUNACOM`;

      buildTimeline();
      renderSlide();
    }

    function buildTimeline() {
      const timeline = document.getElementById('segmented-timeline');
      timeline.innerHTML = '';
      currentDeck.slides.forEach((s, idx) => {
        const bar = document.createElement('div');
        bar.className = `h-1.5 flex-1 rounded-full cursor-pointer transition-all duration-200 ${
          idx === currentSlideIdx ? 'bg-eunacom-red shadow-sm shadow-rose-500/50 scale-y-125' : idx < currentSlideIdx ? 'bg-slate-600' : 'bg-slate-800'
        }`;
        bar.title = `${idx + 1}. ${s.nav || s.title || ''}`;
        bar.onclick = () => { currentSlideIdx = idx; renderSlide(); buildTimeline(); };
        timeline.appendChild(bar);
      });
    }

    function renderSlide() {
      const slide = currentDeck.slides[currentSlideIdx];
      const viewport = document.getElementById('slide-viewport');
      const total = currentDeck.slides.length;

      document.getElementById('slide-indicator').innerText = `Slide ${currentSlideIdx + 1} de ${total}`;
      document.getElementById('slide-nav-label').innerText = slide.nav || slide.title || '';
      document.getElementById('prev-btn').disabled = currentSlideIdx === 0;
      document.getElementById('next-btn').disabled = currentSlideIdx === total - 1;

      document.getElementById('drawer-slide-num').innerText = `Slide ${currentSlideIdx + 1} / ${total}`;
      document.getElementById('drawer-notes-text').innerText = slide.notes || 'Sin notas de teleprompter para esta diapositiva.';

      buildTimeline();

      if (slide.type === 'cover') {
        viewport.innerHTML = `
          <div class="flex flex-col items-start gap-6 py-6 animate-fade-in">
            <div class="flex flex-wrap gap-2">
              ${(slide.badges || []).map(b => `
                <span class="text-xs font-bold px-3 py-1 rounded-full border" style="background:${b.bg}; color:${b.color}; border-color:${b.border};">
                  ${b.label}
                </span>
              `).join('')}
            </div>
            <span class="text-xs font-mono tracking-widest text-cyan-400 uppercase font-bold">${slide.kicker || ''}</span>
            <h2 class="text-3xl lg:text-4xl font-extrabold text-slate-100 tracking-tight leading-tight">
              ${slide.title}
            </h2>
            <p class="text-base text-slate-400 font-medium max-w-3xl">
              ${slide.subtitle || ''}
            </p>
            <div class="p-4 rounded-xl bento-card w-full mt-4 flex items-center justify-between">
              <span class="text-xs text-slate-300">Duración estimada: <b>${total * 1.5} minutos</b></span>
              <span class="text-xs text-emerald-400 font-semibold flex items-center gap-1">
                ✓ Exigencia legal Perfil V3 ASOFAMECh calibrada
              </span>
            </div>
          </div>
        `;
      } else if (slide.type === 'table') {
        viewport.innerHTML = `
          <div class="flex flex-col gap-5 py-4">
            <div>
              <span class="text-xs font-mono text-cyan-400 uppercase font-bold">${slide.nav || 'Matriz Legal'}</span>
              <h2 class="text-2xl font-bold text-slate-100">${slide.title}</h2>
              <p class="text-sm text-slate-400">${slide.subtitle || ''}</p>
            </div>
            ${slide.pearl ? `
              <div class="p-3.5 rounded-xl bg-amber-950/40 border border-amber-500/40 text-xs font-medium text-amber-300">
                ${slide.pearl}
              </div>
            ` : ''}
            <div class="overflow-x-auto rounded-xl border border-dark-border bento-card">
              <table class="w-full text-left text-xs lg:text-sm">
                <thead class="bg-slate-900/90 text-slate-400 border-b border-dark-border text-xs uppercase font-semibold">
                  <tr>
                    ${(slide.headers || []).map(h => `<th class="p-3.5">${h}</th>`).join('')}
                  </tr>
                </thead>
                <tbody class="divide-y divide-dark-border">
                  ${(slide.rows || []).map(r => `
                    <tr class="${r.highlight ? 'bg-cyan-950/30 font-medium text-cyan-200' : 'hover:bg-dark-hover text-slate-300'}">
                      ${(r.cells || []).map(c => `<td class="p-3.5">${c}</td>`).join('')}
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } else if (slide.type === 'bento') {
        viewport.innerHTML = `
          <div class="flex flex-col gap-5 py-4">
            <div>
              <span class="text-xs font-mono text-purple-400 uppercase font-bold">${slide.nav || 'Concepto'}</span>
              <h2 class="text-2xl font-bold text-slate-100">${slide.title}</h2>
              <p class="text-sm text-slate-400">${slide.subtitle || ''}</p>
            </div>
            <div class="grid grid-cols-1 gap-4">
              ${(slide.tiles || []).map(t => `
                <div class="p-5 rounded-xl bento-card flex flex-col justify-between">
                  ${t.title ? `<h3 class="text-base font-bold text-slate-200 mb-3">${t.title}</h3>` : ''}
                  <ul class="space-y-2.5 text-sm text-slate-300">
                    ${(t.bullets || []).map(b => `
                      <li class="flex items-start gap-2.5">
                        <span class="text-cyan-400 font-bold mt-0.5">•</span>
                        <span class="leading-relaxed">${b}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (slide.type === 'question') {
        viewport.innerHTML = `
          <div class="flex flex-col gap-5 py-4">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold px-2.5 py-1 rounded-md bg-amber-500/20 text-amber-400 border border-amber-500/30">
                  ${slide.badge || 'Pregunta EUNACOM'}
                </span>
                <span class="text-xs text-slate-400 font-mono">Pregunta #${slide.number}</span>
              </div>
            </div>

            <div class="p-5 rounded-xl bento-card border-l-4 border-l-amber-500">
              <p class="text-sm lg:text-base text-slate-200 leading-relaxed font-medium">
                ${slide.caseText}
              </p>
            </div>

            <p class="text-sm font-bold text-slate-300">${slide.question}</p>

            <div class="space-y-2.5" id="options-list">
              ${(slide.options || []).map((o, idx) => `
                <button onclick="checkAnswer(${idx}, ${o.isCorrect})" class="w-full text-left p-3.5 rounded-xl bg-dark-card border border-dark-border hover:border-slate-500 hover:bg-slate-800/80 transition flex items-center justify-between group opt-btn" data-idx="${idx}">
                  <span class="text-sm text-slate-300 font-medium group-hover:text-white flex items-center gap-3">
                    <span class="w-6 h-6 rounded-full bg-slate-800 text-xs font-bold flex items-center justify-center text-slate-400 group-hover:text-cyan-400">${o.id || String.fromCharCode(65 + idx)}</span>
                    ${o.text}
                  </span>
                  <span class="feedback-icon hidden text-sm font-bold"></span>
                </button>
              `).join('')}
            </div>

            <div id="explanation-box" class="hidden p-4 rounded-xl bg-emerald-950/40 border border-emerald-500/40 text-xs text-emerald-200 leading-relaxed">
              <span class="font-bold block mb-1 text-emerald-300">Justificación Oficial:</span>
              ${slide.explanation}
            </div>
          </div>
        `;
      }
    }

    window.checkAnswer = function(selectedIdx, isCorrect) {
      const buttons = document.querySelectorAll('.opt-btn');
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        const icon = btn.querySelector('.feedback-icon');
        icon.classList.remove('hidden');
        if (idx === selectedIdx) {
          if (isCorrect) {
            btn.classList.add('bg-emerald-950/60', 'border-emerald-500', 'text-emerald-200');
            icon.innerText = '✓ Correcta';
            icon.classList.add('text-emerald-400');
          } else {
            btn.classList.add('bg-rose-950/60', 'border-rose-500', 'text-rose-200');
            icon.innerText = '✗ Incorrecta';
            icon.classList.add('text-rose-400');
          }
        }
      });
      document.getElementById('explanation-box').classList.remove('hidden');
    };

    document.getElementById('prev-btn').onclick = () => {
      if (currentSlideIdx > 0) { currentSlideIdx--; renderSlide(); }
    };
    document.getElementById('next-btn').onclick = () => {
      if (currentSlideIdx < currentDeck.slides.length - 1) { currentSlideIdx++; renderSlide(); }
    };

    window.onkeydown = (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        if (currentSlideIdx < currentDeck.slides.length - 1) { currentSlideIdx++; renderSlide(); }
      } else if (e.key === 'ArrowLeft') {
        if (currentSlideIdx > 0) { currentSlideIdx--; renderSlide(); }
      }
    };

    document.getElementById('class-select').onchange = (e) => {
      setDeck(e.target.value);
    };

    document.getElementById('notes-toggle-btn').onclick = () => {
      document.getElementById('notes-drawer').classList.toggle('hidden');
    };

    setDeck("gastro-01");
  </script>
</body>
</html>
