<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs><rect width="1200" height="700" fill="#FFFFFF"/><text x="40.0" y="46.0" font-size="26" fill="#111111" text-anchor="start" font-weight="700">Clasificación FIGO de los miomas (0 a 8)</text><text x="40.0" y="74.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">Según su relación con la cavidad (submucosos) y con la serosa (subserosos)</text><path d="M242.5,230.0 C242.5,105.0 617.5,105.0 617.5,230.0 C617.5,417.5 505.0,505.0 486.25,617.5 L373.75,617.5 C355.0,505.0 242.5,417.5 242.5,230.0 Z" fill="#E9A6A0" stroke="#111111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><path d="M330.0,217.5 C355.0,192.5 505.0,192.5 530.0,217.5 L445.0,455.0 L445.0,617.5 L415.0,617.5 L415.0,455.0 Z" fill="#FDE2E4" stroke="#111111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><circle cx="420.0" cy="260.0" r="26.0" fill="#FDF2E9" stroke="#111111" stroke-width="2"/><text x="420.0" y="267.0" font-size="20" fill="#111111" text-anchor="middle" font-weight="700">0</text><circle cx="505.0" cy="260.0" r="28.0" fill="#FDF2E9" stroke="#111111" stroke-width="2"/><text x="505.0" y="267.0" font-size="20" fill="#111111" text-anchor="middle" font-weight="700">1</text><circle cx="315.0" cy="300.0" r="30.0" fill="#FDF2E9" stroke="#111111" stroke-width="2"/><text x="315.0" y="307.0" font-size="20" fill="#111111" text-anchor="middle" font-weight="700">2</text><circle cx="570.0" cy="340.0" r="30.0" fill="#FDF2E9" stroke="#111111" stroke-width="2"/><text x="570.0" y="347.0" font-size="20" fill="#111111" text-anchor="middle" font-weight="700">3</text><circle cx="270.0" cy="400.0" r="26.0" fill="#FDF2E9" stroke="#111111" stroke-width="2"/><text x="270.0" y="407.0" font-size="20" fill="#111111" text-anchor="middle" font-weight="700">4</text><circle cx="615.0" cy="190.0" r="30.0" fill="#FDF2E9" stroke="#111111" stroke-width="2"/><text x="615.0" y="197.0" font-size="20" fill="#111111" text-anchor="middle" font-weight="700">5</text><circle cx="215.0" cy="180.0" r="30.0" fill="#FDF2E9" stroke="#111111" stroke-width="2"/><text x="215.0" y="187.0" font-size="20" fill="#111111" text-anchor="middle" font-weight="700">6</text><line x1="590.0" y1="440.0" x2="660.0" y2="490.0" stroke="#111111" stroke-width="2"/><circle cx="675.0" cy="505.0" r="26.0" fill="#FDF2E9" stroke="#111111" stroke-width="2"/><text x="675.0" y="512.0" font-size="20" fill="#111111" text-anchor="middle" font-weight="700">7</text><circle cx="490.0" cy="590.0" r="22.0" fill="#FDF2E9" stroke="#111111" stroke-width="2"/><text x="490.0" y="597.0" font-size="20" fill="#111111" text-anchor="middle" font-weight="700">8</text><text x="760.0" y="150.0" font-size="16" fill="#B4322A" text-anchor="start" font-weight="700">0  Submucoso pediculado, dentro de la cavidad</text><text x="760.0" y="194.0" font-size="16" fill="#B4322A" text-anchor="start" font-weight="700">1  Submucoso, menos de 50 % intramural</text><text x="760.0" y="238.0" font-size="16" fill="#B4322A" text-anchor="start" font-weight="700">2  Submucoso, 50 % o más intramural</text><text x="760.0" y="282.0" font-size="16" fill="#111111" text-anchor="start" font-weight="400">3  Intramural que contacta el endometrio</text><text x="760.0" y="326.0" font-size="16" fill="#111111" text-anchor="start" font-weight="400">4  Intramural puro</text><text x="760.0" y="370.0" font-size="16" fill="#111111" text-anchor="start" font-weight="400">5  Subseroso, 50 % o más intramural</text><text x="760.0" y="414.0" font-size="16" fill="#111111" text-anchor="start" font-weight="400">6  Subseroso, menos de 50 % intramural</text><text x="760.0" y="458.0" font-size="16" fill="#111111" text-anchor="start" font-weight="400">7  Subseroso pediculado</text><text x="760.0" y="502.0" font-size="16" fill="#111111" text-anchor="start" font-weight="400">8  Otros: cervical, parasitario</text><text x="760.0" y="560.0" font-size="15" fill="#B4322A" text-anchor="start" font-weight="700">Los submucosos (0 a 2) son los que más sangran</text><text x="760.0" y="584.0" font-size="15" fill="#B4322A" text-anchor="start" font-weight="400">y los que se resecan por histeroscopía.</text></svg>