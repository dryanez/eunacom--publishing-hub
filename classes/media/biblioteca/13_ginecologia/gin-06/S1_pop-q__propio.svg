<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs><rect width="1200" height="680" fill="#FFFFFF"/><text x="40.0" y="46.0" font-size="26" fill="#111111" text-anchor="start" font-weight="700">Sistema POP-Q</text><text x="40.0" y="74.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">Cada punto se mide en cm respecto del himen: negativo por encima, positivo por debajo</text><rect x="60.0" y="120.0" width="180.0" height="110.0" rx="6" fill="#F5F3EE" stroke="#111111" stroke-width="2" opacity="1"/><text x="150.0" y="168.0" font-size="28" fill="#0369A1" text-anchor="middle" font-weight="700">Aa</text><text x="150.0" y="196.0" font-size="13" fill="#57534E" text-anchor="middle" font-weight="400">Pared anterior</text><text x="150.0" y="214.0" font-size="13" fill="#57534E" text-anchor="middle" font-weight="400">3 cm</text><rect x="250.0" y="120.0" width="180.0" height="110.0" rx="6" fill="#F5F3EE" stroke="#111111" stroke-width="2" opacity="1"/><text x="340.0" y="168.0" font-size="28" fill="#0369A1" text-anchor="middle" font-weight="700">Ba</text><text x="340.0" y="196.0" font-size="13" fill="#57534E" text-anchor="middle" font-weight="400">Pared anterior</text><text x="340.0" y="214.0" font-size="13" fill="#57534E" text-anchor="middle" font-weight="400">punto más bajo</text><rect x="440.0" y="120.0" width="180.0" height="110.0" rx="6" fill="#F5F3EE" stroke="#111111" stroke-width="2" opacity="1"/><text x="530.0" y="168.0" font-size="28" fill="#0369A1" text-anchor="middle" font-weight="700">C</text><text x="530.0" y="196.0" font-size="13" fill="#57534E" text-anchor="middle" font-weight="400">Cérvix o cúpula</text><rect x="60.0" y="240.0" width="180.0" height="110.0" rx="6" fill="#F5F3EE" stroke="#111111" stroke-width="2" opacity="1"/><text x="150.0" y="288.0" font-size="28" fill="#0369A1" text-anchor="middle" font-weight="700">gh</text><text x="150.0" y="316.0" font-size="13" fill="#57534E" text-anchor="middle" font-weight="400">Hiato genital</text><rect x="250.0" y="240.0" width="180.0" height="110.0" rx="6" fill="#F5F3EE" stroke="#111111" stroke-width="2" opacity="1"/><text x="340.0" y="288.0" font-size="28" fill="#0369A1" text-anchor="middle" font-weight="700">pb</text><text x="340.0" y="316.0" font-size="13" fill="#57534E" text-anchor="middle" font-weight="400">Cuerpo perineal</text><rect x="440.0" y="240.0" width="180.0" height="110.0" rx="6" fill="#F5F3EE" stroke="#111111" stroke-width="2" opacity="1"/><text x="530.0" y="288.0" font-size="28" fill="#0369A1" text-anchor="middle" font-weight="700">tvl</text><text x="530.0" y="316.0" font-size="13" fill="#57534E" text-anchor="middle" font-weight="400">Longitud vaginal total</text><rect x="60.0" y="360.0" width="180.0" height="110.0" rx="6" fill="#F5F3EE" stroke="#111111" stroke-width="2" opacity="1"/><text x="150.0" y="408.0" font-size="28" fill="#0369A1" text-anchor="middle" font-weight="700">Ap</text><text x="150.0" y="436.0" font-size="13" fill="#57534E" text-anchor="middle" font-weight="400">Pared posterior</text><text x="150.0" y="454.0" font-size="13" fill="#57534E" text-anchor="middle" font-weight="400">3 cm</text><rect x="250.0" y="360.0" width="180.0" height="110.0" rx="6" fill="#F5F3EE" stroke="#111111" stroke-width="2" opacity="1"/><text x="340.0" y="408.0" font-size="28" fill="#0369A1" text-anchor="middle" font-weight="700">Bp</text><text x="340.0" y="436.0" font-size="13" fill="#57534E" text-anchor="middle" font-weight="400">Pared posterior</text><text x="340.0" y="454.0" font-size="13" fill="#57534E" text-anchor="middle" font-weight="400">punto más bajo</text><rect x="440.0" y="360.0" width="180.0" height="110.0" rx="6" fill="#F5F3EE" stroke="#111111" stroke-width="2" opacity="1"/><text x="530.0" y="408.0" font-size="28" fill="#0369A1" text-anchor="middle" font-weight="700">D</text><text x="530.0" y="436.0" font-size="13" fill="#57534E" text-anchor="middle" font-weight="400">Fondo de saco posterior</text><text x="60.0" y="520.0" font-size="14" fill="#57534E" text-anchor="start" font-weight="400">Anterior arriba, posterior abajo. gh, pb y tvl no son puntos de prolapso.</text><text x="680.0" y="140.0" font-size="20" fill="#111111" text-anchor="start" font-weight="700">Estadios</text><rect x="680.0" y="180.0" width="54.0" height="54.0" rx="8" fill="#2F6B3F" stroke="none" stroke-width="0" opacity="1"/><text x="707.0" y="216.0" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700">0</text><text x="750.0" y="204.0" font-size="15" fill="#111111" text-anchor="start" font-weight="400">Sin prolapso</text><rect x="680.0" y="252.0" width="54.0" height="54.0" rx="8" fill="#CA8A04" stroke="none" stroke-width="0" opacity="1"/><text x="707.0" y="288.0" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700">I</text><text x="750.0" y="276.0" font-size="15" fill="#111111" text-anchor="start" font-weight="400">Punto más bajo a más de 1 cm sobre el himen</text><text x="750.0" y="296.0" font-size="15" fill="#111111" text-anchor="start" font-weight="400">(&lt; −1)</text><rect x="680.0" y="324.0" width="54.0" height="54.0" rx="8" fill="#B45309" stroke="none" stroke-width="0" opacity="1"/><text x="707.0" y="360.0" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700">II</text><text x="750.0" y="348.0" font-size="15" fill="#111111" text-anchor="start" font-weight="400">Entre 1 cm sobre y 1 cm bajo el himen (−1 a</text><text x="750.0" y="368.0" font-size="15" fill="#111111" text-anchor="start" font-weight="400">+1)</text><rect x="680.0" y="396.0" width="54.0" height="54.0" rx="8" fill="#B4322A" stroke="none" stroke-width="0" opacity="1"/><text x="707.0" y="432.0" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700">III</text><text x="750.0" y="420.0" font-size="15" fill="#111111" text-anchor="start" font-weight="400">Más de 1 cm bajo el himen, sin eversión</text><text x="750.0" y="440.0" font-size="15" fill="#111111" text-anchor="start" font-weight="400">total</text><rect x="680.0" y="468.0" width="54.0" height="54.0" rx="8" fill="#7F1D1D" stroke="none" stroke-width="0" opacity="1"/><text x="707.0" y="504.0" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700">IV</text><text x="750.0" y="492.0" font-size="15" fill="#111111" text-anchor="start" font-weight="400">Eversión completa de la vagina</text></svg>