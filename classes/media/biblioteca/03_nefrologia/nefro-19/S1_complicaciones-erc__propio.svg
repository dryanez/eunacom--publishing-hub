<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs><rect width="1200" height="680" fill="#FFFFFF"/><text x="40.0" y="46.0" font-size="26" fill="#111111" text-anchor="start" font-weight="700">Complicaciones de la enfermedad renal crónica</text><text x="40.0" y="74.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">Todas nacen de la caída del filtrado y de la pérdida de funciones endocrinas del riñón</text><circle cx="600.0" cy="360.0" r="95.0" fill="#FEE2E2" stroke="#B4322A" stroke-width="3"/><text x="600.0" y="352.0" font-size="22" fill="#B4322A" text-anchor="middle" font-weight="700">↓ Filtrado</text><text x="600.0" y="380.0" font-size="18" fill="#B4322A" text-anchor="middle" font-weight="700">glomerular</text><rect x="150.0" y="140.0" width="280.0" height="100.0" rx="8" fill="#F5F3EE" stroke="#111111" stroke-width="2" opacity="1"/><text x="164.0" y="168.0" font-size="17" fill="#111111" text-anchor="start" font-weight="700">Anemia</text><text x="164.0" y="194.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">↓ eritropoyetina</text><text x="164.0" y="215.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">normocítica normocrómica</text><line x1="497.7" y1="303.9" x2="407.8" y2="254.6" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/><rect x="850.0" y="140.0" width="280.0" height="100.0" rx="8" fill="#F5F3EE" stroke="#111111" stroke-width="2" opacity="1"/><text x="864.0" y="168.0" font-size="17" fill="#111111" text-anchor="start" font-weight="700">Trastorno mineral óseo</text><text x="864.0" y="194.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">↑ fósforo, ↓ calcitriol, ↓ calcio</text><text x="864.0" y="215.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">→ ↑ PTH (hiperparatiroidismo 2.º)</text><line x1="728.7" y1="303.9" x2="841.8" y2="254.6" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/><rect x="80.0" y="470.0" width="280.0" height="100.0" rx="8" fill="#F5F3EE" stroke="#111111" stroke-width="2" opacity="1"/><text x="94.0" y="498.0" font-size="17" fill="#111111" text-anchor="start" font-weight="700">Acidosis metabólica</text><text x="94.0" y="524.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">↓ excreción de ácido</text><text x="94.0" y="545.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">anión gap normal y luego alto</text><line x1="474.6" y1="412.8" x2="364.4" y2="459.2" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/><rect x="870.0" y="470.0" width="280.0" height="100.0" rx="8" fill="#F5F3EE" stroke="#111111" stroke-width="2" opacity="1"/><text x="884.0" y="498.0" font-size="17" fill="#111111" text-anchor="start" font-weight="700">Hiperkalemia</text><text x="884.0" y="524.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">↓ excreción de K</text><text x="884.0" y="545.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">ojo con IECA/ARA II</text><line x1="735.3" y1="412.8" x2="854.2" y2="459.2" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/><rect x="470.0" y="560.0" width="280.0" height="100.0" rx="8" fill="#F5F3EE" stroke="#111111" stroke-width="2" opacity="1"/><text x="484.0" y="588.0" font-size="17" fill="#111111" text-anchor="start" font-weight="700">HTA y edema</text><text x="484.0" y="614.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">retención de sodio y agua</text><line x1="603.3" y1="442.5" x2="606.2" y2="515.0" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/></svg>