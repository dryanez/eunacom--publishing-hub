<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs><rect width="1200" height="700" fill="#FFFFFF"/><text x="40.0" y="46.0" font-size="26" fill="#111111" text-anchor="start" font-weight="700">Densitometría ósea (DEXA): cómo leer el T-score</text><text x="40.0" y="74.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">Mujer de 64 años, columna lumbar L1-L4</text><rect x="120.0" y="300.0" width="240.0" height="70.0" rx="0" fill="#B4322A" stroke="none" stroke-width="0" opacity="0.22"/><text x="240.0" y="344.0" font-size="20" fill="#B4322A" text-anchor="middle" font-weight="700">Osteoporosis</text><rect x="360.0" y="300.0" width="240.0" height="70.0" rx="0" fill="#B45309" stroke="none" stroke-width="0" opacity="0.22"/><text x="480.0" y="344.0" font-size="20" fill="#B45309" text-anchor="middle" font-weight="700">Osteopenia</text><rect x="600.0" y="300.0" width="480.0" height="70.0" rx="0" fill="#2F6B3F" stroke="none" stroke-width="0" opacity="0.22"/><text x="840.0" y="344.0" font-size="20" fill="#2F6B3F" text-anchor="middle" font-weight="700">Normal</text><line x1="120.0" y1="370.0" x2="120.0" y2="382.0" stroke="#111111" stroke-width="1.5"/><text x="120.0" y="404.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="600">-4</text><line x1="280.0" y1="370.0" x2="280.0" y2="382.0" stroke="#111111" stroke-width="1.5"/><text x="280.0" y="404.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="600">-3</text><line x1="360.0" y1="370.0" x2="360.0" y2="382.0" stroke="#111111" stroke-width="1.5"/><text x="360.0" y="404.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="600">-2,5</text><line x1="440.0" y1="370.0" x2="440.0" y2="382.0" stroke="#111111" stroke-width="1.5"/><text x="440.0" y="404.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="600">-2</text><line x1="600.0" y1="370.0" x2="600.0" y2="382.0" stroke="#111111" stroke-width="1.5"/><text x="600.0" y="404.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="600">-1</text><line x1="760.0" y1="370.0" x2="760.0" y2="382.0" stroke="#111111" stroke-width="1.5"/><text x="760.0" y="404.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="600">0</text><line x1="920.0" y1="370.0" x2="920.0" y2="382.0" stroke="#111111" stroke-width="1.5"/><text x="920.0" y="404.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="600">+1</text><line x1="1080.0" y1="370.0" x2="1080.0" y2="382.0" stroke="#111111" stroke-width="1.5"/><text x="1080.0" y="404.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="600">+2</text><text x="600.0" y="440.0" font-size="15" fill="#57534E" text-anchor="middle" font-weight="400">T-score (desviaciones estándar respecto del adulto joven)</text><line x1="312.0" y1="240.0" x2="312.0" y2="370.0" stroke="#111111" stroke-width="3"/><circle cx="312.0" cy="240.0" r="9.0" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="326.0" y="234.0" font-size="20" fill="#111111" text-anchor="start" font-weight="700">Paciente: T = −2,8</text><rect x="120.0" y="520.0" width="960.0" height="120.0" rx="8" fill="#F5F3EE" stroke="#DCD8CE" stroke-width="1" opacity="1"/><text x="140.0" y="555.0" font-size="16" fill="#111111" text-anchor="start" font-weight="700">T-score ≤ −2,5 = osteoporosis (en posmenopáusicas y hombres &gt; 50 años).</text><text x="140.0" y="585.0" font-size="16" fill="#111111" text-anchor="start" font-weight="400">Una fractura por fragilidad de cadera o vértebra es osteoporosis aunque el T-score no llegue.</text><text x="140.0" y="615.0" font-size="16" fill="#57534E" text-anchor="start" font-weight="400">Z-score (comparado con su edad) se usa en premenopáusicas, hombres jóvenes y niños.</text></svg>