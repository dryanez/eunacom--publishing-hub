<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs><rect width="1200" height="640" fill="#FFFFFF"/><text x="40.0" y="46.0" font-size="26" fill="#111111" text-anchor="start" font-weight="700">Defecto pupilar aferente relativo (pupila de Marcus Gunn)</text><text x="40.0" y="74.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">Prueba de la linterna oscilante: lesión del nervio óptico DERECHO</text><text x="420.0" y="120.0" font-size="15" fill="#B4322A" text-anchor="middle" font-weight="700">Ojo derecho (enfermo)</text><text x="720.0" y="120.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="700">Ojo izquierdo (sano)</text><ellipse cx="420.0" cy="210.0" rx="90.0" ry="48.0" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><circle cx="420.0" cy="210.0" r="40.0" fill="#9CA3AF" stroke="#111111" stroke-width="1.5"/><circle cx="420.0" cy="210.0" r="12.0" fill="#111111" stroke="#111111" stroke-width="1.5"/><ellipse cx="720.0" cy="210.0" rx="90.0" ry="48.0" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><circle cx="720.0" cy="210.0" r="40.0" fill="#9CA3AF" stroke="#111111" stroke-width="1.5"/><circle cx="720.0" cy="210.0" r="12.0" fill="#111111" stroke="#111111" stroke-width="1.5"/><path d="M540,300 L680,230 L690,250 Z" fill="#FDE68A" stroke="#B45309" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="860.0" y="216.0" font-size="16" fill="#111111" text-anchor="start" font-weight="600">Luz en el sano: ambas se contraen</text><ellipse cx="420.0" cy="380.0" rx="90.0" ry="48.0" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><circle cx="420.0" cy="380.0" r="40.0" fill="#9CA3AF" stroke="#111111" stroke-width="1.5"/><circle cx="420.0" cy="380.0" r="22.0" fill="#111111" stroke="#111111" stroke-width="1.5"/><path d="M240,470 L380,400 L390,420 Z" fill="#FDE68A" stroke="#B45309" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><ellipse cx="720.0" cy="380.0" rx="90.0" ry="48.0" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><circle cx="720.0" cy="380.0" r="40.0" fill="#9CA3AF" stroke="#111111" stroke-width="1.5"/><circle cx="720.0" cy="380.0" r="22.0" fill="#111111" stroke="#111111" stroke-width="1.5"/><text x="860.0" y="386.0" font-size="16" fill="#111111" text-anchor="start" font-weight="600">Luz en el enfermo: ambas se DILATAN</text><text x="60.0" y="520.0" font-size="15" fill="#111111" text-anchor="start" font-weight="400">La vía eferente está intacta (ambas pupilas responden igual); falla la entrada de luz del ojo enfermo.</text><text x="60.0" y="548.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">Causas: neuritis óptica, isquemia del nervio, desprendimiento de retina extenso. No la produce la catarata.</text></svg>