t><text x="760.0" y="192.0" font-size="16" fill="#0369A1" text-anchor="start" font-weight="400">Miopía: lente divergente (cóncavo, −)</text><text x="760.0" y="220.0" font-size="16" fill="#2F6B3F" text-anchor="start" font-weight="400">Hipermetropía: lente convergente (+)</text><text x="760.0" y="248.0" font-size="16" fill="#111111" text-anchor="start" font-weight="400">Presbicia: pérdida de acomodación &gt; 40 años</text><text x="760.0" y="276.0" font-size="16" fill="#111111" text-anchor="start" font-weight="400">Astigmatismo: lente cilíndrico</text><text x="60.0" y="730.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">En el niño, un vicio no corregido o un estrabismo pueden causar ambliopía: tratar antes de los 7-8 años.</text></svg>