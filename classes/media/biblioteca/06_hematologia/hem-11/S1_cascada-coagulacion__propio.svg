<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs><rect width="1200" height="720" fill="#FFFFFF"/><text x="40.0" y="46.0" font-size="26" fill="#111111" text-anchor="start" font-weight="700">Cascada de la coagulación y sus exámenes</text><text x="40.0" y="74.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">Modelo clásico: útil para interpretar TP/INR y TTPK</text><rect x="60.0" y="110.0" width="320.0" height="220.0" rx="8" fill="#F5F3EE" stroke="#0369A1" stroke-width="2" opacity="1"/><text x="74.0" y="138.0" font-size="17" fill="#0369A1" text-anchor="start" font-weight="700">Vía intrínseca</text><text x="74.0" y="164.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">XII → XI → IX</text><text x="74.0" y="185.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">IX + VIII (cofactor)</text><text x="74.0" y="206.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400"></text><text x="74.0" y="227.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Mide: TTPK</text><text x="74.0" y="248.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Hemofilia A (VIII), B (IX)</text><text x="74.0" y="269.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Heparina no fraccionada</text><rect x="820.0" y="110.0" width="320.0" height="220.0" rx="8" fill="#F5F3EE" stroke="#2F6B3F" stroke-width="2" opacity="1"/><text x="834.0" y="138.0" font-size="17" fill="#2F6B3F" text-anchor="start" font-weight="700">Vía extrínseca</text><text x="834.0" y="164.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Factor tisular + VII</text><text x="834.0" y="185.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400"></text><text x="834.0" y="206.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400"></text><text x="834.0" y="227.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Mide: TP / INR</text><text x="834.0" y="248.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Primero en caer con</text><text x="834.0" y="269.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">déficit de vit. K y warfarina</text><rect x="380.0" y="400.0" width="440.0" height="240.0" rx="8" fill="#F5F3EE" stroke="#B4322A" stroke-width="2" opacity="1"/><text x="394.0" y="428.0" font-size="17" fill="#B4322A" text-anchor="start" font-weight="700">Vía común</text><text x="394.0" y="454.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">X + V (cofactor)</text><text x="394.0" y="475.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">↓</text><text x="394.0" y="496.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">II protrombina → trombina</text><text x="394.0" y="517.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">↓</text><text x="394.0" y="538.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Fibrinógeno → fibrina (+ XIII)</text><line x1="300.0" y1="330.0" x2="470.0" y2="400.0" stroke="#0369A1" stroke-width="3" marker-end="url(#ah)"/><line x1="900.0" y1="330.0" x2="730.0" y2="400.0" stroke="#2F6B3F" stroke-width="3" marker-end="url(#ah)"/><rect x="60.0" y="660.0" width="1080.0" height="46.0" rx="6" fill="#F5F3EE" stroke="#DCD8CE" stroke-width="1" opacity="1"/><text x="80.0" y="690.0" font-size="16" fill="#111111" text-anchor="start" font-weight="600">Dependientes de vitamina K: II, VII, IX, X (y proteínas C y S).  Warfarina: TP/INR.  Heparina: TTPK.</text></svg>