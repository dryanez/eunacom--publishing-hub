<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs><rect width="1200" height="640" fill="#FFFFFF"/><text x="40.0" y="46.0" font-size="26" fill="#111111" text-anchor="start" font-weight="700">Clasificación de Borrmann del cáncer gástrico avanzado</text><text x="40.0" y="74.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">Corte de la pared gástrica: mucosa arriba (rosado), capa muscular abajo</text><rect x="40.0" y="260.0" width="250.0" height="26.0" rx="0" fill="#F4C7C3" stroke="none" stroke-width="0" opacity="1"/><rect x="40.0" y="286.0" width="250.0" height="40.0" rx="0" fill="#FBE3D6" stroke="none" stroke-width="0" opacity="1"/><rect x="40.0" y="326.0" width="250.0" height="50.0" rx="0" fill="#E9A6A0" stroke="none" stroke-width="0" opacity="1"/><path d="M95.0,260 C95.0,140 235.0,140 235.0,260 Z" fill="#7F1D1D" stroke="#111111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="165.0" y="130.0" font-size="22" fill="#111111" text-anchor="middle" font-weight="700">Tipo I</text><text x="165.0" y="158.0" font-size="16" fill="#B4322A" text-anchor="middle" font-weight="700">Polipoide</text><text x="165.0" y="430.0" font-size="14" fill="#57534E" text-anchor="middle" font-weight="400">Masa que protruye, bien delimitada</text><rect x="325.0" y="260.0" width="250.0" height="26.0" rx="0" fill="#F4C7C3" stroke="none" stroke-width="0" opacity="1"/><rect x="325.0" y="286.0" width="250.0" height="40.0" rx="0" fill="#FBE3D6" stroke="none" stroke-width="0" opacity="1"/><rect x="325.0" y="326.0" width="250.0" height="50.0" rx="0" fill="#E9A6A0" stroke="none" stroke-width="0" opacity="1"/><path d="M360.0,260 C360.0,205 405.0,205 415.0,250 L425.0,290 L475.0,290 L485.0,250 C495.0,205 540.0,205 540.0,260 Z" fill="#7F1D1D" stroke="#111111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><path d="M415.0,250 L425.0,290 L475.0,290 L485.0,250 Z" fill="#FFFFFF" stroke="#111111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="450.0" y="130.0" font-size="22" fill="#111111" text-anchor="middle" font-weight="700">Tipo II</text><text x="450.0" y="158.0" font-size="16" fill="#B4322A" text-anchor="middle" font-weight="700">Ulcerado, bordes netos</text><text x="450.0" y="430.0" font-size="14" fill="#57534E" text-anchor="middle" font-weight="400">Úlcera con bordes elevados</text><rect x="610.0" y="260.0" width="250.0" height="26.0" rx="0" fill="#F4C7C3" stroke="none" stroke-width="0" opacity="1"/><rect x="610.0" y="286.0" width="250.0" height="40.0" rx="0" fill="#FBE3D6" stroke="none" stroke-width="0" opacity="1"/><rect x="610.0" y="326.0" width="250.0" height="50.0" rx="0" fill="#E9A6A0" stroke="none" stroke-width="0" opacity="1"/><path d="M625.0,264 C655.0,238 685.0,240 700.0,260 L710.0,298 L760.0,298 L770.0,260 C785.0,240 815.0,238 845.0,264 L825.0,330 L645.0,330 Z" fill="#7F1D1D" stroke="#111111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/><path d="M700.0,260 L710.0,298 L760.0,298 L770.0,260 Z" fill="#FFFFFF" stroke="#111111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="735.0" y="130.0" font-size="22" fill="#111111" text-anchor="middle" font-weight="700">Tipo III</text><text x="735.0" y="158.0" font-size="16" fill="#B4322A" text-anchor="middle" font-weight="700">Ulcerado infiltrante</text><text x="735.0" y="430.0" font-size="14" fill="#57534E" text-anchor="middle" font-weight="400">Bordes mal definidos, infiltra</text><rect x="895.0" y="260.0" width="250.0" height="26.0" rx="0" fill="#F4C7C3" stroke="none" stroke-width="0" opacity="1"/><rect x="895.0" y="286.0" width="250.0" height="40.0" rx="0" fill="#FBE3D6" stroke="none" stroke-width="0" opacity="1"/><rect x="895.0" y="326.0" width="250.0" height="50.0" rx="0" fill="#E9A6A0" stroke="none" stroke-width="0" opacity="1"/><rect x="895.0" y="250.0" width="250.0" height="125.0" rx="0" fill="#7F1D1D" stroke="none" stroke-width="0" opacity="0.75"/><text x="1020.0" y="130.0" font-size="22" fill="#111111" text-anchor="middle" font-weight="700">Tipo IV</text><text x="1020.0" y="158.0" font-size="16" fill="#B4322A" text-anchor="middle" font-weight="700">Infiltrante difuso</text><text x="1020.0" y="430.0" font-size="14" fill="#57534E" text-anchor="middle" font-weight="400">Linitis plástica: estómago rígido</text><text x="40.0" y="520.0" font-size="16" fill="#111111" text-anchor="start" font-weight="400">El Borrmann describe el aspecto macroscópico (endoscopía). El tipo IV es el de peor pronóstico.</text><text x="40.0" y="548.0" font-size="16" fill="#57534E" text-anchor="start" font-weight="400">El cáncer gástrico incipiente (limitado a mucosa y submucosa) se clasifica aparte (japonesa, tipos 0).</text></svg>