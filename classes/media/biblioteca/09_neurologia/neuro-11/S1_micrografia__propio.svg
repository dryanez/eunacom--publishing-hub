<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs><rect width="1200" height="560" fill="#FFFFFF"/><text x="40.0" y="46.0" font-size="26" fill="#111111" text-anchor="start" font-weight="700">Micrografía en la enfermedad de Parkinson</text><text x="40.0" y="74.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">La letra se va achicando a lo largo de la línea</text><text x="60.0" y="240.0" font-size="48.0" fill="#111111" text-anchor="start" font-weight="400" font-style="italic">Hoy</text><text x="162.2" y="240.0" font-size="44.4" fill="#111111" text-anchor="start" font-weight="400" font-style="italic">es</text><text x="231.9" y="240.0" font-size="40.8" fill="#111111" text-anchor="start" font-weight="400" font-style="italic">un</text><text x="296.0" y="240.0" font-size="37.2" fill="#111111" text-anchor="start" font-weight="400" font-style="italic">buen</text><text x="396.1" y="240.0" font-size="33.6" fill="#111111" text-anchor="start" font-weight="400" font-style="italic">día</text><text x="467.6" y="240.0" font-size="30.0" fill="#111111" text-anchor="start" font-weight="400" font-style="italic">para</text><text x="548.3" y="240.0" font-size="26.4" fill="#111111" text-anchor="start" font-weight="400" font-style="italic">caminar</text><text x="663.7" y="240.0" font-size="22.8" fill="#111111" text-anchor="start" font-weight="400" font-style="italic">por</text><text x="712.3" y="240.0" font-size="19.2" fill="#111111" text-anchor="start" font-weight="400" font-style="italic">el</text><text x="742.4" y="240.0" font-size="15.600000000000001" fill="#111111" text-anchor="start" font-weight="400" font-style="italic">parque</text><text x="60.0" y="330.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">Escritura normal, para comparar:</text><text x="60.0" y="380.0" font-size="32" fill="#111111" text-anchor="start" font-weight="400" font-style="italic">Hoy es un buen día para caminar por el parque</text><text x="60.0" y="470.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">Parte de la bradicinesia: los movimientos repetidos pierden amplitud (también al golpear los dedos).</text></svg>