<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs><rect width="1200" height="560" fill="#FFFFFF"/><text x="40.0" y="46.0" font-size="26" fill="#111111" text-anchor="start" font-weight="700">Cascada de prescripción en el adulto mayor</text><text x="40.0" y="74.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">Un efecto adverso se confunde con un problema nuevo y se trata con otro fármaco</text><rect x="40.0" y="200.0" width="160.0" height="110.0" rx="10" fill="#F5F3EE" stroke="#111111" stroke-width="2" opacity="1"/><text x="120.0" y="245.0" font-size="17" fill="#111111" text-anchor="middle" font-weight="700">Amlodipino</text><text x="120.0" y="272.0" font-size="14" fill="#57534E" text-anchor="middle" font-weight="400">para la HTA</text><line x1="202.0" y1="255.0" x2="228.0" y2="255.0" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/><rect x="230.0" y="200.0" width="160.0" height="110.0" rx="10" fill="#FEF2F2" stroke="#B4322A" stroke-width="2" opacity="1"/><text x="310.0" y="245.0" font-size="17" fill="#B4322A" text-anchor="middle" font-weight="700">Edema maleolar</text><text x="310.0" y="272.0" font-size="14" fill="#57534E" text-anchor="middle" font-weight="400">efecto adverso</text><line x1="392.0" y1="255.0" x2="418.0" y2="255.0" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/><rect x="420.0" y="200.0" width="160.0" height="110.0" rx="10" fill="#F5F3EE" stroke="#111111" stroke-width="2" opacity="1"/><text x="500.0" y="245.0" font-size="17" fill="#111111" text-anchor="middle" font-weight="700">Furosemida</text><text x="500.0" y="272.0" font-size="14" fill="#57534E" text-anchor="middle" font-weight="400">para el edema</text><line x1="582.0" y1="255.0" x2="608.0" y2="255.0" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/><rect x="610.0" y="200.0" width="160.0" height="110.0" rx="10" fill="#FEF2F2" stroke="#B4322A" stroke-width="2" opacity="1"/><text x="690.0" y="245.0" font-size="17" fill="#B4322A" text-anchor="middle" font-weight="700">Incontinencia</text><text x="690.0" y="272.0" font-size="14" fill="#57534E" text-anchor="middle" font-weight="400">por la diuresis</text><line x1="772.0" y1="255.0" x2="798.0" y2="255.0" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/><rect x="800.0" y="200.0" width="160.0" height="110.0" rx="10" fill="#F5F3EE" stroke="#111111" stroke-width="2" opacity="1"/><text x="880.0" y="245.0" font-size="17" fill="#111111" text-anchor="middle" font-weight="700">Oxibutinina</text><text x="880.0" y="272.0" font-size="14" fill="#57534E" text-anchor="middle" font-weight="400">anticolinérgico</text><line x1="962.0" y1="255.0" x2="988.0" y2="255.0" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/><rect x="990.0" y="200.0" width="160.0" height="110.0" rx="10" fill="#FEF2F2" stroke="#B4322A" stroke-width="2" opacity="1"/><text x="1070.0" y="245.0" font-size="17" fill="#B4322A" text-anchor="middle" font-weight="700">Delirium</text><text x="1070.0" y="272.0" font-size="14" fill="#57534E" text-anchor="middle" font-weight="400">caída, fractura</text><text x="40.0" y="400.0" font-size="17" fill="#111111" text-anchor="start" font-weight="700">La salida correcta: ante un síntoma nuevo, pregunta primero qué fármaco empezó antes.</text><text x="40.0" y="432.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">Herramientas: criterios de Beers y STOPP/START. Revisa la lista completa de fármacos en cada control.</text></svg>