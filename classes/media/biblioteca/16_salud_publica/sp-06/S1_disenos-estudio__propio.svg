<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs><rect width="1200" height="700" fill="#FFFFFF"/><text x="40.0" y="46.0" font-size="26" fill="#111111" text-anchor="start" font-weight="700">Diseños de estudios epidemiológicos</text><text x="40.0" y="74.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">Dos preguntas ordenan todo: ¿quién asigna la exposición? y ¿en qué dirección se mira?</text><rect x="420.0" y="100.0" width="360.0" height="70.0" rx="8" fill="#F5F3EE" stroke="#111111" stroke-width="2" opacity="1"/><text x="434.0" y="128.0" font-size="16" fill="#111111" text-anchor="start" font-weight="700">¿El investigador asigna la exposición?</text><rect x="780.0" y="220.0" width="360.0" height="120.0" rx="8" fill="#F5F3EE" stroke="#2F6B3F" stroke-width="2" opacity="1"/><text x="794.0" y="248.0" font-size="17" fill="#2F6B3F" text-anchor="start" font-weight="700">Sí: EXPERIMENTAL</text><text x="794.0" y="274.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Ensayo clínico aleatorizado</text><text x="794.0" y="295.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Mejor evidencia de causalidad</text><rect x="60.0" y="220.0" width="420.0" height="70.0" rx="8" fill="#F5F3EE" stroke="#0369A1" stroke-width="2" opacity="1"/><text x="74.0" y="248.0" font-size="15" fill="#0369A1" text-anchor="start" font-weight="700">No: OBSERVACIONAL. ¿Hay grupo de comparación?</text><line x1="700.0" y1="170.0" x2="900.0" y2="220.0" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/><line x1="500.0" y1="170.0" x2="300.0" y2="220.0" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/><rect x="60.0" y="340.0" width="300.0" height="160.0" rx="8" fill="#F5F3EE" stroke="#57534E" stroke-width="2" opacity="1"/><text x="74.0" y="368.0" font-size="17" fill="#57534E" text-anchor="start" font-weight="700">No: DESCRIPTIVO</text><text x="74.0" y="394.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Reporte / serie de casos</text><text x="74.0" y="415.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Transversal (prevalencia)</text><text x="74.0" y="436.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Ecológico</text><rect x="400.0" y="340.0" width="360.0" height="300.0" rx="8" fill="#F5F3EE" stroke="#0369A1" stroke-width="2" opacity="1"/><text x="414.0" y="368.0" font-size="17" fill="#0369A1" text-anchor="start" font-weight="700">Sí: ANALÍTICO</text><text x="414.0" y="394.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Cohorte: exposición → desenlace</text><text x="414.0" y="415.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">   mide incidencia, RR</text><text x="414.0" y="436.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400"></text><text x="414.0" y="457.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Casos y controles: desenlace →</text><text x="414.0" y="478.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">   exposición; mide OR, ideal</text><text x="414.0" y="499.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">   para enfermedades raras</text><text x="414.0" y="520.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400"></text><text x="414.0" y="541.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Transversal analítico: ambos</text><text x="414.0" y="562.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">   al mismo tiempo</text><line x1="170.0" y1="290.0" x2="200.0" y2="340.0" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/><line x1="380.0" y1="290.0" x2="520.0" y2="340.0" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/></svg>