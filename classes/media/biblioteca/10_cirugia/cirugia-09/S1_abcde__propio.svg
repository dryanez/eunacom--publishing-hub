<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs><rect width="1200" height="600" fill="#FFFFFF"/><text x="40.0" y="46.0" font-size="26" fill="#111111" text-anchor="start" font-weight="700">Evaluación primaria del politraumatizado (ATLS)</text><text x="40.0" y="74.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">En orden, y resolviendo cada problema antes de pasar al siguiente</text><rect x="60.0" y="120.0" width="74.0" height="74.0" rx="8" fill="#B4322A" stroke="none" stroke-width="0" opacity="1"/><text x="97.0" y="170.0" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="700">A</text><text x="160.0" y="152.0" font-size="20" fill="#111111" text-anchor="start" font-weight="700">Vía aérea + columna cervical</text><text x="160.0" y="178.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">Habla = vía aérea permeable. Collar cervical.</text><rect x="60.0" y="210.0" width="74.0" height="74.0" rx="8" fill="#B4322A" stroke="none" stroke-width="0" opacity="1"/><text x="97.0" y="260.0" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="700">B</text><text x="160.0" y="242.0" font-size="20" fill="#111111" text-anchor="start" font-weight="700">Ventilación</text><text x="160.0" y="268.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">Neumotórax a tensión, hemotórax masivo, tórax volante.</text><rect x="60.0" y="300.0" width="74.0" height="74.0" rx="8" fill="#B4322A" stroke="none" stroke-width="0" opacity="1"/><text x="97.0" y="350.0" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="700">C</text><text x="160.0" y="332.0" font-size="20" fill="#111111" text-anchor="start" font-weight="700">Circulación + control de hemorragia</text><text x="160.0" 