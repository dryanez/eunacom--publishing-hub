<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs><rect width="1200" height="680" fill="#FFFFFF"/><text x="40.0" y="46.0" font-size="26" fill="#111111" text-anchor="start" font-weight="700">Hernia inguinal directa vs indirecta</text><text x="40.0" y="74.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">Región inguinal derecha vista desde adelante. La referencia son los vasos epigástricos inferiores.</text><rect x="80.0" y="110.0" width="640.0" height="480.0" rx="10" fill="#FDF2E9" stroke="none" stroke-width="0" opacity="1"/><line x1="140.0" y1="520.0" x2="680.0" y2="330.0" stroke="#111111" stroke-width="4"/><text x="200.0" y="552.0" font-size="14" fill="#111111" text-anchor="start" font-weight="700" transform="rotate(-19 200.0 552.0)">Ligamento inguinal</text><line x1="250.0" y1="140.0" x2="250.0" y2="520.0" stroke="#111111" stroke-width="3"/><text x="232.0" y="160.0" font-size="13" fill="#57534E" text-anchor="end" font-weight="400">Borde lateral</text><text x="232.0" y="178.0" font-size="13" fill="#57534E" text-anchor="end" font-weight="400">del recto</text><path d="M450,415 C440,330 420,240 400,140" fill="none" stroke="#B4322A" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="470.0" y="200.0" font-size="14" fill="#B4322A" text-anchor="start" font-weight="700">Vasos epigástricos</text><text x="470.0" y="218.0" font-size="14" fill="#B4322A" text-anchor="start" font-weight="700">inferiores</text><path d="M250,470 L250,250 L432,330 L450,415 Z" fill="#0369A1" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" opacity="0.18"/><text x="330.0" y="400.0" font-size="14" fill="#0369A1" text-anchor="middle" font-weight="700">Triángulo de</text><text x="330.0" y="418.0" font-size="14" fill="#0369A1" text-anchor="middle" font-weight="700">Hesselbach</text><circle cx="560.0" cy="370.0" r="24.0" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><text x="560.0" y="330.0" font-size="13" fill="#57534E" text-anchor="middle" font-weight="400">Anillo profundo</text><circle cx="330.0" cy="340.0" r="16.0" fill="#0369A1" stroke="#111111" stroke-width="2"/><circle cx="560.0" cy="370.0" r="14.0" fill="#2F6B3F" stroke="#111111" stroke-width="2"/><rect x="760.0" y="130.0" width="400.0" height="180.0" rx="8" fill="#F5F3EE" stroke="#0369A1" stroke-width="2" opacity="1"/><text x="774.0" y="158.0" font-size="17" fill="#0369A1" text-anchor="start" font-weight="700">Directa</text><text x="774.0" y="184.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Medial a los vasos epigástricos</text><text x="774.0" y="205.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Por debilidad de la pared posterior</text><text x="774.0" y="226.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">(fascia transversalis)</text><text x="774.0" y="247.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Adulto mayor, esfuerzo</text><rect x="760.0" y="330.0" width="400.0" height="180.0" rx="8" fill="#F5F3EE" stroke="#2F6B3F" stroke-width="2" opacity="1"/><text x="774.0" y="358.0" font-size="17" fill="#2F6B3F" text-anchor="start" font-weight="700">Indirecta</text><text x="774.0" y="384.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Lateral a los vasos epigástricos</text><text x="774.0" y="405.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">Entra por el anillo profundo</text><text x="774.0" y="426.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">y sigue el cordón</text><text x="774.0" y="447.0" font-size="14" fill="#111111" text-anchor="start" font-weight="400">La más frecuente (también en niños)</text><text x="80.0" y="640.0" font-size="15" fill="#57534E" text-anchor="start" font-weight="400">Crural (femoral): por debajo del ligamento inguinal, más en mujeres, la que más se estrangula.</text></svg>