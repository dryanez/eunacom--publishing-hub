<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 42 743 320" width="100%" height="240px" style="max-width:743px;height:240px;font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 1. SOSPECHA Y TAC PREVIO -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="55" width="215" height="102" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="20" y="55" width="215" height="22" rx="6" fill="url(#redGrad)"/>
    <text x="127" y="70" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">1. ¿TAC ANTES DE PUNCIÓN LUMBAR?</text>
    <text x="30" y="93" fill="#991b1b" font-size="8" font-weight="700">• Déficit focal motor o pupilar</text>
    <text x="30" y="106" fill="#334155" font-size="8">• Coma / Glasgow &lt; 10</text>
    <text x="30" y="119" fill="#334155" font-size="8">• Papiledema en fondo de ojo</text>
    <text x="30" y="132" fill="#334155" font-size="8">• Inmunodeprimido o convulsión reciente</text>
    <text x="30" y="146" fill="#dc2626" font-size="7.5" font-weight="700">→ Si hay (+): Hemocultivos + ATB → TAC</text>
  </g>

  <path d="M 235 106 L 265 106" stroke="#64748b" stroke-width="2"/>

  <!-- 2. CONDUCTA Y DEXAMETASONA -->
  <g filter="url(#cardShadow)">
    <rect x="270" y="55" width="210" height="102" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <rect x="270" y="55" width="210" height="22" rx="6" fill="url(#amberGrad)"/>
    <text x="375" y="70" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">2. PUNCIÓN LUMBAR Y DEXA</text>
    <text x="280" y="93" fill="#92400e" font-size="8.5" font-weight="700">• Sin banderas rojas: PL INMEDIATA</text>
    <text x="280" y="107" fill="#1e3a8a" font-size="8" font-weight="700">• Dexametasona 10 mg EV:</text>
    <text x="280" y="120" fill="#334155" font-size="8">  15-20 min ANTES o junto con 1° dosis ATB</text>
    <text x="280" y="133" fill="#047857" font-size="8">  Reduce pérdida auditiva por Neumococo</text>
    <text x="280" y="146" fill="#991b1b" font-size="7.5">  No dar si el ATB ya lleva &gt; 2 horas</text>
  </g>

  <path d="M 480 106 L 510 106" stroke="#64748b" stroke-width="2"/>

  <!-- 3. ESQUEMA EMPÍRICO SEGÚN EDAD -->
  <g filter="url(#cardShadow)">
    <rect x="515" y="55" width="205" height="102" rx="6" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.5"/>
    <rect x="515" y="55" width="205" height="22" rx="6" fill="url(#blueGrad)"/>
    <text x="617" y="70" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">3. ANTIBIÓTICOS EMPÍRICOS</text>
    <text x="525" y="92" fill="#1e3a8a" font-size="8" font-weight="700">• &lt; 3 meses:</text>
    <text x="525" y="104" fill="#334155" font-size="7.8">  Ampicilina + Cefotaxima EV</text>
    <text x="525" y="117" fill="#1e3a8a" font-size="8" font-weight="700">• 3 meses a 50 años:</text>
    <text x="525" y="129" fill="#334155" font-size="7.8">  Ceftriaxona 2g c/12h + Vancomicina</text>
    <text x="525" y="142" fill="#dc2626" font-size="8" font-weight="700">• &gt; 50 años o Inmunodeprimido:</text>
    <text x="525" y="153" fill="#991b1b" font-size="7.5">  + Ampicilina 2g c/4h EV (Listeria)</text>
  </g>

  <!-- Bottom Box: LCR PATRONES Y PROFILAXIS -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="172" width="700" height="135" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="20" y="172" width="700" height="22" rx="6" fill="#1e293b"/>
    <text x="370" y="187" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">PATRONES DE LÍQUIDO CEFALORRAQUÍDEO (LCR) Y PROFILAXIS DE CONTACTOS</text>
    
    <text x="35" y="210" fill="#dc2626" font-size="8.5" font-weight="700">LCR Bacteriano Típico:</text>
    <text x="35" y="224" fill="#334155" font-size="8">• Turbio/purulento · Leucocitos 1.000-10.000 /mm³</text>
    <text x="35" y="238" fill="#1e3a8a" font-size="8" font-weight="700">• Predominio Polimorfonuclear (PMN &gt; 80 %)</text>
    <text x="35" y="252" fill="#dc2626" font-size="8" font-weight="700">• Glucosa LCR/plasma &lt; 0.4 (hipoglucorraquia)</text>
    <text x="35" y="266" fill="#334155" font-size="8">• Proteínas marcadamente elevadas (&gt; 100-500 mg/dL)</text>

    <text x="275" y="210" fill="#047857" font-size="8.5" font-weight="700">LCR Viral (Aséptico):</text>
    <text x="275" y="224" fill="#334155" font-size="8">• Claro/cristal de roca · Leucocitos &lt; 500 /mm³</text>
    <text x="275" y="238" fill="#047857" font-size="8" font-weight="700">• Predominio Mononuclear (Linfocitos &gt; 80 %)</text>
    <text x="275" y="252" fill="#047857" font-size="8" font-weight="700">• Glucosa rigurosamente NORMAL (&gt; 0.6)</text>
    <text x="275" y="266" fill="#334155" font-size="8">• Proteínas normales o leve aumento (&lt; 100 mg/dL)</text>

    <text x="515" y="210" fill="#b45309" font-size="8.5" font-weight="700">Profilaxis Contactos Meningococo:</text>
    <text x="515" y="224" fill="#334155" font-size="8">• 1ª línea: Rifampicina 600 mg c/12h x 2 días</text>
    <text x="515" y="238" fill="#334155" font-size="8">• Alternativa: Ciprofloxacino 500 mg VO x 1 vez</text>
    <text x="515" y="252" fill="#b45309" font-size="8" font-weight="700">• En EMBARAZADAS: Ceftriaxona 250 mg IM</text>
    <text x="515" y="266" fill="#334155" font-size="8">• Contactos estrechos en los últimos 7 días</text>
  </g>
</svg>
