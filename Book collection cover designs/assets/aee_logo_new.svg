<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="aeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0bd9e7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0bd9e7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON EMBLEM -->
  <g transform="translate(10, 10)">
    <!-- Hexagonal / Shield Outer Ring -->
    <polygon points="50,2 92,26 92,74 50,98 8,74 8,26" fill="#0b1420" stroke="url(#aeeGrad)" stroke-width="3" stroke-linejoin="round" />
    <polygon points="50,8 86,29 86,71 50,92 14,71 14,29" fill="none" stroke="rgba(11,217,231,0.25)" stroke-width="1" />

    <!-- Stylized Medical Cross & Asclepius Serpent -->
    <path d="M43,26 H57 V43 H74 V57 H57 V74 H43 V57 H26 V43 H43 Z" fill="rgba(37,99,235,0.2)" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" />
    
    <!-- Central Asclepius Staff & Serpent -->
    <line x1="50" y1="20" x2="50" y2="80" stroke="#0bd9e7" stroke-width="3" stroke-linecap="round" />
    <circle cx="50" cy="18" r="3.5" fill="#0bd9e7" />
    
    <path d="M38,32 C48,27 60,33 52,43 C42,51 40,58 52,65 C60,70 54,77 48,77" fill="none" stroke="url(#accentGrad)" stroke-width="3.2" stroke-linecap="round" filter="url(#glow)" />
  </g>

  <!-- TYPOGRAPHY: AEE -->
  <g transform="translate(130, 20)">
    <text x="0" y="52" font-family="'Archivo', 'Montserrat', 'Helvetica Neue', sans-serif" font-size="56" font-weight="900" letter-spacing="-1" fill="#ffffff">
      A<tspan fill="url(#aeeGrad)">E</tspan>E
    </text>

    <text x="2" y="74" font-family="'Archivo', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="800" letter-spacing="3.5" fill="#0bd9e7" text-transform="uppercase">
      ACADEMIA EXAMEN EUNACOM
    </text>

    <text x="3" y="89" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="500" letter-spacing="2" fill="#94a3b8" text-transform="uppercase">
      PREPARACIÓN MÉDICA DE EXCELENCIA · CHILE
    </text>

    <rect x="2" y="60" width="360" height="1.5" fill="rgba(255,255,255,0.15)" />
    <rect x="2" y="60" width="80" height="2" fill="url(#aeeGrad)" />
  </g>
</svg>
